function showBook(mode){close();let b=$('book');b.hidden=false;b.replaceChildren();let title=document.createElement('h2');title.textContent=mode==='bag'?L('My backpack','我的背包'):mode==='passport'?L('Village passport','村庄护照'):L('Discovery journal','探索图鉴');b.append(title);let done=items.filter(a=>data.items[a[0]]).length;let p=document.createElement('p');p.textContent=done+'/'+items.length+' '+L('discovered','已发现');b.append(p);for(let a of items){if(mode==='bag'&&!data.items[a[0]])continue;if(mode==='passport'&&!P.some(v=>v[5]===a[0]))continue;let el=document.createElement('article');el.className=data.items[a[0]]?'':'lock';let icon=document.createElement('div');icon.style.fontSize='28px';icon.textContent=data.items[a[0]]?'✦':'?';el.append(icon,document.createTextNode(data.items[a[0]]?L(a[1],a[2]):L('Undiscovered','未发现')));if(a[0]==='hat'&&data.items.hat){let eq=document.createElement('button');eq.textContent=data.hat?L('Remove','取下'):L('Equip','装备');eq.onclick=()=>{data.hat=!data.hat;store();showBook(mode)};el.append(eq)}b.append(el)}if(mode==='collection'){let h=document.createElement('h3');h.textContent=L('Vocabulary','单词本');b.append(h);for(let [w,v] of Object.entries(data.words)){let p=document.createElement('p');p.textContent=w+' — '+v.d;b.append(p)}}let q=document.createElement('button');q.textContent=L('Close book','合上书');q.onclick=()=>b.hidden=true;b.append(document.createElement('hr'),q);b.animate([{transform:'scale(.87) rotate(-2deg)',opacity:.3},{transform:'scale(1)',opacity:1}],{duration:250})}
$('home').onclick=()=>{if(scene>=0)exit();$('book').hidden=true;close()};$('bag').onclick=()=>showBook('bag');$('passport').onclick=()=>showBook('passport');$('collection').onclick=()=>showBook('collection');$('language').onclick=()=>{zh=!zh;close();$('book').hidden=true;$('language').textContent=L('中文','English');$('bag').textContent=L('Bag','背包');$('passport').textContent=L('Passport','护照');$('collection').textContent=L('Collection','图鉴');$('hint').textContent=L('WASD / arrows · tap to walk · E to interact','方向键 / 点击移动 · E 互动')};function clock(){let d=new Date(),f=new Date(d);f.setDate(d.getDate()+(5-d.getDay()+7)%7);f.setHours(18,0,0,0);if(f<=d)f.setDate(f.getDate()+7);let h=Math.floor((f-d)/3600000);$('clock').textContent=L('Friday in ','距离周五 ')+Math.floor(h/24)+'d '+h%24+'h'}clock();setInterval(clock,30000);$('clock').onclick=()=>say(L('Village clock','村庄时钟'),L('Friday is coming. Hang in there!','周五快到了，坚持住！'));

function drawSlipper(){let a=action?.kind==='villain'?action:villainLast;if(!a)return;let t=Math.max(0,1-(now-a.last)*5);g.save();g.translate(x+22,y-15);g.rotate(-.7+t*2.3);r(-8,-70,28,76,data.items.slipper?'#e7b747':'#925f8d',13);r(-5,-43,22,19,'#f1c9a1',6);g.restore()}
function hitVillain(){let a=action;if(a?.kind!=='villain'||now-a.last<.09)return;a.combo=now-a.last<.65?a.combo+1:1;a.best=Math.max(a.best,a.combo);a.last=now;a.count++;effect('spark',500,370);if(a.count===20){villainLast={...a};action=null;reward('villain');if(a.best>=10)reward('slipper');let rank=a.best>=16?'SSS':a.best>=10?'S':a.best>=5?'A':'B';setTimeout(()=>{if(scene===6&&!action)say(L('Granny','婆婆'),rank+' · '+L('Bad vibes be gone! The slipper can finally rest.','小人退散！拖鞋终于可以休息了。')+(a.best>=10?' · '+L('Golden slipper unlocked!','解锁黄金拖鞋！'):''),[[L('Play again','再打一轮'),villainTalk]])},650)}}
function speakWord(w,l){if(!('speechSynthesis' in window))return;const ss=window.speechSynthesis;ss.cancel();const voices=ss.getVoices();const matching=voices.filter(v=>v.lang.toLowerCase().replace('_','-').startsWith(l.slice(0,2).toLowerCase()));const rank=v=>(/natural|neural|premium|enhanced|google|siri/i.test(v.name)?8:0)+(v.lang.toLowerCase()===l.toLowerCase()?4:0)+(/mandarin|普通话|婷婷|ting-ting/i.test(v.name)&&l.startsWith('zh')?3:0);const voice=matching.sort((a,b)=>rank(b)-rank(a))[0];const u=new SpeechSynthesisUtterance(w);u.lang=voice?.lang||l;if(voice)u.voice=voice;u.rate=l.startsWith('zh')?.82:.88;u.pitch=1;u.volume=.8;ss.speak(u)}if('speechSynthesis' in window){window.speechSynthesis.getVoices();}window.addEventListener('pagehide',()=>{if('speechSynthesis'in window)window.speechSynthesis.cancel()});
