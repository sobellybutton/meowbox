/* Readable, quiet travel-journal interface. Keep the canvas and its controls unobscured. */
#dialogue #line{font-size:clamp(14px,3.9vw,17px);line-height:1.48;overflow-wrap:anywhere}
#dialogue #speaker{font-family:Georgia,"Songti SC",serif;font-weight:700;font-size:17px}
#choices button{min-height:44px;white-space:normal;font-size:14px;line-height:1.25;overflow-wrap:anywhere}
#content button{min-height:44px;white-space:normal;overflow-wrap:anywhere}
#content input:not([type=range]),#content textarea{font-size:16px;min-width:0}
#content .albumCard strong{line-height:1.3;overflow-wrap:anywhere}
#hint{font-size:13px;line-height:1.35;max-width:min(88vw,500px);white-space:normal;overflow-wrap:anywhere}
#dock button{min-height:44px}
#back{min-height:44px;line-height:1.2;white-space:normal}
#small button{min-height:40px}
@media(max-width:390px){#dock button{font-size:11px}#dialogue #line{font-size:14px}#choices{gap:6px}#choices button{padding:8px 10px}}
@media(prefers-reduced-motion:reduce){#dialogue,#toast,#gameControls{transition:none!important}}

#game #content .komorebiGrid .komorebiTile>.mbFurnitureMat>img{position:absolute!important;inset:6px!important;display:block!important;width:calc(100% - 12px)!important;height:calc(100% - 12px)!important;max-width:none!important;max-height:none!important;object-fit:contain!important;object-position:center bottom!important;margin:0!important;transform:none!important}

/* PAW_COMPACT_SIGN_MATERIALS_BEGIN
   Existing painterly material crops, not final individually illustrated building signage.
   Keep a 44px accessible target; the visible object can be much quieter.
   Use stable door IDs rather than translation or transient map names. */
html #game>#worldSigns>.worldSign[data-door]>.doorPlaque{
 --sign-grain:url('assets/visual/painted/signage/paper-grain.webp');
 --sign-tint:linear-gradient(#ece8d8a8,#d8d7c49c);
 --sign-ink:#36493f;--sign-edge:#65796f;--sign-inner:#fff7de9e;
 box-sizing:border-box!important;
 background-image:var(--sign-tint),var(--sign-grain)!important;
 background-color:#e6dbc3!important;background-size:100% 100%!important;
 background-position:center!important;background-repeat:no-repeat!important;
 border-image:none!important;border:1px solid var(--sign-edge)!important;border-radius:3px!important;
 box-shadow:inset 0 0 0 1px var(--sign-inner),0 1px 3px #25312950!important;
 color:var(--sign-ink)!important;text-shadow:none!important;
 font-family:var(--paw-display,Georgia,serif)!important;font-weight:700!important;
 font-size:clamp(12px,2.8vw,14px)!important;line-height:1.25!important;letter-spacing:.01em!important;
 width:max-content!important;max-width:min(148px,42vw)!important;min-width:0!important;
 padding:5px 8px!important;white-space:normal!important;overflow-wrap:normal!important;
 word-break:normal!important;text-wrap:balance;text-align:center;pointer-events:none
}
html #game>#worldSigns>.worldSign[data-door]{
 min-height:44px!important;min-width:44px!important
}
/* Fortune Valley: grounded, shrine-like timber and a quiet warm inscription. */
html #game>#worldSigns>.worldSign:is([data-door="temple"],[data-door="tarot"],[data-door="destiny"],[data-door="wishes"],[data-door="secretGarden"])>.doorPlaque{
 --sign-grain:url('assets/visual/painted/signage/wood-grain.webp');
 --sign-tint:linear-gradient(#5a5345bc,#49483bd4);
 --sign-ink:#fff0d0;--sign-edge:#c0ad83;--sign-inner:#f2d8aa2e;
}
/* Lazy Island: washed cream and sea-green shop trim. */
html #game>#worldSigns>.worldSign:is([data-door="fish"],[data-door="tea"],[data-door="park"],[data-door="office"])>.doorPlaque{
 --sign-grain:url('assets/visual/painted/signage/paper-grain.webp');
 --sign-tint:linear-gradient(#e9eddfd9,#d7e3d2b8);
 --sign-ink:#334e48;--sign-edge:#64877d;--sign-inner:#fff8e5d9;
}
/* Munch & Play: muted retro enamel/timber tones, not bright orange blossoms. */
html #game>#worldSigns>.worldSign:is([data-door="arcade"],[data-door="mystery"],[data-door="kitchen"],[data-door="boba"])>.doorPlaque{
 --sign-grain:url('assets/visual/painted/signage/wood-grain.webp');
 --sign-tint:linear-gradient(#edd9bdde,#d9bda3d9);
 --sign-ink:#593b30;--sign-edge:#946149;--sign-inner:#f9e8c794;
}
/* Starlight Valley: all four houses share soft indigo and aged brass. */
html #game>#worldSigns>.worldSign:is([data-door="quiz"],[data-door="story"],[data-door="match"],[data-door="curiosity"])>.doorPlaque{
 --sign-grain:url('assets/visual/painted/signage/ribbon-paper.webp');
 --sign-tint:linear-gradient(#40566ad9,#343d59df);
 --sign-ink:#fff0ce;--sign-edge:#bfa575;--sign-inner:#f2d8aa33;
}
/* Long English names can use two lines without covering the whole house.
   Chinese remains naturally compact; the door hit target stays separate. */
html #game>#worldSigns>.worldSign:is([data-door="quiz"],[data-door="story"],[data-door="match"],[data-door="curiosity"])>.doorPlaque{
 max-width:min(132px,34vw)!important;
 overflow-wrap:anywhere!important;
 text-wrap:balance;
}
@media(max-width:375px){
 html #game>#worldSigns>.worldSign:is([data-door="quiz"],[data-door="story"],[data-door="match"],[data-door="curiosity"])>.doorPlaque{
  padding:4px 6px!important;
 }
}
/* Route information has its own understated, shared railway identity. */
html #game>#worldSigns>.worldSign[data-door="station"]>.doorPlaque{
 --sign-grain:url('assets/visual/painted/signage/paper-grain.webp');

}
/* Keep map anchors and route hit regions stationary on press. Only
   the painted surface responds; the world coordinate remains unchanged. */
html #game>#worldSigns>.worldSign[data-door]:active>.doorPlaque,
html #game>.pawRailEdge:active{
 filter:brightness(.91);
}
html #game>#worldSigns>.worldSign[data-door]:focus-visible>.doorPlaque{
 outline-offset:-3px!important;
}
html #game>.pawRailEdge:focus-visible{
 outline:2px solid #39594d!important;outline-offset:-3px!important;
}
@media(forced-colors:active){
 html #game>#worldSigns>.worldSign[data-door]:focus-visible>.doorPlaque,
 html #game>.pawRailEdge:focus-visible{outline-color:Highlight!important}
}
