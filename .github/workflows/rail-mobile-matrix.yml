name: Railway mobile compatibility
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/visual/**'
      - 'index.html'
      - 'scripts/rail-mobile-matrix-test.cjs'
      - '.github/workflows/rail-mobile-matrix.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: railway-mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mobile-rail:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        include:
          - {profile: android-compact, engine: chromium}
          - {profile: android-tall, engine: chromium}
          - {profile: android-large, engine: chromium}
          - {profile: android-samsung-size, engine: chromium}
          - {profile: ios-compact, engine: webkit}
          - {profile: ios-tall, engine: webkit}
          - {profile: ios-large, engine: webkit}
          - {profile: android-firefox-size, engine: firefox}
          - {profile: touch-tablet, engine: webkit}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build.cjs
      - run: npm install --no-save --no-package-lock playwright
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Organic four-district journey
        env:
          RAIL_PROFILE: ${{ matrix.profile }}
        run: |
          python3 -m http.server 8771 >/tmp/rail-mobile.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8771/ -o /dev/null && break; sleep 1; done
          node scripts/rail-mobile-matrix-test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rail-mobile-${{ matrix.profile }}
          path: test-results/rail-mobile/
