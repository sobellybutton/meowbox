name: Pawradise quiet garden return gate
on:
  pull_request:
    branches: [main]
    paths: ['src/startup.js','scripts/garden-painted-test.cjs','.github/workflows/garden-return-release.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  garden-routes:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'fix/quiet-garden-physical-return-20261128'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build.cjs
      - run: node scripts/garden-painted-test.cjs
