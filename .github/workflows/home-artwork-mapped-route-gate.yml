name: Pawradise home artwork and mapped route gate
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  layout:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'fix/home-artwork-and-mapped-routes-current-20261128'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build.cjs
      - run: node scripts/home-layout-test.cjs
      - run: node scripts/painted-interior-layout-test.cjs
