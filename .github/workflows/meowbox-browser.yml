name: MeowBox browser smoke tests
on:
  push:
    branches: [main]
    paths: ['index.html', 'preview-v9-1/**', '.github/workflows/meowbox-browser.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright
      - run: npx playwright install --with-deps chromium
      - name: Test entrance and responsive layout
        shell: bash
        run: |
          python3 -m http.server 8765 > /tmp/meowbox-server.log 2>&1 &
          mkdir -p test-results
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch();
            let failed=false;
            for(const [name,options] of [
              ['mobile-small',{viewport:{width:360,height:640},isMobile:true,hasTouch:true,deviceScaleFactor:1}],
              ['mobile-tall',{viewport:{width:390,height:844},isMobile:true,hasTouch:true,deviceScaleFactor:1}],
              ['desktop',{viewport:{width:1440,height:900}}]
            ]){
              const page=await browser.newPage(options);
              const errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text())});
              page.on('requestfailed',r=>errors.push('request: '+r.url()+' '+r.failure()?.errorText));
              try{
                await page.goto('http://127.0.0.1:8765/index.html',{waitUntil:'load'});
                await page.locator('#proposal footer button.next').waitFor({timeout:45000});
                await page.screenshot({path:'test-results/'+name+'-entrance.png'});
                const lang=page.locator('#proposal .languageChoice');
                await lang.getByRole('button',{name:'中文',exact:true}).click();
                if(await lang.getByRole('button',{name:'中文',exact:true}).getAttribute('aria-pressed')!=='true')throw Error('Chinese selection incorrect');
                if(!/逃离现实/.test(await page.locator('#proposal footer h1').innerText()))throw Error('Chinese entrance translation incorrect');
                await lang.getByRole('button',{name:'EN',exact:true}).click();
                if(!/last train/i.test(await page.locator('#proposal footer h1').innerText()))throw Error('English entrance translation incorrect');
                await page.locator('#proposal footer button.next').click();
                await page.locator('#proposal .rail-ticket input').fill('Test Traveller');
                await page.locator('#proposal .ticket-confirm').click();
                await page.locator('#proposal footer button.next').click();
                await page.locator('#proposal footer .actions button').first().click();
                await page.locator('#proposal .shrine-enter').waitFor({timeout:15000});
                await page.waitForTimeout(1200);
                if(await page.locator('#proposal').isHidden())throw Error('Gate skipped for new player');
                await page.screenshot({path:'test-results/'+name+'-new-player-gate.png'});
                await page.locator('#proposal .shrine-enter').click();
                await page.locator('#proposal').waitFor({state:'hidden',timeout:30000});
                await page.waitForTimeout(3500);
                await page.screenshot({path:'test-results/'+name+'-village.png'});
                if(await page.locator('#dock').isHidden())throw Error('Navigation hidden');
                await page.locator('#dockPassport').click();
                await page.locator('.travelAlbum').waitFor({timeout:8000});
                await page.screenshot({path:'test-results/'+name+'-passport.png'});
                await page.getByRole('button',{name:'Open my bag',exact:true}).click();
                await page.locator('.travelAlbum').waitFor({timeout:8000});
                await page.screenshot({path:'test-results/'+name+'-bag.png'});
                await page.reload({waitUntil:'load'});
                await page.locator('#proposal .shrine-enter').waitFor({timeout:45000});
                if(await page.locator('#proposal').getAttribute('data-shot')!=='shrine')throw Error('Returning player did not start at shrine');
                await page.waitForTimeout(1500);
                if(await page.locator('#proposal').isHidden())throw Error('Returning player bypassed gate');
                if(!/Test Traveller/.test(await page.locator('#proposal .shrine-welcome').innerText()))throw Error('Returning welcome lost player name');
                if(!await page.locator('#proposal .shrine-sky').count())throw Error('Shrine atmosphere missing');
                if(await page.locator('#proposal .rail-ticket').count())throw Error('Returning player asked to register again');
                await page.screenshot({path:'test-results/'+name+'-returning-player-gate.png'});
                await page.locator('#proposal .shrine-enter').click();
                await page.locator('#proposal').waitFor({state:'hidden',timeout:30000});
                await page.waitForTimeout(3500);
                await page.locator('#dockPassport').click();
                await page.locator('.travelAlbum').waitFor({timeout:8000});
                if(!/Test Traveller/.test(await page.locator('.albumProfile').innerText()))throw Error('Saved player name lost');
                if(!/Test Traveller/.test(await page.locator('.passportRailTicket').innerText()))throw Error('Original railway ticket missing');
                if(await page.evaluate(()=>readShrineVisits().total)!==2)throw Error('Visit history did not persist exactly twice');
                await page.getByRole('button',{name:'‹ Back',exact:true}).click();
                // Direct activity integration check, separate from the normal entrance flow.
                await page.evaluate(()=>{room='wishes';activity=null;action('coin')});
                await page.locator('.wishRitual').waitFor({timeout:8000});
                await page.locator('.wishKeyboard').locator('..').locator('summary').click();
                await page.locator('.wishKeyboard').getByRole('button',{name:'Throw',exact:true}).click();
                await page.waitForTimeout(1700);
                if(!await page.locator('.ritualCoin').isVisible())throw Error('Missed coin did not return');
                await page.screenshot({path:'test-results/'+name+'-wishing-pool.png'});
                await page.getByRole('button',{name:'‹ Back',exact:true}).click();
                await page.evaluate(()=>{room='temple';activity=null;action('prayer')});
                await page.waitForFunction(()=>activity==='prayer'&&state.prayerStage==='ready',{},{timeout:10000});
                await page.screenshot({path:'test-results/'+name+'-temple-ready.png'});
                await page.evaluate(()=>beginQuietBow());
                await page.waitForFunction(()=>state.prayerStage==='silent',{},{timeout:10000});
                await page.screenshot({path:'test-results/'+name+'-temple-prayer.png'});
                await page.waitForFunction(()=>state.prayerStage==='complete',{},{timeout:10000});
                if(await page.evaluate(()=>state.bows)!==3)throw Error('Prayer bow count incorrect');
                await page.evaluate(()=>start('sticks'));
                await page.waitForTimeout(650);
                await page.screenshot({path:'test-results/'+name+'-temple-sticks.png'});
                await page.evaluate(()=>{start('templeBell');templeReleaseBell(95)});
                await page.waitForFunction(()=>state.bellRung,{},{timeout:5000});
                await page.screenshot({path:'test-results/'+name+'-temple-bell.png'});
                await page.evaluate(()=>{start('templeWater');templeReleaseWater({x:470,y:485})});
                if(await page.evaluate(()=>state.waterStage)!==1)throw Error('Ladle did not fill');
                await page.waitForTimeout(1100);
                await page.evaluate(()=>templeReleaseWater({x:340,y:440}));
                await page.waitForFunction(()=>state.waterStage===3,{},{timeout:5000});
                await page.screenshot({path:'test-results/'+name+'-temple-water.png'});
                await page.evaluate(()=>{templePaperOpen(3);templePaperTap()});
                await page.waitForFunction(()=>state.paperStage==='open',{},{timeout:5000});
                await page.screenshot({path:'test-results/'+name+'-temple-paper.png'});
                await page.evaluate(()=>templePaperKeep(true));
                if(await page.evaluate(()=>templeTies.at(-1))!==3)throw Error('Tied paper not recorded');
                await page.evaluate(()=>{room='kitchen';activity=null;start('bubbleTea')});
                await page.evaluate(()=>{selectTeaBase(1);teaAddPearls();teaAddPearls()});
                if(await page.evaluate(()=>state.teaStage)!=='mix')throw Error('Tea pearls stage failed');
                await page.evaluate(()=>{teaShake(100);teaShake(100)});
                if(await page.evaluate(()=>state.teaStage)!=='ready')throw Error('Tea mixing failed');
                await page.screenshot({path:'test-results/'+name+'-bubble-tea.png'});
                await page.evaluate(()=>teaSip());
                await page.waitForFunction(()=>state.teaStage==='done',{},{timeout:7000});
                await page.evaluate(()=>{start('cook');state.done=true;state.recipe=['Tomato and egg soup','番茄蛋汤'];soupTaste()});
                await page.waitForFunction(()=>state.tasted===true,{},{timeout:7000});
                await page.screenshot({path:'test-results/'+name+'-soup-tasting.png'});
                if(errors.length)throw Error(errors.join('; '));
                console.log(name+': PASS');
              }catch(e){failed=true;console.error(name+': FAIL '+e.message+' | page errors: '+errors.join('; '));console.error('Visible page: '+(await page.locator('body').innerText().catch(()=>'' )).slice(0,500));await page.screenshot({path:'test-results/'+name+'-failure.png'}).catch(()=>{});}
              finally{await page.close();}
            }
            await browser.close();
            if(failed)process.exitCode=1;
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meowbox-browser-screenshots
          path: test-results/
