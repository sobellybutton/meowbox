name: MeowBox browser smoke tests
on:
  push:
    branches: [main]
    paths: ['index.html', 'preview-v9-1/**', 'assets/**', 'src/**', 'scripts/**', '.github/workflows/meowbox-browser.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build.cjs
      - run: npm install --no-save --no-package-lock playwright
      - run: npx playwright install --with-deps chromium
      - name: Test all four villages and actual doorway taps
        shell: bash
        run: |
          python3 -m http.server 8766 > /tmp/meowbox-navigation-server.log 2>&1 &
          mkdir -p test-results
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch();
            let failures=[];
            for(const [name,options] of [
              ['mobile-360',{viewport:{width:360,height:640},isMobile:true,hasTouch:true,deviceScaleFactor:1}],
              ['mobile-390',{viewport:{width:390,height:844},isMobile:true,hasTouch:true,deviceScaleFactor:1}],
              ['tablet',{viewport:{width:768,height:1024},hasTouch:true}],
              ['desktop',{viewport:{width:1440,height:900}}]
            ]){
              const page=await browser.newPage(options);
              const errors=[];page.on('pageerror',e=>errors.push(e.message));
              page.on('console',m=>{if(m.type()==='error'&&/frame error|Room transition/.test(m.text()))errors.push(m.text())});
              try{
                const coldStart=Date.now();
                await page.goto('http://127.0.0.1:8766/index.html',{waitUntil:'domcontentloaded'});
                await page.locator('#proposal footer button.next').waitFor({timeout:45000});
                console.log('COLD_START '+name+' '+JSON.stringify(await page.evaluate(()=>({navigation:performance.getEntriesByType('navigation').map(e=>({domContentLoadedMs:Math.round(e.domContentLoadedEventEnd),transferBytes:e.transferSize})),resources:performance.getEntriesByType('resource').length,artRequests:performance.getEntriesByType('resource').filter(e=>e.name.includes('/assets/art/')).length,resourceBytes:performance.getEntriesByType('resource').reduce((n,e)=>n+e.transferSize,0)})))+' entranceReadyMs='+(Date.now()-coldStart));
                await page.locator('#proposal .languageChoice').getByRole('button',{name:'EN',exact:true}).click();
                await page.locator('#proposal footer button.next').click();
                await page.locator('#proposal .rail-ticket input').fill('Navigation Tester');
                await page.locator('#proposal .ticket-confirm').click();
                await page.locator('#proposal footer button.next').click();
                await page.locator('#proposal footer .actions button').first().click();
                await page.locator('#proposal .shrine-enter').click({timeout:20000});
                await page.locator('#proposal').waitFor({state:'hidden',timeout:30000});
                await page.waitForTimeout(3500);
                for(const map of ['fortune','home','island','wonder']){
                  // Use the normal travel engine; reposition near each door only as test setup.
                  await page.evaluate(k=>journey(k),map);
                  await page.waitForFunction(k=>scene===k&&!transitioning&&!room,map,{timeout:15000});
                  if(map!=='fortune'){
                    await page.waitForFunction(()=>portraitImages[scene]?.naturalWidth>0,{},{timeout:10000});
                    if(!await page.evaluate(()=>portraitImages[scene].naturalHeight>portraitImages[scene].naturalWidth))throw Error(map+': artwork is not portrait');
                  }
                  const stations=await page.evaluate(()=>maps[scene].st.map(([id,x,y,en,cn])=>({id,x,y,en,cn})));
                  await page.screenshot({path:'test-results/'+name+'-'+map+'-map.png'});
                  for(const st of stations){
                    if(st.id==='station')continue;
                    try{
                      await page.evaluate(({x,y})=>{stopRoute();closeTalk();p.x=p.tx=x;p.y=p.ty=clamp(y+110,minY(),maxY());cam.x=p.x;cam.y=p.y;p.motionSpeed=0;quiet9=false;},st);
                      const door=page.locator('#worldSigns .worldSign[data-door="'+st.id+'"]');
                      await door.waitFor({state:'visible',timeout:3500});
                      // Wait for the real hit target after camera positioning. Report
                      // an intercepted sign separately from a failed walking route.
                      await page.waitForFunction(id=>{
                        const el=document.querySelector('#worldSigns .worldSign[data-door="'+id+'"]');
                        if(!el||el.hidden)return false;
                        const r=el.getBoundingClientRect(),hit=document.elementFromPoint(r.left+r.width/2,r.top+r.height/2);
                        return r.width>=44&&r.height>=44&&(hit===el||el.contains(hit));
                      },st.id,{timeout:3500}).catch(async()=>{
                        const details=await door.evaluate(el=>{const r=el.getBoundingClientRect(),hit=document.elementFromPoint(r.left+r.width/2,r.top+r.height/2);return {x:r.left,y:r.top,width:r.width,height:r.height,hit:hit?.outerHTML.slice(0,180)}});
                        throw Error('Door touch target intercepted or too small: '+JSON.stringify(details));
                      });
                      // Capture actual input targets for diagnosis; locator.tap waits for stable layout
                      // and dispatches a real touchscreen gesture, not a DOM click.
                      await page.evaluate(()=>{window.__doorEvents=[];if(!window.__doorTraceInstalled){window.__doorTraceInstalled=true;for(const type of ['pointerdown','pointerup','pointercancel','click','lostpointercapture'])document.addEventListener(type,e=>{window.__doorEvents.push({type,door:e.target.closest?.('.worldSign')?.dataset.door||null,target:e.target.id||e.target.tagName,pointer:e.pointerType,x:Math.round(e.clientX||0),y:Math.round(e.clientY||0)});if(window.__doorEvents.length>20)window.__doorEvents.shift()},true)}});
                      if(options.hasTouch)await door.tap({timeout:5000});
                      else await door.click({timeout:5000});
                      await page.waitForFunction(id=>pending===id||room===id,st.id,{timeout:2000}).catch(async()=>{throw Error('Door click did not start the requested walking route: '+JSON.stringify(await page.evaluate(()=>({events:window.__doorEvents,pending,room,transitioning,scene}))))});
                      await page.waitForFunction(id=>room===id&&!transitioning,st.id,{timeout:15000});
                      await page.screenshot({path:'test-results/'+name+'-'+map+'-'+st.id+'.png'});
                      for(let j=0;j<3&&await page.evaluate(()=>!!room);j++)await page.locator('#back').click();
                      await page.waitForFunction(()=>!room&&!transitioning,{},{timeout:10000});
                      console.log(name+' '+map+'/'+st.id+' PASS');
                    }catch(e){
                      failures.push(name+' '+map+'/'+st.id+': '+e.message);
                      await page.screenshot({path:'test-results/'+name+'-'+map+'-'+st.id+'-failure.png'}).catch(()=>{});
                      await page.evaluate(()=>{room=null;activity=null;state={};transitioning=false;stopRoute();closeTalk();$('page').style.display='none';resetPosition();updateHUD()});
                    }
                  }
                  await page.evaluate(()=>toggleLang());
                  if(await page.evaluate(()=>document.documentElement.lang)!=='zh')throw Error(map+': Chinese toggle failed');
                  await page.evaluate(()=>toggleLang());
                  if(await page.evaluate(()=>document.documentElement.lang)!=='en')throw Error(map+': English toggle failed');
                }
              }catch(e){failures.push(name+': '+e.message)}
              finally{
                failures.push(...errors.map(e=>name+' runtime: '+e));await page.close();
              }
            }
            await browser.close();
            if(failures.length){console.error(failures.join('\n'));process.exitCode=1}
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
      - name: Test entrance and responsive layout and activities
        if: always()
        shell: bash
        run: |
          python3 -m http.server 8765 > /tmp/meowbox-server.log 2>&1 &
          mkdir -p test-results
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch();
            let failed=false;
            for(const [name,options] of [
              ['mobile-small',{viewport:{width:360,height:640},isMobile:true,hasTouch:true,deviceScaleFactor:1}],
              ['mobile-tall',{viewport:{width:390,height:844},isMobile:true,hasTouch:true,deviceScaleFactor:1}],
              ['desktop',{viewport:{width:1440,height:900}}]
            ]){
              const page=await browser.newPage(options);
              const errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text())});
              page.on('requestfailed',r=>errors.push('request: '+r.url()+' '+r.failure()?.errorText));
              try{
                await page.addInitScript(()=>{
                  if(!localStorage.getItem('meowbox-preview-items'))localStorage.setItem('meowbox-preview-items',JSON.stringify([['Love reading','感情占卜'],['Migration test keepsake','迁移测试纪念品']]));
                });
                await page.goto('http://127.0.0.1:8765/index.html',{waitUntil:'load'});
                await page.locator('#proposal footer button.next').waitFor({timeout:45000});
                if(!await page.evaluate(()=>items.some(v=>v[0]==='Three-card reading')&&!items.some(v=>v[0]==='Love reading')&&items.some(v=>v[0]==='Migration test keepsake')))throw Error('Legacy reading collectible migration failed');
                await page.screenshot({path:'test-results/'+name+'-entrance.png'});
                const lang=page.locator('#proposal .languageChoice');
                await lang.getByRole('button',{name:'中文',exact:true}).click();
                if(await lang.getByRole('button',{name:'中文',exact:true}).getAttribute('aria-pressed')!=='true')throw Error('Chinese selection incorrect');
                if(!/逃离现实/.test(await page.locator('#proposal footer h1').innerText()))throw Error('Chinese entrance translation incorrect');
                await lang.getByRole('button',{name:'EN',exact:true}).click();
                if(!/last train/i.test(await page.locator('#proposal footer h1').innerText()))throw Error('English entrance translation incorrect');
                await page.locator('#proposal footer button.next').click();
                await page.locator('#proposal .rail-ticket input').fill('Test Traveller');
                await page.locator('#proposal .ticket-confirm').click();
                await page.locator('#proposal footer button.next').click();
                await page.locator('#proposal footer .actions button').first().click();
                await page.locator('#proposal .shrine-enter').waitFor({timeout:15000});
                await page.waitForTimeout(1200);
                if(await page.locator('#proposal').isHidden())throw Error('Gate skipped for new player');
                await page.screenshot({path:'test-results/'+name+'-new-player-gate.png'});
                await page.locator('#proposal .shrine-enter').click();
                await page.locator('#proposal').waitFor({state:'hidden',timeout:30000});
                await page.waitForTimeout(3500);
                await page.screenshot({path:'test-results/'+name+'-village.png'});
                if(await page.locator('#dock').isHidden())throw Error('Navigation hidden');
                await page.locator('#dockPassport').click();
                await page.locator('.travelAlbum').waitFor({timeout:8000});
                await page.screenshot({path:'test-results/'+name+'-passport.png'});
                await page.getByRole('button',{name:'Open my bag',exact:true}).click();
                await page.locator('.travelAlbum').waitFor({timeout:8000});
                await page.screenshot({path:'test-results/'+name+'-bag.png'});
                await page.reload({waitUntil:'load'});
                await page.locator('#proposal .shrine-enter').waitFor({timeout:45000});
                if(await page.locator('#proposal').getAttribute('data-shot')!=='shrine')throw Error('Returning player did not start at shrine');
                await page.waitForTimeout(1500);
                if(await page.locator('#proposal').isHidden())throw Error('Returning player bypassed gate');
                if(!/Test Traveller/.test(await page.locator('#proposal .shrine-welcome').innerText()))throw Error('Returning welcome lost player name');
                if(!await page.locator('#proposal .shrine-sky').count())throw Error('Shrine atmosphere missing');
                if(await page.locator('#proposal .rail-ticket').count())throw Error('Returning player asked to register again');
                await page.screenshot({path:'test-results/'+name+'-returning-player-gate.png'});
                await page.locator('#proposal .shrine-enter').click();
                await page.locator('#proposal').waitFor({state:'hidden',timeout:30000});
                await page.waitForTimeout(3500);
                await page.locator('#dockPassport').click();
                await page.locator('.travelAlbum').waitFor({timeout:8000});
                if(!/Test Traveller/.test(await page.locator('.albumProfile').innerText()))throw Error('Saved player name lost');
                if(!/Test Traveller/.test(await page.locator('.passportRailTicket').innerText()))throw Error('Original railway ticket missing');
                if(await page.evaluate(()=>readShrineVisits().total)!==2)throw Error('Visit history did not persist exactly twice');
                await page.getByRole('button',{name:'‹ Back',exact:true}).click();
                // Direct activity integration check, separate from the normal entrance flow.
                await page.evaluate(()=>{room='wishes';activity=null;action('coin')});
                await page.locator('.wishRitual').waitFor({timeout:8000});
                await page.locator('.wishKeyboard').locator('..').locator('summary').click();
                await page.locator('.wishKeyboard').getByRole('button',{name:'Throw',exact:true}).click();
                await page.waitForTimeout(1700);
                if(!await page.locator('.ritualCoin').isVisible())throw Error('Missed coin did not return');
                await page.screenshot({path:'test-results/'+name+'-wishing-pool.png'});
                await page.getByRole('button',{name:'‹ Back',exact:true}).click();
                await page.evaluate(()=>{room='temple';activity=null;action('prayer')});
                await page.waitForFunction(()=>activity==='prayer'&&state.prayerStage==='ready',{},{timeout:10000});
                await page.screenshot({path:'test-results/'+name+'-temple-ready.png'});
                await page.evaluate(()=>lightTempleIncense());
                if(!await page.evaluate(()=>state.incense===true))throw Error('Incense did not light');
                await page.evaluate(()=>beginQuietBow());
                await page.waitForFunction(()=>state.prayerStage==='silent',{},{timeout:10000});
                await page.screenshot({path:'test-results/'+name+'-temple-prayer.png'});
                await page.waitForFunction(()=>state.prayerStage==='complete',{},{timeout:10000});
                if(await page.evaluate(()=>state.bows)!==3)throw Error('Prayer bow count incorrect');
                await page.evaluate(()=>start('sticks'));
                await page.waitForTimeout(650);
                const tapWorld=async(x,y)=>{
                  const v=await page.evaluate(({x,y})=>{const r=c.getBoundingClientRect();return {x:r.left+cam.ox+x*cam.scale,y:r.top+cam.oy+y*cam.scale}}, {x,y});
                  if(options.hasTouch)await page.touchscreen.tap(v.x,v.y);else await page.mouse.click(v.x,v.y);
                };
                await tapWorld(400,450);
                await page.waitForFunction(()=>activity==='sticks'&&state.drawing,{},{timeout:3000});
                await page.waitForFunction(()=>state.fallenStick>=1&&state.fallenStick<=12&&!state.drawing,{},{timeout:5000});
                const drawn=await page.evaluate(()=>state.fallenStick);
                if(await page.evaluate(n=>items.some(x=>x[0]==='Fortune stick '+n),drawn))throw Error('Uncollected stick was added to inventory');
                await page.screenshot({path:'test-results/'+name+'-temple-sticks.png'});
                await tapWorld(510,524);
                await page.waitForFunction(n=>activity==='templePaper'&&state.paperNumber===n,drawn,{timeout:5000});
                if(!await page.evaluate(n=>items.some(x=>x[0]==='Fortune stick '+n),drawn))throw Error('Picked-up stick missing from inventory');
                await page.waitForTimeout(650);
                await tapWorld(400,472);
                await page.waitForFunction(()=>state.paperStage==='open',{},{timeout:5000});
                await page.screenshot({path:'test-results/'+name+'-temple-drawn-paper.png'});
                await page.evaluate(()=>templePaperKeep(false));
                await page.evaluate(()=>{start('templeBell');templeReleaseBell(95)});
                await page.waitForFunction(()=>state.bellRung,{},{timeout:5000});
                await page.screenshot({path:'test-results/'+name+'-temple-bell.png'});
                await page.evaluate(()=>{start('templeWater');templeReleaseWater({x:470,y:485})});
                if(await page.evaluate(()=>state.waterStage)!==1)throw Error('Ladle did not fill');
                await page.waitForTimeout(1100);
                await page.evaluate(()=>templeReleaseWater({x:340,y:440}));
                await page.waitForFunction(()=>state.waterStage===3,{},{timeout:5000});
                await page.screenshot({path:'test-results/'+name+'-temple-water.png'});
                await page.evaluate(()=>{templePaperOpen(3);templePaperTap()});
                await page.waitForFunction(()=>state.paperStage==='open',{},{timeout:5000});
                await page.screenshot({path:'test-results/'+name+'-temple-paper.png'});
                await page.evaluate(()=>templePaperKeep(true));
                if(await page.evaluate(()=>templeTies.at(-1))!==3)throw Error('Tied paper not recorded');
                await page.evaluate(()=>{room='kitchen';activity=null;start('bubbleTea')});
                await page.evaluate(()=>{selectTeaBase(1);teaAddPearls();teaAddPearls()});
                if(await page.evaluate(()=>state.teaStage)!=='mix')throw Error('Tea pearls stage failed');
                await page.evaluate(()=>{teaShake(100);teaShake(100)});
                if(await page.evaluate(()=>state.teaStage)!=='ready')throw Error('Tea mixing failed');
                await page.screenshot({path:'test-results/'+name+'-bubble-tea.png'});
                await page.evaluate(()=>teaSip());
                await page.waitForFunction(()=>state.teaStage==='done',{},{timeout:7000});
                await page.evaluate(()=>{start('cook');state.done=true;state.recipe=['Tomato and egg soup','番茄蛋汤'];soupTaste()});
                await page.waitForFunction(()=>state.tasted===true,{},{timeout:7000});
                await page.screenshot({path:'test-results/'+name+'-soup-tasting.png'});
                await page.evaluate(()=>{room='temple';activity=null;start('secretGarden')});
                await page.waitForTimeout(1300);
                await page.evaluate(()=>{gardenSeat();gardenChime();gardenFeed()});
                await page.waitForTimeout(1000);
                if(!await page.evaluate(()=>state.gardenSitting&&state.gardenFeedCount===1))throw Error('Garden interactions failed');
                await page.evaluate(()=>gardenFeed());
                await page.waitForTimeout(1000);
                await page.evaluate(()=>gardenFeed());
                if(!await page.evaluate(()=>items.some(x=>x[0]==='Quiet garden postcard')))throw Error('Garden keepsake not collected');
                await page.screenshot({path:'test-results/'+name+'-secret-garden.png'});
                await page.evaluate(()=>{room='arcade';activity=null;start('blindBox');boxSelect(1);boxShake(100);boxShake(100);boxOpen()});
                await page.waitForFunction(()=>state.boxStage==='result',{},{timeout:6000});
                if(!await page.evaluate(()=>items.some(x=>x[0]===boxPrizes[state.boxPrize][0])))throw Error('Blind box prize not saved');
                await page.screenshot({path:'test-results/'+name+'-blind-box.png'});
                await page.evaluate(()=>{start('rhythm');rhythmBegin();state.rhythmAt=t;rhythmHit(state.rhythmNotes[0].lane)});
                if(!await page.evaluate(()=>state.rhythmScore>0))throw Error('Rhythm scoring failed');
                await page.screenshot({path:'test-results/'+name+'-rhythm.png'});
                await page.evaluate(()=>{state.rhythmAt=t-15});
                await page.waitForFunction(()=>state.rhythmStage==='result',{},{timeout:5000});
                if(!await page.evaluate(()=>items.some(x=>x[0]==='After-hours rhythm ticket')))throw Error('Rhythm ticket missing');
                await page.evaluate(()=>{room='tarot';activity=null;start('love');readingTopic(1);readingShuffle()});
                await page.waitForFunction(()=>state.readStage==='deck',{},{timeout:5000});
                await page.evaluate(()=>readingDeal());
                await page.waitForFunction(()=>state.readStage==='cards',{},{timeout:5000});
                await page.evaluate(()=>{readingReveal(0);readingReveal(1);readingReveal(2)});
                await page.waitForFunction(()=>state.readSaved,{},{timeout:5000});
                if(!await page.evaluate(()=>readingJournal.some(v=>v.topic===1&&v.cards.length===3)))throw Error('Tarot journal missing');
                if(!await page.evaluate(()=>items.some(x=>x[0]==='Three-card reading')&&readingPrompts.length===4&&readingPrompts.every(t=>t.length===3)))throw Error('Topic-specific reading collection or prompts missing');
                await page.screenshot({path:'test-results/'+name+'-tarot-spread.png'});
                if(errors.length)throw Error(errors.join('; '));
                console.log(name+': PASS');
              }catch(e){failed=true;console.error(name+': FAIL '+e.message+' | page errors: '+errors.join('; '));console.error('Visible page: '+(await page.locator('body').innerText().catch(()=>'' )).slice(0,500));await page.screenshot({path:'test-results/'+name+'-failure.png'}).catch(()=>{});}
              finally{await page.close();}
            }
            await browser.close();
            if(failed)process.exitCode=1;
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meowbox-browser-screenshots
          path: test-results/
