name: MeowBox browser smoke tests
on:
  push:
    branches: [main]
    paths: ['index.html', 'preview-v9-1/**', 'assets/**', 'src/**', 'scripts/**', '.github/workflows/meowbox-browser.yml']
  pull_request:
    branches: [main]
    paths: ['index.html', 'src/**', 'assets/**', 'scripts/**', '.github/workflows/meowbox-browser.yml']
  workflow_dispatch:
permissions:
  contents: read
# Separate the slow visual audit from short regression queues. Each job
# keeps one running and one latest pending revision of its own kind.
jobs:
  focused-regressions:
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'release/candidate-')
    concurrency:
      group: meowbox-focused-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build.cjs
      - run: node scripts/test-tarot-snapshot.cjs
      - run: node scripts/house-label-recovery-test.cjs
      - run: node scripts/local-progress-reset-test.cjs
      - run: node scripts/home-placement-live-test.cjs
      - run: node scripts/test-purification-painting.cjs
      - run: node scripts/resident-chat-callback-test.cjs
      - run: node scripts/painted-interior-layout-test.cjs
      - run: node scripts/home-layout-test.cjs
      - run: node scripts/forecourt-return-test.cjs
      - run: node scripts/office-story-test.cjs
      - run: node scripts/auntie-ritual-motion-test.cjs
      - run: node scripts/paw-room-life-scoop-test.cjs
      - run: node scripts/prepared-art-test.cjs
      - run: node scripts/food-prop-placement-test.cjs
      - run: node scripts/blind-box-reveal-test.cjs
      - run: node scripts/painted-lobby-runtime-test.cjs
      - run: node scripts/home-placement-live-test.cjs
  browser:
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'release/candidate-')
    concurrency:
      group: meowbox-navigation-job-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build.cjs
      - run: node scripts/action-refinement-test.cjs
      - run: node scripts/parallel-letter-test.cjs
      - run: node scripts/home-placement-test.cjs
      - run: node scripts/home-layout-test.cjs
      - run: node scripts/rail-foreground-test.cjs
      - run: node scripts/world-visits-test.cjs
      - run: node scripts/paw-economy-test.cjs
      - run: node scripts/paw-motion-audio-test.cjs
      - run: node scripts/resident-remarks-test.cjs
      - run: node scripts/runtime-module-live-test.cjs
      - run: node scripts/garden-painted-test.cjs
      - run: node scripts/food-room-paint-test.cjs
      - run: node scripts/paw-living-home-test.cjs
      - run: node scripts/paw-living-polish-test.cjs
      - run: node scripts/rail-fish-test.cjs
      - run: node scripts/paw-room-life-scoop-test.cjs
      - run: node scripts/resident-story-test.cjs
      - run: node scripts/guest-roster-test.cjs
      - run: node scripts/guest-personality-test.cjs
      - run: node scripts/paw-curated-world-test.cjs
      - run: node scripts/daily-guide-wallet-test.cjs
      - run: node scripts/chapter-grip-test.cjs
      - run: node scripts/deer-stage-test.cjs
      - run: node scripts/visual-stage-fit-test.cjs
      - run: npm install --no-save --no-package-lock playwright
      - run: npx playwright install --with-deps chromium
      - name: Test all four villages and actual doorway taps
        shell: bash
        run: |
          python3 -m http.server 8766 > /tmp/meowbox-navigation-server.log 2>&1 &
          mkdir -p test-results
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch();
            let failures=[];
            for(const [name,options] of [
              ['mobile-360',{viewport:{width:360,height:640},isMobile:true,hasTouch:true,deviceScaleFactor:1}],
              ['mobile-390',{viewport:{width:390,height:844},isMobile:true,hasTouch:true,deviceScaleFactor:1}],
              ['tablet',{viewport:{width:768,height:1024},hasTouch:true}],
              ['desktop',{viewport:{width:1440,height:900}}]
            ]){
              const page=await browser.newPage(options);
              const errors=[];page.on('pageerror',e=>errors.push(e.stack||e.message));
              page.on('console',m=>{if(m.type()==='error'&&/frame error|Room transition/.test(m.text()))errors.push(m.text())});
              try{
                const coldStart=Date.now();
                await page.goto('http://127.0.0.1:8766/index.html',{waitUntil:'domcontentloaded'});
                await page.locator('#proposal footer button.next').waitFor({timeout:45000});
                console.log('COLD_START '+name+' '+JSON.stringify(await page.evaluate(()=>({navigation:performance.getEntriesByType('navigation').map(e=>({domContentLoadedMs:Math.round(e.domContentLoadedEventEnd),transferBytes:e.transferSize})),resources:performance.getEntriesByType('resource').length,artRequests:performance.getEntriesByType('resource').filter(e=>e.name.includes('/assets/art/')).length,resourceBytes:performance.getEntriesByType('resource').reduce((n,e)=>n+e.transferSize,0)})))+' entranceReadyMs='+(Date.now()-coldStart));
                await page.locator('#proposal .languageChoice').getByRole('button',{name:'EN',exact:true}).click();
                await page.locator('#proposal footer button.next').click();
                await page.locator('#proposal .rail-ticket input').fill('Navigation Tester');
                await page.locator('#proposal .ticket-confirm').click();
                await page.locator('#proposal footer button.next').click();
                await page.locator('#proposal footer .actions button').first().click();
                await page.locator('#proposal .rail-arrive').click({timeout:20000});
                await page.locator('#proposal .shrine-enter').click({timeout:20000});
                await page.locator('#proposal').waitFor({state:'hidden',timeout:30000});
                await page.waitForTimeout(3500);
                // Verify effective runtime registry, after all extensions and overrides.
                const registry=await page.evaluate(()=>Object.entries(maps).flatMap(([world,m])=>m.st.map(([id])=>({world,id}))));
                if(new Set(registry.map(v=>v.world+':'+v.id)).size!==registry.length||new Set(registry.filter(v=>v.id!=='station').map(v=>v.id)).size!==registry.filter(v=>v.id!=='station').length)throw Error('Duplicate runtime destination');
                for(const world of ['fortune','home','island','wonder'])if(registry.filter(v=>v.id==='station'&&v.world===world).length!==1)throw Error('Missing district station '+world);
                for(const [id,world] of [['temple','fortune'],['fish','home'],['quiz','wonder'],['station','fortune']]){
                  if(registry.filter(v=>v.id===id&&v.world===world).length!==1)throw Error('Wrong station ownership: '+id);
                }
                if(!await page.evaluate(()=>roomActions.quiz.length===1&&roomActions.quiz[0][0]==='quiz'))throw Error('Personality Lab has duplicate entry points');
                if(!await page.evaluate(()=>roomActions.arcade.map(v=>v[0]).join(',')==='bubbleArcade,goldfishScoop,blindBox'))throw Error('Visible arcade lineup differs from curated games');
                const assessmentCheck=await page.evaluate(()=>{let n=0;for(const mode of ['type','motive','soul']){const q=prepareWonderQuestions(mode),answers=q.map(v=>v.id%v.opts.length),expected={type:16,motive:27,soul:6}[mode];if(q.length!==expected)throw Error('Wrong question count '+mode);if(JSON.stringify(scoreWonder(mode,q,answers))!==JSON.stringify(scoreWonder(mode,q.slice().reverse(),answers.slice().reverse())))throw Error('Question order changed outcome '+mode);n++}const q=prepareWonderQuestions('motive');if(scoreWonder('motive',q,q.map(()=>1)).ties.length!==9)throw Error('Equal motive scores collapsed');return n+1});
                console.log('ASSESSMENT_LOGIC '+assessmentCheck);
                const poseCheck=await page.evaluate(()=>{let n=0;for(let i=0;i<=10;i++)for(let j=0;j<=10;j++){for(const opts of [{kneel:i/10,bow:j/10},{seat:i/10,bow:j/10}]){const p=ritualSpritePose(opts,{x:25,y:-20});if(!(p.hip.y<p.knee.y&&p.knee.y<p.foot.y&&Number.isFinite(p.wrist.x)&&Number.isFinite(p.wrist.y)))throw Error('Invalid action pose');n++}}return n});
                console.log('POSE_GEOMETRY '+poseCheck);

                const storyCheck=await page.evaluate(()=>{const ends=new Set();function visit(id,seen=[]){if(seen.includes(id))throw Error('Story cycle');if(parallelEndings[id]){ends.add(id);return}if(!parallelScenes[id])throw Error('Missing story');parallelScenes[id].choices.forEach(c=>visit(c[2],[...seen,id]))}visit('station');return ends.size});
                if(storyCheck!==16)throw Error('Expected all sixteen story endings to be reachable');

                const chartCheck=await page.evaluate(()=>{const z=ziChart('1990-06-15',12);return chartConsultTopics.every(topic=>{const v=chartConsultData(z,topic);return v.index===mod(z.life-topic.k,12)&&v.stars.length===z.stars[v.index].length})});
                if(!chartCheck)throw Error('Consultation not using actual palace');

                const layoutCheck=await page.evaluate(()=>{const old=room,failures=[];let pairs=0;try{for(const [id,spec] of Object.entries(indoorStages)){room=id;const obs=indoorObstacles(),ids=id==='temple'?Object.keys(spec.stations):(roomActions[id]||[]).map(v=>v[0]);for(const k of ids)if(!spec.stations[k])failures.push(id+': missing '+k);const nodes=[spec.entry,spec.arrival,...ids.map(k=>indoorStation(k).slice(2))];for(const a of nodes)for(const b of nodes){pairs++;if(!indoorSafe(...a,obs)||!indoorPath(a,b,obs))failures.push(id+': '+a+' -> '+b)}}}finally{room=old}return {pairs,failures}});
                if(layoutCheck.failures.length)throw Error('Indoor geometry: '+JSON.stringify(layoutCheck));console.log('INDOOR_GEOMETRY '+JSON.stringify(layoutCheck));
                // Record actual candidate arrival/departure paths using the final room registry.
                // Quiet rooms with no valid path are reported, never forced to spawn visitors.
                const visitorGeometry=await page.evaluate(()=>{
                  const old=room,records=[],failures=[];
                  try{
                    for(const [id,visitor] of Object.entries(pawRoomVisitorSpecs)){
                      room=id;
                      const obs=indoorObstacles(),door=indoorSpec().entry,anchors=pawGuestActiveFeet(),safe=(x,y)=>indoorSafe(x,y,obs);
                      const points=pawGuestWaypoints(visitor.points,pawGuestProtected(),safe);
                      let routes=0,maxLength=0;
                      for(const point of points){
                        const route=(a,b)=>pawVisitorDoorRoute(a,b,anchors,safe,(f,d)=>indoorPath(f,d,obs),52,(f,d)=>indoorSegment(f,d,obs));
                        const incoming=route(door,point),outgoing=route(point,door);
                        if(!incoming||!outgoing)continue;
                        for(const [start,segments] of [[door,incoming],[point,outgoing]]){
                          if(!segments.every((v,i)=>safe(...v)&&indoorSegment(i?segments[i-1]:start,v,obs)&&pawGuestSegment(i?segments[i-1]:start,v,anchors)))failures.push(id+': invalid visitor path');
                        }
                        routes++;
                        maxLength=Math.max(maxLength,incoming.length,outgoing.length);
                      }
                      records.push({id,candidatePoints:points.length,bidirectionalRoutes:routes,maxLength});
                    }
                  }finally{room=old}
                  return {records,failures};
                });
                console.log('VISITOR_GEOMETRY '+JSON.stringify(visitorGeometry));
                if(visitorGeometry.failures.length)throw Error('Unsafe visitor routes '+JSON.stringify(visitorGeometry.failures));
                const shoreCheck=await page.evaluate(()=>{let n=0;for(let power=15;power<=100;power++){const p=riverLanding(power);if(p.y>=riverBankY(p.x)||p.y<285)throw Error('Bottle lands outside water');n++}for(let i=0;i<=100;i++){const f=i/100,x=265+f*65,y=610-f*102;if(y<=riverBankY(x))throw Error('Avatar walks into water');n++}return n});
                console.log('SHORE_GEOMETRY '+shoreCheck);


                for(const map of ['fortune','home','island','wonder']){
                  // Use the normal travel engine; reposition near each door only as test setup.
                  const transfer=await page.evaluate(k=>{const from=scene;journey(k);return {changed:from!==k,active:!!document.querySelector('.mbTransferHolding'),transitioning}},map);
                  if(transfer.changed&&transfer.transitioning&&!transfer.active)throw Error('Transfer ticket missing during travel');
                  await page.waitForFunction(k=>scene===k&&!transitioning&&!room,map,{timeout:15000});
                  if(map!=='fortune'){
                    await page.waitForFunction(()=>portraitImages[scene]?.naturalWidth>0,{},{timeout:10000});
                    if(!await page.evaluate(()=>portraitImages[scene].naturalHeight>portraitImages[scene].naturalWidth))throw Error(map+': artwork is not portrait');
                  }
                  const stations=await page.evaluate(()=>maps[scene].st.map(([id,x,y,en,cn])=>({id,x,y,en,cn})));
                  await page.screenshot({path:'test-results/'+name+'-'+map+'-map.png'});
                  for(const st of stations){
                    if(st.id==='station')continue;
                    try{
                      await page.evaluate(({x,y})=>{stopRoute();closeTalk();p.x=p.tx=x;p.y=p.ty=clamp(y+110,minY(),maxY());cam.x=p.x;cam.y=p.y;p.motionSpeed=0;quiet9=false;},st);
                      const door=page.locator('#worldSigns .worldSign[data-door="'+st.id+'"]');
                      await door.waitFor({state:'visible',timeout:3500});
                      // Wait for the real hit target after camera positioning. Report
                      // an intercepted sign separately from a failed walking route.
                      await page.waitForFunction(id=>{
                        const el=document.querySelector('#worldSigns .worldSign[data-door="'+id+'"]');
                        if(!el||el.hidden)return false;
                        const r=el.getBoundingClientRect(),hit=document.elementFromPoint(r.left+r.width/2,r.top+r.height/2);
                        return r.width>=44&&r.height>=44&&(hit===el||el.contains(hit));
                      },st.id,{timeout:3500}).catch(async()=>{
                        const details=await door.evaluate(el=>{const r=el.getBoundingClientRect(),hit=document.elementFromPoint(r.left+r.width/2,r.top+r.height/2);return {x:r.left,y:r.top,width:r.width,height:r.height,hit:hit?.outerHTML.slice(0,180)}});
                        throw Error('Door touch target intercepted or too small: '+JSON.stringify(details));
                      });
                      // Capture actual input targets for diagnosis; locator.tap waits for stable layout
                      // and dispatches a real touchscreen gesture, not a DOM click.
                      await page.evaluate(()=>{window.__doorEvents=[];if(!window.__doorTraceInstalled){window.__doorTraceInstalled=true;for(const type of ['pointerdown','pointerup','pointercancel','click','lostpointercapture'])document.addEventListener(type,e=>{window.__doorEvents.push({type,door:e.target.closest?.('.worldSign')?.dataset.door||null,target:e.target.id||e.target.tagName,pointer:e.pointerType,x:Math.round(e.clientX||0),y:Math.round(e.clientY||0)});if(window.__doorEvents.length>20)window.__doorEvents.shift()},true)}});
                      if(st.id==='temple')await page.waitForFunction(()=>pawRoomImageReady(pawHallArt())&&pawRoomImageReady(pawRecoveredImage('scenes/temple_approach_portrait.webp')),null,{timeout:12000});
                      if(options.hasTouch)await door.tap({timeout:5000});
                      else await door.click({timeout:5000});
                      await page.waitForFunction(id=>pending===id||room===id,st.id,{timeout:2000}).catch(async()=>{throw Error('Door click did not start the requested walking route: '+JSON.stringify(await page.evaluate(()=>({events:window.__doorEvents,pending,room,transitioning,scene}))))});
                      if(st.id==='temple'){
                        // The owner requested a single doorway tap followed by
                        // a physical walk up the painted stairs, no hall button.
                        await page.waitForFunction(()=>activity==='templeForecourt'&&state.pawForecourt?.destination==='hall'&&state.pawForecourt.route.length>0,null,{timeout:10000});
                        await page.screenshot({path:'test-results/'+name+'-temple-walking-up.png'});
                        await page.waitForFunction(()=>room==='temple'&&!activity&&pawHallEnabled(),null,{timeout:15000});
                        if(await page.locator('[data-paw-forecourt-control]').count())throw Error('Forecourt controls leaked into hall');
                      }
                      await page.waitForFunction(id=>room===id&&!transitioning&&continuityRoom===id,st.id,{timeout:15000});
                      await page.waitForFunction(()=>!indoor.route.length&&Math.hypot(indoor.tx-indoor.x,indoor.ty-indoor.y)<=3,{},{timeout:5000});
                      const placement=await page.evaluate(()=>{const spec=indoorSpec();return {safe:indoorSafe(indoor.x,indoor.y),distance:Math.hypot(indoor.x-spec.arrival[0],indoor.y-spec.arrival[1]),x:cam.ox+indoor.x*cam.scale,y:cam.oy+indoor.y*cam.scale,w:W,h:H}});
                      if(!placement.safe||placement.distance>4||placement.x<0||placement.x>placement.w||placement.y<60||placement.y>placement.h-40)throw Error('Unsafe or off-screen indoor arrival '+JSON.stringify(placement));
                      await page.screenshot({path:'test-results/'+name+'-'+map+'-'+st.id+'.png'});
                      // One end-to-end activity entry from the real door, with no player repositioning.
                      if(st.id==='tarot'){
                        const tarotAnchor=await page.evaluate(()=>indoorSpec().stations.tarot.slice(2));
                        const tap=await page.evaluate(()=>{const target=hit.find(h=>h.stationId==='tarot');if(!target)return null;const r=c.getBoundingClientRect();return {x:r.left+cam.ox+(target.x+target.w/2)*cam.scale,y:r.top+cam.oy+(target.y+target.h/2)*cam.scale}});
                        if(!tap)throw Error('Tarot station hit target missing');
                        if(options.hasTouch)await page.touchscreen.tap(tap.x,tap.y);else await page.mouse.click(tap.x,tap.y);
                        await page.waitForFunction(()=>!!indoor.goal||talkOpen||activity==='tarot',{},{timeout:2500});
                        await page.locator('#choices').getByRole('button',{name:/Daily guidance/}).click({timeout:10000});
                        await page.waitForFunction(()=>room==='tarot'&&activity==='tarot',{},{timeout:8000});
                        // Choose the reading tone if the curated reading opened that step.
                        if(await page.locator('#dialogue').isVisible()){
                          const tone=page.locator('#choices button').first();if(await tone.isVisible())await tone.click()
                        }
                        if(!await page.evaluate(a=>Math.hypot(indoor.x-a[0],indoor.y-a[1])<=3,tarotAnchor))throw Error('Activity began before reaching authored station');
                        await page.locator('#back').click();
                        await page.waitForFunction(()=>room==='tarot'&&!activity&&continuityActivity===null,{},{timeout:5000});
                        if(!await page.evaluate(a=>Math.hypot(indoor.x-a[0],indoor.y-a[1])<=3,tarotAnchor))throw Error('Return lost station position');
                        await page.screenshot({path:'test-results/'+name+'-tarot-return-anchor.png'});
                      }
                      await page.locator('#back').click();
                      // One back tap walks down the painted approach, without
                      // another exit button or stopping at the forecourt.
                      if(st.id==='temple'){
                        await page.waitForFunction(()=>activity==='templeForecourt'&&state.pawForecourt?.destination==='exit'&&state.pawForecourt.route.length>0,null,{timeout:15000});
                        await page.screenshot({path:'test-results/'+name+'-temple-walking-down.png'});
                      }else await page.waitForFunction(()=>!room||transitioning||!!indoor.goal,{},{timeout:3000});
                      await page.waitForFunction(()=>!room&&!transitioning,{},{timeout:10000});
                      await page.waitForFunction(()=>!room&&!transitioning,{},{timeout:10000});
                      console.log(name+' '+map+'/'+st.id+' PASS');
                    }catch(e){
                      failures.push(name+' '+map+'/'+st.id+': '+e.message);
                      await page.screenshot({path:'test-results/'+name+'-'+map+'-'+st.id+'-failure.png'}).catch(()=>{});
                      await page.evaluate(()=>{room=null;activity=null;state={};transitioning=false;stopRoute();closeTalk();$('page').style.display='none';resetPosition();updateHUD()});
                    }
                  }
                  await page.evaluate(()=>toggleLang());
                  if(await page.evaluate(()=>document.documentElement.lang)!=='zh')throw Error(map+': Chinese toggle failed');
                  await page.evaluate(()=>toggleLang());
                  if(await page.evaluate(()=>document.documentElement.lang)!=='en')throw Error(map+': English toggle failed');
                }
              }catch(e){failures.push(name+': '+e.message)}
              finally{
                failures.push(...errors.map(e=>name+' runtime: '+e));await page.close();
              }
            }
            await browser.close();
            if(failures.length){console.error(failures.join('\n'));process.exitCode=1}
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
      - name: Test entrance and responsive layout and activities
        shell: bash
        run: |
          python3 -m http.server 8765 > /tmp/meowbox-server.log 2>&1 &
          mkdir -p test-results
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch();
            let failed=false;
            for(const [name,options] of [
              ['mobile-small',{viewport:{width:360,height:640},isMobile:true,hasTouch:true,deviceScaleFactor:1}],
              ['mobile-tall',{viewport:{width:390,height:844},isMobile:true,hasTouch:true,deviceScaleFactor:1}],
              ['desktop',{viewport:{width:1440,height:900}}]
            ]){
              const page=await browser.newPage(options);
              const errors=[];
              page.on('pageerror',e=>errors.push(e.stack||e.message));
              page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text())});
              page.on('requestfailed',r=>errors.push('request: '+r.url()+' '+r.failure()?.errorText));
              page.on('response',r=>{if(r.status()>=400)errors.push('response: '+r.status()+' '+r.url())});
              try{
                await page.addInitScript(()=>{
                  if(!localStorage.getItem('meowbox-preview-items'))localStorage.setItem('meowbox-preview-items',JSON.stringify([['Love reading','感情占卜'],['Migration test keepsake','迁移测试纪念品']]));
                });
                await page.goto('http://127.0.0.1:8765/index.html',{waitUntil:'load'});
                await page.locator('#proposal footer button.next').waitFor({timeout:45000});
                if(!await page.evaluate(()=>items.some(v=>v[0]==='Three-card reading')&&!items.some(v=>v[0]==='Love reading')&&items.some(v=>v[0]==='Migration test keepsake')))throw Error('Legacy reading collectible migration failed');
                await page.screenshot({path:'test-results/'+name+'-entrance.png'});
                const lang=page.locator('#proposal .languageChoice');
                await lang.getByRole('button',{name:'中文',exact:true}).click();
                if(await lang.getByRole('button',{name:'中文',exact:true}).getAttribute('aria-pressed')!=='true')throw Error('Chinese selection incorrect');
                if(!/逃离现实/.test(await page.locator('#proposal footer h1').innerText()))throw Error('Chinese entrance translation incorrect');
                await lang.getByRole('button',{name:'EN',exact:true}).click();
                if(!/last train/i.test(await page.locator('#proposal footer h1').innerText()))throw Error('English entrance translation incorrect');
                await page.locator('#proposal footer button.next').click();
                await page.locator('#proposal .rail-ticket input').fill('Test Traveller');
                await page.locator('#proposal .ticket-confirm').click();
                await page.locator('#proposal footer button.next').click();
                await page.locator('#proposal footer .actions button').first().click();
                await page.locator('#proposal .rail-arrive').click({timeout:20000});
                await page.locator('#proposal .shrine-enter').waitFor({timeout:15000});
                await page.waitForTimeout(1200);
                if(await page.locator('#proposal').isHidden())throw Error('Gate skipped for new player');
                await page.screenshot({path:'test-results/'+name+'-new-player-gate.png'});
                await page.locator('#proposal .shrine-enter').click();
                await page.locator('#proposal').waitFor({state:'hidden',timeout:30000});
                await page.waitForTimeout(3500);
                await page.screenshot({path:'test-results/'+name+'-village.png'});
                if(await page.locator('#dock').isHidden())throw Error('Navigation hidden');
                await page.locator('#dockScoop').click();
