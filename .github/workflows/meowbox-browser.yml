                await page.evaluate(()=>{room='tarot';activity=null;state={};closeTalk();updateHUD()});
                if(options.hasTouch){
                  await page.waitForFunction(()=>(()=>{const im=requestReadingRoomPortrait();return im?.naturalWidth===800&&im?.naturalHeight===1400})(),{},{timeout:10000});
                  await page.screenshot({path:'test-results/'+name+'-portrait-tarot-room.png'});
                }
                await page.evaluate(()=>{start('love');readingTopic(1)});
                await page.locator('#choices').getByRole('button',{name:'My own question, quietly',exact:true}).click();
                await page.evaluate(()=>readingShuffle());
                await page.waitForFunction(()=>state.readStage==='deck'&&state.readShuffle>0,{},{timeout:5000});
                await page.evaluate(()=>readingDeal());
                await page.waitForFunction(()=>pawTarotFanSettled(state,t,residentReducedMotion.matches),{},{timeout:5000});
                const expectedCards=await page.evaluate(()=>[2,6,10].map(i=>state.pawCardPool[i]));
                for(const i of [2,6,10]){const slot=await page.evaluate(i=>pawTarotChoiceSlots(W<H)[i],i);await tapWorld(slot.x,slot.y)}
                await page.waitForFunction(()=>state.readStage==='cards',{},{timeout:5000});
                if(JSON.stringify(await page.evaluate(()=>state.readCards))!==JSON.stringify(expectedCards))throw Error('Tarot selection did not preserve chosen cards');
                await page.evaluate(()=>{readingReveal(0);readingReveal(1);readingReveal(2)});
                await page.waitForFunction(()=>state.readSaved,{},{timeout:5000});
                if(!await page.evaluate(()=>readingJournal.some(v=>v.topic===1&&v.cards.length===3)))throw Error('Tarot journal missing');
                if(!await page.evaluate(()=>items.some(x=>x[0]==='Three-card reading')&&readingPrompts.length===4&&readingPrompts.every(t=>t.length===3)))throw Error('Topic-specific reading collection or prompts missing');
                await page.screenshot({path:'test-results/'+name+'-tarot-spread.png'});
                const tarotMiddle=await page.evaluate(()=>readingActivitySlot(1,3,W<H));
                await tapWorld(tarotMiddle.x,tarotMiddle.y);
                await page.waitForFunction(()=>state.readStage==='focus'&&state.readFocus===1,{},{timeout:3000});
                await page.waitForTimeout(500);
                await page.screenshot({path:'test-results/'+name+'-tarot-closeup.png'});
                await tapWorld(490,647);
                await page.waitForFunction(()=>state.readStage==='cards'&&state.readFlip.every(v=>v>=0)&&state.readSaved,{},{timeout:3000});
                // Test actual dialogue choice buttons; set up a nearby resident without walking.
                await page.evaluate(()=>{room=null;activity=null;state={};stopRoute();closeTalk();npcTalk({n:['Mochi','麻薯'],kind:2,x:p.x+30,y:p.y})});
                for(const topic of ['Offer an imaginary snack','Scratch behind the ears','Sit quietly together']){
                  await page.locator('#choices').getByRole('button',{name:topic,exact:true}).click();
                  if(topic!=='Sit quietly together')await page.locator('#choices').getByRole('button',{name:'Chat a little more',exact:true}).click();
                }
                if(!await page.evaluate(()=>residentRecord('mochi').topics.length===3&&items.filter(x=>x[0]===residentProfiles.mochi.reward[0]).length===1))throw Error('Resident choices or unique reward missing');
                await page.locator('#choices').getByRole('button',{name:'Chat a little more',exact:true}).click();
                await page.locator('#choices').getByRole('button',{name:'Offer an imaginary snack',exact:true}).click();
                if(!await page.evaluate(()=>residentRecord('mochi').topics.length===3&&items.filter(x=>x[0]===residentProfiles.mochi.reward[0]).length===1))throw Error('Repeat topic granted duplicate progress');
                await page.locator('#choices').getByRole('button',{name:'Chat a little more',exact:true}).click();
                await page.locator('#choices').getByRole('button',{name:'A little story for today',exact:true}).click();
                await page.locator('#choices').getByRole('button',{name:'Leave the box open',exact:true}).click();
                if(!await page.evaluate(()=>mbFriendRecord(mbFriendMemory.mochi,'mochi').last?.choice===0))throw Error('Story choice was not saved');
                await page.locator('#choices').getByRole('button',{name:'Chat a little more',exact:true}).click();
                await page.locator('#choices').getByRole('button',{name:'Remember our story',exact:true}).click();
                if(!await page.locator('#line').innerText().then(v=>v.includes('excellent ventilation')))throw Error('Same-day story recap missing');
                await page.locator('#choices').getByRole('button',{name:'See you around',exact:true}).click();
                await page.locator('#profileHud').click();
                await page.locator('.journalBookLink[data-book="friends"]').click();
                await page.getByText('Trusted friend · 3/3 stories shared',{exact:true}).waitFor({timeout:5000});
                await page.screenshot({path:'test-results/'+name+'-resident-friendship.png'});
                // Setup the home screen with the real starter layout, then use the actual editor controls.
                await page.evaluate(()=>{hideoutEditing=false;komorebiZone=0;hideoutPage()});
                await page.locator('.pawRoomExpansionFold').filter({has:page.getByText('Room expansions',{exact:true})}).locator('summary').click();
                await page.getByRole('button',{name:'Expand home',exact:true}).click();
                const furnitureSearch=page.locator('#mbFurnitureSearch');
                const extensionTile=page.locator('.komorebiTile[data-furniture-id="roomExtension"]');
                await furnitureSearch.fill('zz-no-such-furniture-zz');
                await extensionTile.waitFor({state:'hidden'});
                await page.locator('.mbCatalogueNoResults').waitFor({state:'visible'});
                await furnitureSearch.fill('');
                await extensionTile.waitFor({state:'visible'});
                const furnitureName=await extensionTile.locator('strong').textContent();
                await furnitureSearch.fill(furnitureName);
                await extensionTile.waitFor({state:'visible'});
                if(!await extensionTile.locator('.mbFurnitureMat img').isVisible())throw Error('Furniture artwork preview missing');
                await page.locator('.komorebiTile[data-furniture-id="roomExtension"] button').click();
                await page.locator('.komorebiConfirm').waitFor();
                await page.locator('.mbFurnitureDetailMat img').waitFor({state:'visible'});
                if(!await page.evaluate(()=>furnitureOwned('roomExtension')||!!document.querySelector('.mbFurnitureQuote')))throw Error('Purchase balance preview missing');
                await page.screenshot({path:'test-results/'+name+'-home-furniture-detail.png'});
                await page.locator('#content > .row button').first().click();
                await page.locator('.komorebiTile[data-furniture-id="roomExtension"]').waitFor();
                if(await furnitureSearch.inputValue()!==furnitureName)throw Error('Returning from furniture detail lost search');
                await furnitureSearch.fill('');
                await page.screenshot({path:'test-results/'+name+'-home-expansion-catalogue.png'});
                await page.locator('#content > .row button').first().click();
                await page.locator('.hideoutScene').waitFor();
                if(!await page.evaluate(()=>komorebiZone===0&&!hideoutEditing))throw Error('Home navigation changed room or editing mode');
                await page.locator('#content > .row button').first().click();
                await page.locator('#dockOwnHome').click();
                await page.locator('.hideoutScene').waitFor();
                await page.getByRole('button',{name:'Decorate room',exact:true}).click();
                const futon=page.locator('.hideoutPlaced[data-furniture-id="futon"]');
                await futon.waitFor({state:'visible'});
                await futon.focus();
                await page.keyboard.press('Enter');
                await page.keyboard.press('ArrowUp');
                if(!await page.evaluate(()=>{const d=hideoutFurniture.find(d=>d.id==='futon');return d&&d.y>=67&&d.y<=93}))throw Error('Furniture escaped floor bounds');
                await page.getByRole('button',{name:'Put away',exact:true}).click();
                await futon.waitFor({state:'detached'});
                await page.locator('[data-furniture-tray="futon"]').click();
                await futon.waitFor({state:'visible'});
                await page.screenshot({path:'test-results/'+name+'-home-placement.png'});
                await page.getByRole('button',{name:'Save & view room',exact:true}).click();
                await page.screenshot({path:'test-results/'+name+'-home-preview.png'});
                await page.reload({waitUntil:'domcontentloaded'});
                await page.locator('#proposal .shrine-enter').waitFor({timeout:45000});
                if(!await page.evaluate(()=>residentRecord('mochi').topics.length===3&&items.filter(x=>x[0]===residentProfiles.mochi.reward[0]).length===1))throw Error('Resident progress did not survive reload');
                if(!await page.evaluate(()=>mbFriendRecord(mbFriendMemory.mochi,'mochi').seen.length===1))throw Error('Extra story memory lost after reload');
                if(errors.length)throw Error(errors.join('; '));
                console.log(name+': PASS');
              }catch(e){failed=true;console.error(name+': FAIL '+e.stack+' | page errors: '+errors.join('; '));console.error('Visible page: '+(await page.locator('body').innerText().catch(()=>'' )).slice(0,500));await page.screenshot({path:'test-results/'+name+'-failure.png'}).catch(()=>{});}
              finally{await page.close();}
            }
            await browser.close();
            if(failed)process.exitCode=1;
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meowbox-browser-screenshots
          path: test-results/

  share-exports:
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'release/candidate-')
    concurrency:
      group: meowbox-share-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Render and encode social cards
        run: |
          python3 -m http.server 8767 >/tmp/meowbox-share-server.log 2>&1 &
          node scripts/share-export-test.cjs
          node scripts/reading-journey-test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meowbox-share-previews
          path: test-results/

  shrine-repair:
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'release/candidate-')
    concurrency:
      group: meowbox-shrine-${{ matrix.engine }}-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Test shrine arrival and water interaction
        env:
          MEOW_BROWSER: ${{ matrix.engine }}
        run: |
          python3 -m http.server 8768 >/tmp/meowbox-shrine-server.log 2>&1 &
          node scripts/shrine-repair-test.cjs
      - name: Test organic journey, responsive rotation and saved identity
        if: always()
        env:
          MEOW_BROWSER: ${{ matrix.engine }}
        run: |
          python3 -m http.server 8768 >/tmp/meowbox-device-server.log 2>&1 &
          node scripts/device-journey-test.cjs
          if [ "$MEOW_BROWSER" = chromium ]; then node scripts/district-journey-test.cjs; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meowbox-shrine-repair-previews-${{ matrix.engine }}
          path: test-results/

  visual-experiences:
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'release/candidate-')
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: small-chromium
            engine: chromium
          - device: tall-webkit
            engine: webkit
          - device: tablet-chromium
            engine: chromium
          - device: desktop-chromium
            engine: chromium
    concurrency:
      group: meowbox-visual-${{ github.ref }}-${{ matrix.device }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build.cjs
      - run: npm install --no-save --no-package-lock playwright
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Capture all exposed experiences in both languages
        env:
          MB_AUDIT_DEVICE: ${{ matrix.device }}
        run: |
          python3 -m http.server 8769 >/tmp/meowbox-visual-server.log 2>&1 &
          node scripts/visual-experience-audit.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meowbox-all-experience-visual-review-${{ matrix.device }}
          path: visual-review/
