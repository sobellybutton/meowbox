name: Pawradise 50 player journey scenarios
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/startup.js'
      - 'scripts/paw-organic-temple-flow-test.cjs'
      - '.github/workflows/player-journey-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  entrance-dock:
    if: github.event_name == 'workflow_dispatch' || (github.head_ref == 'fix/organic-temple-flow-qa-20261128' || github.head_ref == 'release/candidate-first-valley-consolidated-20261128')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        browser: [chromium, webkit]
        viewport: ['320x568','360x640','390x844','844x390','1440x900']
    env:
      PAW_BROWSER: ${{ matrix.browser }}
      PAW_VIEWPORT: ${{ matrix.viewport }}
      PAW_FOUNDATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build.cjs
      - run: npm install --no-save --no-package-lock playwright
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Four journeys per viewport and browser (both languages and motion preferences)
        run: |
          python3 -m http.server 8772 >/tmp/player-journey.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:8772/index.html >/dev/null && break; sleep 1; done
          node scripts/paw-entrance-test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: entrance-dock-${{ matrix.browser }}-${{ matrix.viewport }}
          path: test-results/entrance
  physical-temple:
    if: github.event_name == 'workflow_dispatch' || (github.head_ref == 'fix/organic-temple-flow-qa-20261128' || github.head_ref == 'release/candidate-first-valley-consolidated-20261128')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        viewport: ['320x568','360x640','390x844','844x390','1440x900']
        language: ['EN','中文']
    env:
      PAW_VIEWPORT: ${{ matrix.viewport }}
      PAW_LANGUAGE: ${{ matrix.language }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build.cjs
      - run: npm install --no-save --no-package-lock playwright
      - run: npx playwright install --with-deps chromium
      - name: Walk into the temple and depart using real inputs
        run: |
          python3 -m http.server 8772 >/tmp/player-journey.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:8772/index.html >/dev/null && break; sleep 1; done
          node scripts/paw-organic-temple-flow-test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: temple-flow-${{ matrix.viewport }}-${{ matrix.language }}
          path: test-results/organic-flow
