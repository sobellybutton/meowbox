name: Community backend checks
on:
  push:
    paths: ['community/**', 'scripts/community-test.mjs', '.github/workflows/community.yml']
  workflow_dispatch:
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-sqlite scripts/community-test.mjs
