name: Pawradise entrance visual regression
on:
  push:
    branches: [main]
    paths: ['src/**', 'assets/**', 'scripts/paw-entrance-test.cjs', 'scripts/paw-world-admission-test.cjs', '.github/workflows/paw-entrance.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  entrance:
    concurrency:
      group: paw-entrance-${{ matrix.browser }}-${{ github.ref }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build.cjs
      - run: node scripts/paw-world-admission-test.cjs
      - run: npm install --no-save --no-package-lock playwright
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Test first arrival on eight viewport sizes, both languages and motion modes
        env:
          PAW_BROWSER: ${{ matrix.browser }}
        run: |
          python3 -m http.server 8772 > /tmp/paw-entrance-server.log 2>&1 &
          node scripts/paw-entrance-test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: entrance-${{ matrix.browser }}
          path: test-results/entrance/
