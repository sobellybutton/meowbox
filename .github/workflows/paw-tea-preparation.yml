name: Pawradise painted tea preparation
on:
  push:
    branches: [fix/kitchen-tea-physical-prep-20261128, integration/multibatch-player-continuity-20261128]
    paths:
      - 'src/extensions.js'
      - 'src/startup.js'
      - 'scripts/tea-scoop-*.cjs'
      - '.github/workflows/paw-tea-preparation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: paw-tea-prep-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preparation:
    if: (github.ref == 'refs/heads/fix/kitchen-tea-physical-prep-20261128' || github.ref == 'refs/heads/integration/multibatch-player-continuity-20261128') || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/candidate-'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: git rev-parse HEAD
      - run: node scripts/build.cjs
      - run: node scripts/tea-scoop-continuity-test.cjs
      - run: node scripts/food-contact-test.cjs
      - run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps ${{ matrix.engine }}
      - name: Verify actual tea preparation
        env:
          MEOW_BROWSER: ${{ matrix.engine }}
        run: |
          python3 -m http.server 8768 >/tmp/paw-tea-prep.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8768/index.html -o /dev/null && break; sleep 1; done
          node scripts/tea-scoop-browser-test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tea-prep-${{ matrix.engine }}-${{ github.run_id }}
          path: |
            test-results/tea-prep-*/
            /tmp/paw-tea-prep.log
          if-no-files-found: warn
