name: Pawradise editorial export evidence
on:
  push:
    branches: [fix/read03-desktop-camera-continuity-20261128, integration/multibatch-player-continuity-20261128]
    paths:
      - 'src/painted-lobby-runtime.js'
      - 'scripts/editorial-share-render-test.cjs'
      - '.github/workflows/paw-editorial-export.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: paw-editorial-export-${{ github.ref }}
  cancel-in-progress: false
jobs:
  rendered-exports:
    if: github.ref == 'refs/heads/fix/read03-desktop-camera-continuity-20261128' || github.ref == 'refs/heads/integration/multibatch-player-continuity-20261128' || (github.event_name == 'pull_request' && github.head_ref == 'release/candidate-multibatch-integrated-20261128')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Identify revision
        run: git rev-parse HEAD
      - name: Build candidate
        run: node scripts/build.cjs
      - name: Install browser and bilingual fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps ${{ matrix.engine }}
      - name: Render actual PNGs and phone scale contact sheets
        env:
          MEOW_BROWSER: ${{ matrix.engine }}
        run: |
          python3 -m http.server 8768 >/tmp/paw-editorial-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8768/index.html -o /dev/null && break; sleep 1; done
          node scripts/editorial-share-render-test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-share-${{ matrix.engine }}-${{ github.run_id }}
          path: |
            test-results/editorial-*/
            /tmp/paw-editorial-server.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-review-sheets-${{ matrix.engine }}-${{ github.run_id }}
          path: |
            test-results/editorial-*/contact-*.jpg
            test-results/editorial-*/manifest.json
          if-no-files-found: warn
