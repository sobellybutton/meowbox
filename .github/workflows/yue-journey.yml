name: Master Yue consultation click-through
on:
  push:
    branches: [main]
    paths: ['src/engine.js','src/release-fixes.js','src/startup.js','src/town-access.js','src/extensions.js','scripts/build.cjs','scripts/test-yue-input.cjs','scripts/yue-journey-test.cjs','.github/workflows/yue-journey.yml']
  pull_request:
    branches: [main]
    paths: ['src/startup.js','assets/visual/painted/reading-host-framing.js','scripts/yue-journey-test.cjs','.github/workflows/yue-journey.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consultation:
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'dev/read-02-yue-')
    concurrency:
      group: paw-yue-${{ matrix.engine }}-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate committed independent scroll asset
        run: |
          python3 - <<'PY'
          import hashlib,pathlib
          p=pathlib.Path('assets/visual/painted/master-yue/folded-scroll.webp')
          data=p.read_bytes()
          assert len(data)==23598
          assert hashlib.sha256(data).hexdigest()=='33a179610d382bb537975f0b87e77608800882a14605f01dfa81d5a8e3864f58'
          print('PASS independent 23,598-byte scroll asset')
          PY
      - name: Validate input and build the current game
        run: |
          node scripts/test-yue-input.cjs
          node scripts/yue-parchment-test.cjs
          node scripts/reading-host-scene-test.cjs
          node scripts/scene-ambience-test.cjs
          node scripts/yue-desk-contact-test.cjs
          node scripts/yue-chair-contact-test.cjs
          node scripts/yue-year-dialogue-test.cjs
          node scripts/yue-star-dialogue-test.cjs
          node scripts/build.cjs
      - run: npm install --no-save --no-package-lock playwright
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Click through Master Yue readings
        env:
          MEOW_BROWSER: ${{ matrix.engine }}
        run: |
          python3 -m http.server 8770 >/tmp/meowbox-yue-server.log 2>&1 &
          node scripts/yue-journey-test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yue-journey-${{ matrix.engine }}
          path: test-results/
