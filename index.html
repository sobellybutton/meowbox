<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pawradise · Fortune Valley</title>
<script>
/* PAW_BOOT_ART_BEGIN */
function bootEntranceArt(storage,wide){
 let returning=false;
 try{returning=JSON.parse(storage.getItem('meowbox-preview-avatar'))!=null}catch{}
 return returning?{kind:'gate',path:'assets/visual/painted/worlds/gateway/scene.webp'}:{kind:'station',path:'assets/visual/painted/recovered/scenes/station_'+(wide?'landscape':'portrait')+'.webp'}
}
/* PAW_BOOT_ART_END */
let bootEntrance;
try{bootEntrance=bootEntranceArt(window.localStorage,matchMedia('(min-aspect-ratio: 23/20)').matches)}catch{bootEntrance=bootEntranceArt(null,false)}
document.documentElement.dataset.bootArt=bootEntrance.kind;
const bootPreload=document.createElement('link');bootPreload.rel='preload';bootPreload.as='image';bootPreload.href=bootEntrance.path;bootPreload.setAttribute('fetchpriority','high');document.head.append(bootPreload);
</script>
<style>
html,body{margin:0;min-height:100%;background:#263c32;color:#f6ecd3;font:18px Georgia,"Songti SC",serif}body{min-height:100vh;min-height:100dvh;display:grid;place-items:center}
.bootGate{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;object-position:center bottom;pointer-events:none}
html[data-boot-art="station"] .bootGate{object-fit:contain;object-position:center}
.bootShade{position:fixed;inset:0;background:linear-gradient(180deg,#263c3208 35%,#263c32bd 100%);pointer-events:none}
main{position:relative;align-self:end;text-align:center;box-sizing:border-box;width:min(100%,480px);padding:24px 20px max(30px,env(safe-area-inset-bottom,0px));text-shadow:0 1px 4px #263c32}h1{font-size:clamp(24px,5vw,34px);margin:0 0 8px;font-weight:normal}small{display:block;line-height:1.5;margin-top:10px}button{font:inherit;min-height:44px;background:#edddbd;color:#443d2d;border:1px solid #9e8966;border-radius:8px;padding:8px 18px}button:focus-visible{outline:2px solid #fff1c6;outline-offset:3px}progress{display:block;width:min(72%,240px);height:5px;margin:13px auto 0;accent-color:#e4cd99;border:0;border-radius:4px;background:#243b32;color:#e4cd99}progress::-webkit-progress-bar{background:#243b32;border-radius:4px}progress::-webkit-progress-value{background:#e4cd99;border-radius:4px}progress::-moz-progress-bar{background:#e4cd99;border-radius:4px}
@media(orientation:landscape){.bootGate{object-fit:contain}.bootShade{background:linear-gradient(90deg,#263c32b0,transparent 32%,transparent 68%,#263c32b0)}main{background:#263c3299;align-self:end}}
</style></head><body>
<img class="bootGate" alt="" fetchpriority="high" decoding="async">
<script>document.querySelector('.bootGate').src=bootEntrance.path;</script>
<div class="bootShade" aria-hidden="true"></div>
<main><h1>Pawradise</h1><small role="status" aria-live="polite">Preparing your journey…</small><progress id="bootProgress" max="12" value="0" aria-label="Preparing your journey"></progress></main>
<script>
const bootMark=name=>{try{performance.mark('paw:'+name)}catch{}};
bootMark('boot-start');
/* PAW_BOOT_STATUS_BEGIN */
function bootChinese(storage){try{return JSON.parse(storage.getItem('meowbox-preview-zh'))===true}catch{return false}}
function bootRetryable(status){return status==null||status===408||status===425||status===429||status>=500}
function bootStatus(done,total,slow,zh){
 if(done===total)return zh?'旅程即将开始…':'Almost there…';
 if(slow)return zh?'旅程稍有延误，已准备 '+done+' / '+total+' 项':'Taking a little longer · '+done+' of '+total+' ready';
 return zh?'正在准备旅程 · '+done+' / '+total:'Preparing your journey · '+done+' of '+total;
}
/* PAW_BOOT_STATUS_END */
let bootZh=false;try{bootZh=bootChinese(window.localStorage)}catch{}
document.documentElement.lang=bootZh?'zh-Hans':'en';
const bootTr=(en,cn)=>bootZh?cn:en;
const gate=document.querySelector('.bootGate');
function gateReady(){if(gate.naturalWidth)bootMark('gate-image-ready')}
if(gate.complete)gateReady();else gate.addEventListener('load',gateReady,{once:true});
async function fetchText(path,signal){
 for(let attempt=0;attempt<2;attempt++){
  if(signal?.aborted)throw Error('Boot cancelled');
  const controller=new AbortController(),abort=()=>controller.abort(),timer=setTimeout(abort,25000);
  signal?.addEventListener('abort',abort,{once:true});
  try{
   const res=await fetch(path,{cache:'no-cache',signal:controller.signal});
   if(!res.ok){const error=Error(path+' '+res.status);error.status=res.status;throw error}
   const value=await res.text();if(signal?.aborted)throw Error('Boot cancelled');
   bootMark('source-ready:'+path);return value
  }catch(e){if(signal?.aborted||attempt===1||!bootRetryable(e.status))throw e}
  finally{clearTimeout(timer);signal?.removeEventListener('abort',abort)}
 }
}
function loadAssembler(signal){
 return new Promise((resolve,reject)=>{
  if(signal?.aborted){reject(Error('Boot cancelled'));return}
  const script=document.createElement('script');script.src='src/assemble.js';script.async=true;
  let settled=false;
  const abort=()=>finish(Error('Boot cancelled'));
  const finish=(error)=>{
   if(settled)return;settled=true;clearTimeout(timer);signal?.removeEventListener('abort',abort);
   script.onload=script.onerror=null;
   if(error){script.remove();reject(error)}else if(typeof assembleMeowBox==='function'){bootMark('assembler-ready');resolve()}else reject(Error('Assembler unavailable'))
  };
  const timer=setTimeout(()=>finish(Error('Assembler timeout')),25000);
  signal?.addEventListener('abort',abort,{once:true});
  script.onload=()=>finish();script.onerror=()=>finish(Error('Assembler failed'));document.head.append(script)
 })
}
async function boot(){
 const progress=document.querySelector('small');
 const paths=['src/shell.html','src/engine.js','assets/visual/painted/ah-ma/ritual-motion.js','src/extensions.js','src/release-fixes.js','src/town-polish.js','src/town-access.js','src/resident-remarks.js','src/paw-motion-audio.js','src/paw-economy.js','src/blind-box-reveal.js','src/arcade-painted-runtime.js','src/painted-lobby-runtime.js','src/home-placement-runtime.js','src/startup.js'];
 // Begin the assembler and source requests together instead of blocking all
 // source downloads on an earlier synchronous script request.
 const meter=document.getElementById('bootProgress'),total=paths.length+1;let done=0,delayed=false;
 meter.max=total;meter.setAttribute('aria-label',bootTr('Journey preparation','旅程准备进度'));
 const paint=()=>{if(!progress.isConnected)return;progress.textContent=bootStatus(done,total,delayed,bootZh);meter.value=done};
 const run=new AbortController();
 const ready=value=>{if(!run.signal.aborted){done++;paint()}return value};paint();
 const slow=setTimeout(()=>{delayed=true;paint()},4500);
 try{
  const [files]=await Promise.all([Promise.all(paths.map(path=>fetchText(path,run.signal).then(ready))),loadAssembler(run.signal).then(ready)]);
  bootMark('sources-ready');
  const html=assembleMeowBox(files[0],files.slice(1));bootMark('assembled');
  document.open();document.write(html);document.close()
 }catch(error){run.abort();throw error}finally{clearTimeout(slow)}
}
boot().catch(error=>{bootMark('boot-failed');console.error(error);const main=document.querySelector('main');if(!main)return;main.replaceChildren();const title=document.createElement('h2');title.textContent=bootTr('Your train is delayed','列车晚点了');const detail=document.createElement('p');detail.textContent=bootTr('We could not finish loading the town. Your saved progress has not been cleared.','小镇未能加载完成，你已保存的进度仍在。');const button=document.createElement('button');button.textContent=bootTr('Try again','重试');button.onclick=()=>location.reload();main.append(title,detail,button)});
</script></body></html>
