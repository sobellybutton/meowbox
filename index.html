<script>
'use strict';
const $=id=>document.getElementById(id), c=$('game'), g=c.getContext('2d');let W=0,H=0,D=1,T=0,dt=0,last=0,started=false,lang='en',nick='',muted=true,scene='street',town=0,coins=0,visits=[0],prizes=[],notes=[],profile='',cam=0,goal=null,modal=false,toastTimer,keys={},joy={x:0,y:0},mouse={x:0,y:0,down:false},particles=[],activity={},audio;
try{let s=JSON.parse(localStorage.getItem('meowbox-rebuild')||'{}');lang=s.lang||'en';nick=s.nick||'';coins=s.coins||0;visits=s.visits||[0];prizes=s.prizes||[];notes=s.notes||[];profile=s.profile||''}catch{}
const tr=(a,b)=>lang==='zh'?b:a, clamp=(x,a,b)=>Math.max(a,Math.min(b,x)), rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)], tau=Math.PI*2;

function circle(x,y,r,col){ellipse(x,y,r,r,col)}

function button(x,y,w,h,label,fn,col='#425c61'){rect(x,y,w,h,col,14);txt(label,x+w/2,y+h/2,14);hits.push({x,y,w,h,fn})}
let hits=[];function hit(x,y){for(let i=hits.length-1;i>=0;i--){let b=hits[i];if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){b.fn();return true}}return false}
function pfx(x,y,col='#ffdca3',n=12){for(let i=0;i<n;i++)particles.push({x,y,vx:rnd(-70,70),vy:rnd(-120,-15),life:rnd(.4,1.1),col,r:rnd(2,5)})}
function drawParticles(){particles=particles.filter(p=>p.life>0);for(let p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=85*dt;g.globalAlpha=clamp(p.life*2,0,1);circle(p.x,p.y,p.r,p.col);g.globalAlpha=1}}
function avatar(x,y,s,o={}){transform(x,y,s,()=>{let walk=o.walk?Math.sin(T*11+(o.phase||0)):0,bob=o.walk?Math.abs(walk)*3:Math.sin(T*2+(o.phase||0))*1.2,skin=o.skin||'#f3cba8',hair=o.hair||'#48383b',coat=o.coat||'#d98081';ellipse(0,2,23,7,'#15202e35');g.translate(0,-bob);for(let i of [-1,1]){let a=i*walk*6;rect(i*10-6,-23+a,12,20,'#536579',6);rect(i*10-8,-9+a,17,10,'#fff0d7',5)}rect(-22,-58,44,39,coat,16);line(-17,-48,-26,-29+walk*5,coat,12);line(17,-48,26,-29-walk*5,coat,12);circle(-26,-27+walk*5,6,skin);circle(26,-27-walk*5,6,skin);ellipse(0,-78,31,34,hair);circle(-27,-72,7,skin);circle(27,-72,7,skin);ellipse(0,-73,27,26,skin);poly([[-28,-82],[-28,-99],[-12,-108],[9,-105],[28,-94],[28,-78],[14,-90],[6,-82],[-7,-94],[-18,-82]],hair);if(o.ahma){circle(0,-107,13,'#a8a8aa');line(-20,-75,-4,-75,'#65574e',2);line(4,-75,20,-75,'#65574e',2)}let blink=Math.sin(T*.8+(o.phase||0))>.992;for(let i of [-1,1]){ellipse(i*10,-73,3,blink?1:5,'#48383b');if(!blink)circle(i*10-1,-75,1,'#fff');ellipse(i*16,-63,6,3,'#e89c91')}g.strokeStyle='#a4605e';g.lineWidth=2;g.beginPath();g.arc(0,-66,5,.2,Math.PI-.2);g.stroke();if(o.glasses){rect(-23,-79,20,11,'#303745',4);rect(3,-79,20,11,'#303745',4);line(-3,-74,3,-74,'#303745',2)}if(o.bag){rect(17,-40,21,25,'#b27b4f',5);line(20,-40,20,-51,'#b27b4f',3)}if(o.ahma){rect(-16,-43,32,23,'#f6e4c9',5);line(-12,-53,-12,-43,'#f6e4c9',4);line(12,-53,12,-43,'#f6e4c9',4)}if(o.name)txt(o.name,0,-120,10,'#fff5dc','center',650)})}
function cat(x,y,s,pet=0){transform(x,y,s,()=>{ellipse(0,1,31,7,'#20303b30');g.save();g.translate(0,Math.sin(T*3)*.6);g.strokeStyle='#c78042';g.lineWidth=12;g.lineCap='round';g.beginPath();g.moveTo(22,-11);g.quadraticCurveTo(49,-6,43,-37+Math.sin(T*3)*9);g.stroke();ellipse(0,-14,30,21,'#e5a05d');ellipse(-10,-30,25,24,'#f3b971');poly([[-31,-43],[-31,-65],[-12,-51]],'#e7a261');poly([[3,-51],[20,-64],[17,-40]],'#e7a261');poly([[-28,-48],[-28,-57],[-19,-50]],'#e9a197');poly([[8,-50],[17,-57],[15,-48]],'#e9a197');for(let i of [-1,1]){let xx=-10+i*10;if(pet){g.strokeStyle='#67493c';g.lineWidth=2;g.beginPath();g.arc(xx,-32,4,.2,Math.PI-.2);g.stroke()}else ellipse(xx,-33,3,4,'#594332');ellipse(xx,-25,5,3,'#e89b85')}poly([[-14,-28],[-6,-28],[-10,-24]],'#a95e54');line(-10,-24,-10,-20,'#8e5846',1.5);for(let i of [-1,1])line(-10+i*15,-24,-10+i*27,-27,'#8b6750',1);line(-20,-50,-16,-41,'#ba743e',3);line(-7,-52,-7,-42,'#ba743e',3);ellipse(-20,-3,11,5,'#f8d29d');ellipse(16,-3,11,5,'#f8d29d');g.restore()})}

function sky(w,h,night=dark()){rect(0,0,w,h,grad(0,0,0,h,night?[[0,'#18253e'],[.55,'#43546c'],[1,'#d2a48d']]:[[0,'#83a8be'],[.55,'#d6d4c3'],[1,'#f9ce9b']]));if(night){for(let i=0;i<36;i++)circle((i*97.7)%w,18+(i*31.3)%(h*.55),i%5===0?1.8:.7,'#fff4d7');circle(w*.82,h*.18,25,'#fff0c6');circle(w*.82+10,h*.18-7,23,'#27344d')}else{glow(w*.82,h*.2,90,'#ffebba88');circle(w*.82,h*.2,29,'#ffe7b4');for(let i=0;i<5;i++){let x=((i*240+T*4)%(w+180))-90;ellipse(x,h*.18+(i%3)*35,57,12,'#fff5e363');ellipse(x+30,h*.18+(i%3)*35-9,42,15,'#fff5e363')}}}

function garden5(){room('#d2e5c2','#a7c9a5');for(let i=0;i<5;i++)tree(55+i*125,160,.8);ellipse(300,235,170,65,'#91c2c1');ellipse(300,235,150,52,'#a9d6d3');for(let i=0;i<7;i++)ellipse(200+i*32,225+Math.sin(T+i)*9,12,5,'#f9e4cc');for(let i=0;i<3;i++){rect(45+i*205,320,100,28,'#a48068',7);avatar(95+i*205,338,.75,{coat:['#d79aa3','#9cb6c8','#b0b58f'][i],phase:i})}txt(tr('Fictional residents · local notes only','虚构居民 · 本机留言'),300,28,15,'#58765e');localButton(130,405,160,42,tr('Talk to residents','跟居民聊聊'),()=>{toast(pick(lang==='zh'?['阿嫲：吃饭了吗？','阿卷：今天又开了三个会。','鱼老板：坐坐吧，别急。']:['Ah Ma: have you eaten?','A Juan: three meetings already.','Boss Meow: sit a little longer.']))},'#719c82');localButton(310,405,160,42,tr('Garden notes','花园留言'),board,'#719c82');endRoom()}

const oldReflection5=reflection;reflection=function(kind){if(kind==='birth')return oldReflection5(kind);if(kind==='tarot'){let a=[['The Star','星星','Make room for hope.','给希望留一点位置。'],['The Sun','太阳','Notice small joys.','留意小小的快乐。'],['The Hermit','隐士','Give yourself quiet time.','给自己一点独处时间。'],['Temperance','节制','Find your balance.','找回自己的节奏。'],['The Fool','愚人','Stay curious.','保持好奇。']].sort(()=>Math.random()-.5);open(tr('Choose a card','选一张塔罗牌'),'<p>'+tr('Think of what is on your mind.','想想最近在意的事。')+'</p><div class="cardrow">'+a.slice(0,3).map((_,i)=>'<button class="tarot5" data-card5="'+i+'">✦</button>').join('')+'</div><div id="tarotResult"></div><p class="muted">'+tr('For entertainment and reflection only.','仅供娱乐与自我探索。')+'</p>');document.querySelectorAll('[data-card5]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-card5]').forEach(v=>v.disabled=true);let v=a[+b.dataset.card5];b.animate([{transform:'rotateY(0)'},{transform:'rotateY(90deg)'}],{duration:300});setTimeout(()=>{if(!$('tarotResult'))return;b.textContent=tr(v[0],v[1]);b.classList.add('revealed');b.animate([{transform:'rotateY(-90deg)'},{transform:'rotateY(0) translateY(-10px)'}],{duration:350});$('tarotResult').textContent=tr(v[2],v[3]);feedback()},300)});return}let a=[['Go eat first.','先去吃饭。'],['Give it a little time.','不妨再等等。'],['Try a small step.','先迈出一小步。'],['Ask again after a nap.','睡醒再想。'],['Consider another angle.','换个角度看看。']];open(tr('Book of answers','答案之书'),'<div class="note" id="page5" style="min-height:130px;text-align:center;font-size:22px;padding:30px">✦</div><button id="stop5">'+tr('Stop the pages','停在这一页')+'</button><p class="muted">'+tr('Playful prompts, not advice.','娱乐提示，不作为决策依据。')+'</p>');let i=0,t=setInterval(()=>{if(!$('page5'))return clearInterval(t);$('page5').textContent=tr(...a[i++%a.length])},100);$('stop5').onclick=()=>{clearInterval(t);$('page5').textContent=tr(...pick(a));$('stop5').disabled=true;feedback()}}
const oldBoard5=board;board=function(){let posts=[tr('Why can’t team bonding just be cash?','团建为什么不能直接发钱？'),tr('My boss said quick call. It was 58 minutes.','老板说简单聊聊，结果聊了58分钟。'),tr('What is everyone eating today?','今天大家吃什么？'),tr('Double salary or no meetings forever?','工资翻倍还是永远不开会？'),...notes];open(tr('Garden notice board','花园吐槽墙'),'<p class="muted">'+tr('Official fictional prompts and your local notes. No live community yet.','官方虚构话题及本机留言，暂未连接真实社区。')+'</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'+posts.map((v,i)=>'<button data-note5="'+i+'" style="background:'+['#f0d49e','#eab6c0','#c6d8b5','#bfd4e4'][i%4]+';color:#614e56;text-align:left;min-height:100px;overflow-wrap:anywhere;transform:rotate('+(i%3-1)*1.5+'deg)">'+escText(v.slice(0,85))+'</button>').join('')+'</div><textarea id="vent" rows="3" maxlength="240" placeholder="'+tr('Pin a thought here…','留下你的吐槽…')+'"></textarea><button id="post">'+tr('Pin locally','本机留言')+'</button><button id="clearNotes">'+tr('Clear mine','清除我的留言')+'</button>');document.querySelectorAll('[data-note5]').forEach(b=>b.onclick=()=>{toast(posts[+b.dataset.note5])});$('post').onclick=()=>{let v=$('vent').value.trim();if(v){notes.unshift(v);notes=notes.slice(0,40);save();board()}};$('clearNotes').onclick=()=>{notes=[];save();board()}};
function draw5(){if(scene==='district')district5();else if(scene==='temple'){activityCoords();temple5()}else if(scene==='unwind'){activityCoords();unwind5()}else if(scene==='pillow'||scene==='paper'){activityCoords();smash5()}else if(scene==='petcare'){activityCoords();petcare5()}else if(scene==='food'){activityCoords();food5()}else if(scene==='lots'){activityCoords();lots5()}else if(scene==='garden'){activityCoords();garden5()}else baseDraw5()}
drawActivity=draw5;
updateActivity=function(){if(scene==='food'&&activity.speed>0){activity.angle+=activity.speed*dt;activity.speed*=Math.pow(.34,dt);if(activity.speed<.35){activity.speed=0;let n=Math.floor(((Math.PI*1.5-activity.angle)%tau+tau)%tau/(tau/8));toast(tr('Today: ','今天吃：')+tr(...foods5[n]));feedback(660)}}if(scene==='petcare')activity.pet=Math.max(0,activity.pet-dt*1.5);if(scene==='claw'&&activity.grab){let a=activity.grab;if(a.phase>.63&&!a.checked){a.checked=true;if(a.toy&&Math.random()<.45){a.toy.x=activity.clawX;a.toy.y=360;a.toy=null;toast(tr('Oops, it slipped!','哎呀，娃娃滑掉了！'))}}}baseUpdate5()};
function pdown5(e){if(modal||!started)return;if(scene==='district'){pointers5.set(e.pointerId,point(e));c.setPointerCapture(e.pointerId);if(pointers5.size===2){let a=[...pointers5.values()];pinch5=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);mapDrag5=null}else mapDrag5={x:e.clientX,y:e.clientY,ox:map5.x,oy:map5.y,moved:false};return}if(['pillow','paper','petcare','lots'].includes(scene)){if(hit(e.clientX,e.clientY))return;mouse={...point(e),down:true};c.setPointerCapture(e.pointerId);activity.pointer=local(point(e));activity.lastImpact=0;touch5(e);return}baseDown5(e)}
function touch5(e){let q=local(point(e)),old=activity.pointer||q;activity.pointer=q;if(scene==='pillow'||scene==='paper'){let i=Math.round((q.x-145)/155);if(i>=0&&i<3&&Math.abs(q.x-(145+i*155))<80&&Math.abs(q.y-240)<100&&T-(activity.lastImpact||0)>.12){activity.lastImpact=T;activity.impacts=activity.impacts.filter(a=>a.i!==i);activity.impacts.push({i,t:T});activity.count++;feedback(100);pfx(e.clientX,e.clientY,'#fff1d6',9)}}if(scene==='petcare'&&Math.abs(q.x-300)<155&&q.y>95&&q.y<355){activity.pet=4;if(T-(activity.lastImpact||0)>.18){activity.lastImpact=T;let k=activity.tool==='feed'?'hunger':activity.tool==='brush'?'clean':'happy';pet5[k]=clamp(pet5[k]+3,0,100);petSave5();pfx(e.clientX,e.clientY,'#efb2ba',3);sound(130,'sine',.12)}}if(scene==='lots'){activity.shake=Math.min(100,activity.shake+Math.abs(q.x-old.x)*.22);if(activity.shake>=100){mouse.down=false;activity.shake=0;open(tr('Your fortune stick','今日签文'),'<div class="note">'+escText(pick(lang==='zh'?['凡事慢慢来，心安便好。','今日宜休息，忌无谓焦虑。','小事也有小欢喜。']:['Take your time.','Rest is allowed.','Small joys count.']))+'</div><p class="muted">'+tr('For entertainment only.','仅供娱乐。')+'</p>');feedback(660)}}}
function pmove5(e){if(scene==='district'&&pointers5.has(e.pointerId)){pointers5.set(e.pointerId,point(e));if(pointers5.size===2){let a=[...pointers5.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pinch5>0)map5.z=clamp(map5.z*d/pinch5,.75,2.4);pinch5=d}else if(mapDrag5){let dx=e.clientX-mapDrag5.x,dy=e.clientY-mapDrag5.y;if(Math.hypot(dx,dy)>6)mapDrag5.moved=true;if(mapDrag5.moved){map5.x=clamp(mapDrag5.ox+dx/A,-350,350);map5.y=clamp(mapDrag5.oy+dy/A,-270,270)}}return}if(mouse.down&&['pillow','paper','petcare','lots'].includes(scene)){touch5(e);return}baseMove5(e)}
function pup5(e){if(scene==='district'){if(pointers5.size===1&&mapDrag5&&!mapDrag5.moved)hit(e.clientX,e.clientY);pointers5.delete(e.pointerId);mapDrag5=null;pinch5=0;return}if(['pillow','paper','petcare','lots'].includes(scene)){mouse.down=false;return}baseUp5(e)}
c.removeEventListener('pointerdown',baseDown5);c.removeEventListener('pointermove',baseMove5);c.removeEventListener('pointerup',baseUp5);c.addEventListener('pointerdown',pdown5);c.addEventListener('pointermove',pmove5);c.addEventListener('pointerup',pup5);c.addEventListener('pointercancel',e=>{pointers5.delete(e.pointerId);mapDrag5=null;pinch5=0});
