<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MeowBox · Fortune Valley</title><style>body{margin:0;background:#263c32;color:#f6ecd3;font:18px Georgia;display:grid;place-items:center;min-height:100dvh}main{text-align:center;padding:24px}small{display:block;margin-top:12px}button{font:inherit}</style></head><body><main>MeowBox<small role="status" aria-live="polite">Preparing your journey…</small></main><script src="src/assemble.js"></script><script>
async function fetchText(path){
  for(let attempt=0;attempt<2;attempt++){
    const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),25000);
    try{const res=await fetch(path,{cache:'no-cache',signal:controller.signal});if(!res.ok)throw Error(path+' '+res.status);return await res.text()}
    catch(e){if(attempt===1)throw e}finally{clearTimeout(timer)}
  }
}
async function boot(){
  const progress=document.querySelector('small');
  const paths=['src/shell.html','src/engine.js','src/extensions.js','src/release-fixes.js','src/startup.js'];let loaded=0;
  const track=p=>p.then(v=>{progress.textContent='Preparing your journey… '+Math.round(++loaded/paths.length*100)+'%';return v});
  const files=await Promise.all(paths.map(p=>track(fetchText(p))));
  const html=assembleMeowBox(files[0],files.slice(1));
  document.open();document.write(html);document.close();
}
boot().catch(error=>{console.error(error);const main=document.querySelector('main');if(!main)return;main.replaceChildren();const title=document.createElement('h2');title.textContent='Your train is delayed';const detail=document.createElement('p');detail.textContent='旅途稍有延误 · Your saved progress has not been cleared.';const button=document.createElement('button');button.textContent='Try again · 重试';button.onclick=()=>location.reload();main.append(title,detail,button)});
</script></body></html>
