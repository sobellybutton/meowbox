#mobilePlaces{position:fixed;z-index:6;left:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 135px);min-height:44px}
#mobilePicker{position:fixed;z-index:7;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 78px);max-height:60dvh;overflow:auto;background:#fff0df;border:2px solid #dba58f;border-radius:20px;padding:12px;box-shadow:0 8px 30px #201b3277}
#mobilePicker button{width:100%;min-height:44px;margin:3px 0;text-align:left}
#room{padding:calc(env(safe-area-inset-top,0px) + 8px) 8px calc(env(safe-area-inset-bottom,0px) + 20px);overflow-x:hidden;overscroll-behavior:contain}
#roomHead{position:sticky;top:0;z-index:12;background:#f6e0d4f5;border-radius:16px;padding:5px;gap:5px}#roomHead button{min-width:44px;min-height:44px;padding:6px}#roomHead h1{font-size:clamp(16px,5vw,22px);text-align:center;overflow-wrap:anywhere}
#stage,#stage.rpg-stage{min-width:0;width:100%;margin:8px auto;min-height:0}#stage *{max-width:100%}#stage button{min-height:44px;overflow-wrap:anywhere}#stage input,#stage textarea,#stage select{font-size:16px;min-width:0}
#stage .row{gap:6px}#stage .panel{padding:12px;min-width:0;overflow-wrap:anywhere}#stage .menu{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}#stage .tile{min-width:0;padding:8px}
#stage .rpg-room{min-height:clamp(490px,72dvh,680px);border-radius:16px}#stage .rpg-prop{width:72px;height:72px;max-width:25%;overflow:visible}#stage .rpg-prop small{white-space:normal;font-size:10px;line-height:1.1;max-width:100%;padding:3px 4px}#stage .rpg-npc,#stage .rpg-player{width:55px;height:67px}#stage .rpg-dialogue{left:3%;right:3%;bottom:12px;max-height:48%;overflow:auto;padding:10px}#stage .rpg-dialogue button{min-height:44px;margin:2px;padding:6px 8px}#stage .rpg-book{padding:10px;border-width:5px}#stage .rpg-slots{grid-template-columns:repeat(2,minmax(0,1fr))}#stage .rpg-action{padding:10px;min-height:340px}#stage .board{grid-template-columns:repeat(3,minmax(0,75px))}
#stage canvas{max-width:100%;height:auto;touch-action:none}#stage .card{width:clamp(55px,19vw,92px);height:115px}
.welcome input{font-size:16px}.welcome .panel{max-height:90dvh;overflow:auto}

ve(document.getElementById('room'),{attributes:true,attributeFilter:['class']})},650)})();</script><style>#activityIndex{position:fixed;right:12px;bottom:max(16px,env(safe-area-inset-bottom));z-index:9999;background:#24382d;color:#fff;border:1px solid #ffffff70;border-radius:24px;padding:10px 16px;font:500 14px 'DM Sans',sans-serif}#activityList{position:fixed;right:12px;bottom:70px;z-index:9999;width:min(320px,calc(100vw - 24px));max-height:65dvh;overflow:auto;background:#23372c;color:#fff;padding:14px;border-radius:8px;box-shadow:0 10px 35px #0005}#activityList[hidden]{display:none}#activityList button{display:block;width:100%;text-align:left;background:transparent;color:#fff;border:0;border-bottom:1px solid #ffffff25;border-radius:0;box-shadow:none;padding:12px;font:500 15px sans-serif}#roomHead{padding-left:48px}</style><script>(()=>{const id=new URLSearchParams(location.search).get('room');const entries={temple:[['Daily fortune','今日运势',daily],['Tarot','塔罗',tarot],['Birth scroll','生辰小签',birth],['Fortune sticks','求签',sticks],['Moon blocks','掷筊',blocks],['Resignation oracle','辞职神谕',dice],['Wish lantern','许愿',wish],['Book of answers','答案之书',dice]],arcade:[['Claw machine','抓娃娃',claw],['Rhythm','节拍',rhythm],['Tic tac toe','井字棋',tic],['Inbox panic','邮件危机',inbox],['Memory','记忆挑战',memory]],office:[['Pillow smash','枕头大战',()=>smash(false)],['打小人','打小人',()=>smash(true)],['Bubble wrap','捏泡泡',bubble],['Resignation reasons','辞职理由',reasons]],kitchen:[['Milk tea','奶茶',tea],['Lunch roulette','今天吃什么',food]],garden:[['Gossip','八卦',garden],['Conversation','聊天',chat],['Private note','私人留言',wish]],pet:[['Cat care','猫猫小窝',()=>rooms.pet()]],rail:[['Train journeys','铁路旅行',rail]],quiet:[['Relax','休息',quiet]]};const b=document.createElement('button'),list=document.createElement('section');b.id='activityIndex';b.textContent=tr('Activities','活动');list.id='activityList';list.hidden=true;document.body.append(b,list);b.onclick=()=>{list.hidden=!list.hidden};for(const [en,zh,fn] of entries[id]|
