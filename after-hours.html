<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MeowBox — After Hours</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#202b25;color:#fff;font:500 15px 'DM Sans','Noto Sans SC',sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}#top{position:fixed;top:max(18px,env(safe-area-inset-top));left:20px;right:20px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;text-shadow:0 2px 8px #000}#top button,#close{pointer-events:auto;background:#17281dcc;color:white;border:1px solid #ffffff40;border-radius:50%;width:42px;height:42px;font:inherit;cursor:pointer}#top aside{display:flex;gap:8px}#hint{position:fixed;bottom:max(24px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);max-width:90%;text-align:center;text-shadow:0 2px 8px black;pointer-events:none;transition:opacity .4s}#dialog{position:fixed;left:50%;bottom:9%;transform:translateX(-50%);width:min(500px,90%);padding:20px 24px;background:#17281de8;border:1px solid #ffffff30;border-radius:6px;line-height:1.6;box-shadow:0 12px 50px #0005}#dialog button{font:inherit;background:none;color:#e6d6a4;border:0;padding:12px 18px 0 0;cursor:pointer}#dialog[hidden]{display:none}#fade{position:fixed;inset:0;background:#14221a;pointer-events:none;opacity:0;transition:opacity .35s}#journal{position:fixed;inset:0;background:#17241be8;display:grid;place-items:center;padding:28px}#journal[hidden]{display:none}article{width:min(440px,100%);max-height:85vh;overflow:auto;background:#f0ead7;color:#354337;padding:28px;border-radius:4px;box-shadow:0 20px 80px #0008}article h2{font-weight:500}article p{border-bottom:1px solid #a3ad9944;padding:10px 0}#close{float:right;background:#354337}small{opacity:.75}</style><canvas id="game" aria-label="Interactive village"></canvas><div id="top"><div><strong>MeowBox</strong><br><small id="place">After hours</small></div><aside><button id="lang" aria-label="Switch language">中</button><button id="book" aria-label="Journal">▤</button></aside></div><div id="hint"></div><div id="dialog" hidden></div><div id="journal" hidden><article><button id="close">×</button><h2 id="jt"></h2><div id="entries"></div></article></div><div id="fade"></div><script src="art-original.js"></script><script>
(()=>{'use strict';const $=x=>document.getElementById(x),c=$('game'),g=c.getContext('2d'),A=window.MEOW_ART||{},img=new Image(),train=new Image(),routes=[];if(A.town)img.src=A.town;if(A.train)train.src=A.train;for(let i=0;i<4;i++){let a=new Image();if(A['route'+i])a.src=A['route'+i];routes.push(a)}let state={lang:'en',items:[]};try{Object.assign(state,JSON.parse(localStorage.getItem('meow-after-hours')||'{}'))}catch{}const tr=(a,b)=>state.lang==='zh'?b:a,save=()=>{try{localStorage.setItem('meow-after-hours',JSON.stringify(state))}catch{}},clamp=(x,a,b)=>Math.max(a,Math.min(b,x));let W,H,D,scale=1,cx=0,cy=0,scene='town',p={x:748,y:470},target=null,pending=null,t=0,last=0,gesture=null,rail=0,transition=false,dialog=false,keys=new Set(),ripple=null,cast=null,fish=null;const places=[['kitchen','Grandma’s kitchen','阿嬷厨房',275,235,380,365],['temple','The shrine','解忧小庙',730,158,730,396],['arcade','Arcade','摸鱼电玩城',1135,210,1100,360],['rail','Railway','别处铁路',1485,190,1370,328],['office','Stress relief','不想上班事务所',1340,400,1160,512],['pet','Pawradise','猫猫小窝',1335,635,1210,777],['garden','Tea garden','摸鱼茶馆',260,612,405,733],['quiet','Quiet corner','治愈小屋',785,812,820,640]];const paths=[[748,470],[730,396],[380,365],[1100,360],[1370,328],[1160,512],[1210,777],[405,733],[820,640],[610,615],[970,560]],edges=[[0,1],[0,2],[0,3],[3,4],[3,5],[0,9],[9,7],[9,8],[8,10],[10,5],[10,6],[0,10]];let queue=[];function nearest(x,y){return paths.reduce((best,a,i)=>Math.hypot(a[0]-x,a[1]-y)<Math.hypot(paths[best][0]-x,paths[best][1]-y)?i:best,0)}function walk(x,y,action){const start=nearest(p.x,p.y),end=nearest(x,y),q=[[start]],seen=new Set([start]);let found=[start];while(q.length){const r=q.shift(),n=r[r.length-1];if(n===end){found=r;break}for(const e of edges){const k=e[0]===n?e[1]:e[1]===n?e[0]:-1;if(k>=0&&!seen.has(k)){seen.add(k);q.push([...r,k])}}}queue=found.map(i=>paths[i]);pending=action;target=queue.shift()}function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0);scale=Math.max(W/1672,H/941,.75)}addEventListener('resize',resize);resize();function hint(a,b){$('hint').textContent=tr(a,b)}function label(){ $('lang').textContent=tr('中','EN');$('place').textContent=scene==='rail'?tr('Somewhere else','去远方'):tr('After hours','精神下班');document.documentElement.lang=state.lang==='zh'?'zh':'en'}label();function say(a,b,opts=[]){dialog=true;const el=$('dialog');el.replaceChildren();let line=document.createElement('div');line.textContent=tr(a,b);el.append(line);for(const [en,zh,fn] of opts.length?opts:[['Continue','继续',()=>{}]]){let button=document.createElement('button');button.textContent=tr(en,zh);button.onclick=()=>{el.hidden=true;dialog=false;fn()};el.append(button)}el.hidden=false}function reward(en,zh){if(!state.items.some(x=>x[0]===en)){state.items.push([en,zh]);save()}}function fade(fn){if(transition)return;transition=true;$('fade').style.opacity=1;setTimeout(()=>{fn();label();$('fade').style.opacity=0;setTimeout(()=>transition=false,360)},360)}function enter(s){const id=s[0];if(id==='rail'){say('Next train is leaving. No meetings on board.','列车即将出发。本车禁止开会。',[['Board','上车',()=>fade(()=>{scene='rail';rail=0;hint('Tap the window to change the view. Esc to return.','点击窗户切换风景，Esc 返回。');reward('One way out','逃离车票')})],['Not yet','再等等',()=>{}]]);return}if(id==='garden'){say('The pond is quiet today. Want to see what’s biting?','今天池塘挺安静。来钓鱼吗？',[['Cast a line','抛竿',()=>{cast={x:405,y:733,start:t};hint('Wait for the ripple, then tap it.','等水面有动静，再点击。')}],['Later','下次吧',()=>{}]]);return}if(id==='temple'){const fortunes=[['Your next meeting will be cancelled. Probably by another meeting.','今日宜摸鱼，忌主动揽活。'],['Do not reply to a message just because it says quick question.','所谓五分钟，通常是一小时。'],['The best decision today is lunch.','今日最佳决策：午饭吃什么。']];say('What’s on your mind?','今天想问点什么？',[['Work','工作',()=>{let f=fortunes[Math.floor(Math.random()*fortunes.length)];reward('A small fortune','摸鱼小签');say(...f)}],['Nothing, really','随便看看',()=>{}]]);return}const lines={kitchen:['The kitchen smells incredible. The full cooking scene is not open in this build.','厨房香气扑鼻。此版本尚未开放烹饪场景。'],arcade:['The cabinets are being restored.','电玩城正在整修。'],office:['The auntie is away. Even she needs a break.','婆婆休息去了。'],pet:['The cats are out exploring today.','猫猫们出门玩了。'],quiet:['Take a moment. Nothing is due here.','休息一下，这里没有截止日期。']};say(...lines[id])}function back(){if(scene==='rail')fade(()=>{scene='town';hint('Tap a path or building to explore.','点击小路或建筑探索。')});else if(dialog){$('dialog').hidden=true;dialog=false}else $('journal').hidden=true}function point(e){return {x:(e.clientX-cx)/scale,y:(e.clientY-cy)/scale}}function tap(e){if(transition||dialog||!$('journal').hidden)return;if(scene==='rail'){if(e.clientX<75&&e.clientY<100){back();return}rail=(rail+1)%5;reward(['A mountain view','A quiet coast','A distant meadow','A passing landscape','One way out'][rail],['山间风景','宁静海岸','远方草原','旅途风景','逃离车票'][rail]);return}let a=point(e);if(cast&&t-cast.start>2&&Math.hypot(a.x-cast.x,a.y-cast.y)<110){cast=null;const loot=[['A very wet resignation letter','湿透的辞职信'],['An office access card','办公室门禁卡'],['A tiny silver fish','小银鱼']][Math.floor(Math.random()*3)];reward(...loot);say('You caught: '+loot[0]+'.','钓到了：'+loot[1]+'。');return}let s=places.reduce((best,b)=>Math.hypot(b[4]-a.x,b[5]-a.y)<Math.hypot(best[4]-a.x,best[5]-a.y)?b:best,places[0]);if(Math.hypot(s[4]-a.x,s[5]-a.y)<125){walk(s[6],s[7],()=>enter(s));ripple={x:s[6],y:s[7],start:t}}else{walk(a.x,a.y,null);ripple={x:a.x,y:a.y,start:t}}}c.addEventListener('pointerdown',e=>{gesture={x:e.clientX,y:e.clientY};c.setPointerCapture(e.pointerId)});c.addEventListener('pointerup',e=>{if(gesture&&Math.hypot(e.clientX-gesture.x,e.clientY-gesture.y)<18)tap(e);gesture=null});c.addEventListener('pointercancel',()=>gesture=null);addEventListener('keydown',e=>{if(e.key==='Escape'){back();return}keys.add(e.key.toLowerCase());if(e.key.startsWith('Arrow'))e.preventDefault()});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));addEventListener('blur',()=>keys.clear());$('lang').onclick=()=>{state.lang=tr('zh','en');save();label();hint('Tap a path or building to explore.','点击小路或建筑探索。')};$('book').onclick=()=>{if(scene==='rail'){back();return}$('jt').textContent=tr('Things found along the way','旅途拾遗');$('entries').replaceChildren();for(const item of state.items){let p=document.createElement('p');p.textContent=tr(...item);$('entries').append(p)}if(!state.items.length)$('entries').textContent=tr('Nothing collected yet. Go wandering.','还没有收藏，出去走走吧。');$('journal').hidden=false};$('close').onclick=()=>$('journal').hidden=true;function drawImage(im,x,y,w,h){if(im.complete&&im.naturalWidth)g.drawImage(im,x,y,w,h)}function frame(ms){let dt=Math.min(.05,(ms-last)/1000||0);last=ms;t+=dt;g.setTransform(D,0,0,D,0,0);g.fillStyle='#25382e';g.fillRect(0,0,W,H);if(scene==='rail'){let s=Math.max(W/1672,H/941),w=1672*s,h=941*s,x=(W-w)/2,y=(H-h)/2;drawImage(train,x,y,w,h);if(rail&&routes[rail-1]?.naturalWidth){g.save();g.beginPath();g.rect(x+w*.27,y+h*.18,w*.48,h*.47);g.clip();let a=routes[rail-1],offset=(t*22)%(w*.55);drawImage(a,x+w*.27-offset,y+h*.18,w*.55,h*.47);drawImage(a,x+w*.82-offset,y+h*.18,w*.55,h*.47);g.restore()}g.fillStyle='#ffffff';g.font='500 16px DM Sans';g.fillText(tr('← Return to town','← 返回小镇'),18,90)}else{if(!dialog&&$('journal').hidden&&target){let dx=target[0]-p.x,dy=target[1]-p.y,d=Math.hypot(dx,dy),step=240*dt;if(d<=step){p.x=target[0];p.y=target[1];target=queue.shift()||null;if(!target&&pending){let a=pending;pending=null;a()}}else{p.x+=dx/d*step;p.y+=dy/d*step}}let tx=clamp(W/2-p.x*scale,Math.min(0,W-1672*scale),0),ty=clamp(H/2-p.y*scale,Math.min(0,H-941*scale),0);cx+=(tx-cx)*Math.min(1,dt*8);cy+=(ty-cy)*Math.min(1,dt*8);g.save();g.translate(cx,cy);g.scale(scale,scale);drawImage(img,0,0,1672,941);if(!img.naturalWidth){g.fillStyle='#fff';g.fillText('Loading village artwork…',720,460)}for(let i=0;i<25;i++){let x=(i*173+t*(7+i%3))%1672,y=(i*97+Math.sin(t*.7+i)*20)%941;g.fillStyle='rgba(255,240,188,'+(.15+.14*Math.sin(t+i))+')';g.beginPath();g.ellipse(x,y,2,4,t+i,0,7);g.fill()}if(ripple&&t-ripple.start<1){g.strokeStyle='rgba(255,255,220,'+(1-t+ripple.start)+')';g.lineWidth=2;g.beginPath();g.arc(ripple.x,ripple.y,8+(t-ripple.start)*30,0,7);g.stroke()}if(cast){let d=t-cast.start;if(d>2){g.strokeStyle='#fff9c9';g.lineWidth=3;g.beginPath();g.arc(cast.x,cast.y,15+Math.sin(t*5)*8,0,7);g.stroke()}if(d>12){cast=null;hint('The fish got away. Try again.','鱼跑了，再试试。')}}g.fillStyle='#14271d80';g.beginPath();g.ellipse(p.x,p.y+2,13,5,0,0,7);g.fill();g.fillStyle='#f4d9a0';g.beginPath();g.arc(p.x,p.y-10+(target?Math.sin(t*18)*3:0),7,0,7);g.fill();g.strokeStyle='#fff4d0';g.lineWidth=1.5;g.beginPath();g.arc(p.x,p.y-10,12,0,7);g.stroke();g.restore()}requestAnimationFrame(frame)}hint('Tap a path or building to explore.','点击小路或建筑探索。');requestAnimationFrame(frame)})();
