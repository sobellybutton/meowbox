<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>MeowBox · Fortune Valley 解忧谷</title>
<style>
  :root {
    --ink: #2c221e;
    --ink-soft: #5c4b43;
    --paper: #f6efe2;
    --paper-warm: #ede0c8;
    --vermilion: #c84b31;
    --gold: #d49b38;
    --sage: #5e7a68;
    --night: #1c2230;
  }
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100dvh;
    overflow: hidden;
    background: #1a1614;
    font-family: "Georgia", "Songti SC", "STSong", "Noto Serif SC", serif;
    color: var(--ink);
    touch-action: manipulation;
  }
  #gameCanvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: pointer;
  }
  /* Subtle hand-drawn paper grain overlay */
  #paperGrain {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    opacity: 0.055;
    background-image: radial-gradient(#2c221e 0.75px, transparent 0.75px),
                      radial-gradient(#5c4b43 0.5px, #f6efe2 0.5px);
    background-size: 24px 24px;
    background-position: 0 0, 12px 12px;
    mix-blend-mode: multiply;
  }

  /* Minimal Top-Right Controls (Language & Audio & Settings) */
  #topControls {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 14px);
    right: calc(env(safe-area-inset-right, 0px) + 16px);
    z-index: 30;
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .ink-pill {
    background: rgba(246, 239, 226, 0.86);
    backdrop-filter: blur(6px);
    border: 1.5px solid rgba(44, 34, 30, 0.45);
    color: var(--ink);
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 13px;
    font-family: inherit;
    letter-spacing: 0.03em;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    transition: transform 0.15s ease, background 0.2s ease;
  }
  .ink-pill:hover {
    background: rgba(255, 250, 240, 0.96);
    transform: translateY(-1px);
  }
  .ink-pill:active {
    transform: translateY(1px);
  }

  /* Subtle Top-Left Diegetic Location Whisper (Only active in Valley) */
  #valleyHeader {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 14px);
    left: calc(env(safe-area-inset-left, 0px) + 16px);
    z-index: 25;
    display: none;
    align-items: center;
    gap: 10px;
    background: rgba(246, 239, 226, 0.84);
    backdrop-filter: blur(6px);
    border: 1.5px solid rgba(44, 34, 30, 0.4);
    padding: 5px 14px 5px 8px;
    border-radius: 999px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.12);
    pointer-events: auto;
  }
  #miniAvatarCanvas {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: #e9dec8;
    border: 1px solid rgba(44,34,30,0.35);
  }
  .vh-text {
    display: flex;
    flex-direction: column;
    line-height: 1.15;
  }
  .vh-name {
    font-size: 13px;
    font-weight: bold;
    color: var(--ink);
  }
  .vh-sub {
    font-size: 11px;
    color: var(--ink-soft);
  }

  /* Diegetic Ticket Name Input (Borderless handwritten ink right on the illustrated ticket) */
  #ticketInputWrap {
    position: fixed;
    left: 50%;
    top: 53%;
    transform: translate(-50%, -50%);
    z-index: 28;
    display: none;
    flex-direction: column;
    align-items: center;
    pointer-events: auto;
  }
  #ticketNameInput {
    width: 220px;
    background: transparent;
    border: none;
    border-bottom: 2px dashed rgba(44, 34, 30, 0.55);
    outline: none;
    text-align: center;
    font-family: "Georgia", "Kaiti SC", "STKaiti", "Songti SC", serif;
    font-size: 22px;
    font-style: italic;
    color: #2b1e19;
    padding: 4px 8px;
    user-select: text;
  }
  #ticketNameInput::placeholder {
    color: rgba(92, 75, 67, 0.5);
    font-size: 16px;
  }
  #ticketConfirmBtn {
    margin-top: 18px;
    background: var(--vermilion);
    color: #fff9f0;
    border: 1.5px solid #2c221e;
    border-radius: 999px;
    padding: 7px 22px;
    font-family: inherit;
    font-size: 14px;
    letter-spacing: 0.05em;
    cursor: pointer;
    box-shadow: 0 3px 0 #2c221e;
    transition: transform 0.12s ease;
  }
  #ticketConfirmBtn:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #2c221e;
  }

  /* Diegetic Wish Input inside Wishing Garden */
  #wishInputWrap {
    position: fixed;
    left: 50%;
    top: 52%;
    transform: translate(-50%, -50%);
    z-index: 35;
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  #wishTextInput {
    width: 240px;
    height: 76px;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    text-align: center;
    font-family: "Georgia", "Kaiti SC", "STKaiti", serif;
    font-size: 16px;
    line-height: 1.45;
    color: #2c221e;
    user-select: text;
  }

  /* Earned Diegetic Bottom Dock (Hidden until items are physically received!) */
  #diegeticDock {
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
    left: 50%;
    transform: translateX(-50%);
    z-index: 26;
    display: none;
    gap: 10px;
    padding: 6px 12px;
    background: rgba(246, 239, 226, 0.88);
    backdrop-filter: blur(8px);
    border: 1.5px solid rgba(44, 34, 30, 0.5);
    border-radius: 999px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18);
  }
  .dock-item {
    display: none;
    align-items: center;
    gap: 5px;
    background: transparent;
    border: none;
    padding: 5px 11px;
    border-radius: 999px;
    font-family: inherit;
    font-size: 13px;
    color: var(--ink);
    cursor: pointer;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .dock-item.unlocked {
    display: flex;
  }
  .dock-item:hover {
    background: rgba(212, 155, 56, 0.22);
    transform: translateY(-1px);
  }
  .dock-badge {
    background: var(--vermilion);
    color: #fff;
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 999px;
  }

  /* In-Scene Story Choices (Organic floating slips, NOT covering scenery) */
  #storyChoices {
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 74px);
    left: 50%;
    transform: translateX(-50%);
    z-index: 29;
    display: none;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    width: min(92vw, 560px);
  }
  .choice-slip {
    background: rgba(249, 243, 230, 0.94);
    border: 1.5px solid #2c221e;
    border-left: 4px solid var(--vermilion);
    padding: 9px 16px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 14px;
    color: var(--ink);
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(0,0,0,0.16);
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .choice-slip:hover {
    background: #fffdf7;
    transform: translateY(-2px);
  }

  /* Illustrated Keepsake Book / Interior Activity Layer (Drawn like open sketchbook / tabletop, never generic web grid) */
  #bookOverlay {
    position: fixed;
    inset: 0;
    z-index: 40;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(20, 16, 14, 0.58);
    backdrop-filter: blur(4px);
    padding: 16px;
  }
  .storybook-sheet {
    position: relative;
    width: min(94vw, 680px);
    max-height: 86dvh;
    overflow-y: auto;
    background: linear-gradient(135deg, #f8f1e3 0%, #efe3cc 100%);
    border: 2px solid #2c221e;
    border-radius: 14px;
    box-shadow: 0 16px 42px rgba(0,0,0,0.42), inset 0 0 0 4px rgba(255,255,255,0.35);
    padding: 22px 24px;
    color: var(--ink);
  }
  .sheet-close {
    position: sticky;
    top: 0;
    float: right;
    background: #2c221e;
    color: #f8f1e3;
    border: none;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    font-size: 15px;
    cursor: pointer;
    z-index: 5;
  }
  .storybook-title {
    margin: 0 0 4px 0;
    font-size: 21px;
    letter-spacing: 0.03em;
    color: #2c221e;
  }
  .storybook-sub {
    margin: 0 0 16px 0;
    font-size: 13px;
    color: var(--ink-soft);
    font-style: italic;
  }
  .stamp-row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 12px;
  }
  .passport-stamp {
    width: calc(33.33% - 8px);
    min-width: 130px;
    min-height: 92px;
    border: 1.5px dashed rgba(44,34,30,0.32);
    border-radius: 10px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    background: rgba(255,252,245,0.5);
    position: relative;
  }
  .passport-stamp.stamped {
    border-style: solid;
    border-color: rgba(200, 75, 49, 0.65);
    background: rgba(255, 248, 236, 0.88);
  }
  .stamp-seal {
    font-size: 12px;
    font-weight: bold;
    color: var(--vermilion);
    border: 2px solid var(--vermilion);
    border-radius: 50%;
    padding: 6px 8px;
    transform: rotate(-8deg);
    margin-bottom: 5px;
    letter-spacing: 0.04em;
  }
  .tarot-table {
    background: radial-gradient(circle at center, #2b2338 0%, #171321 100%);
    border: 2px solid #d49b38;
    border-radius: 12px;
    padding: 18px;
    color: #f6efe2;
    margin-top: 10px;
  }
  .tarot-cards-row {
    display: flex;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
    margin: 16px 0;
  }
  .tarot-slot {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 145px;
  }
  .tarot-card-canvas {
    width: 132px;
    height: 210px;
    border-radius: 9px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.45);
    cursor: pointer;
    transition: transform 0.28s ease;
  }
  .tarot-card-canvas:hover {
    transform: translateY(-5px);
  }
  .ink-btn {
    background: #2c221e;
    color: #f8f1e3;
    border: 1.5px solid #d49b38;
    padding: 8px 16px;
    border-radius: 999px;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    margin: 4px;
    transition: transform 0.12s ease, opacity 0.15s;
  }
  .ink-btn:hover {
    transform: translateY(-1px);
  }
  .ink-btn.active {
    background: var(--vermilion);
    border-color: #fff3dd;
  }
  @media (max-width: 560px) {
    .passport-stamp { width: calc(50% - 6px); min-width: 110px; }
    .tarot-slot { width: 106px; }
    .tarot-card-canvas { width: 102px; height: 164px; }
    .storybook-sheet { padding: 16px; }
  }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>
<div id="paperGrain"></div>

<!-- Top-Left Diegetic Header (Only visible once inside Fortune Valley) -->
<div id="valleyHeader">
  <canvas id="miniAvatarCanvas" width="60" height="60"></canvas>
  <div class="vh-text">
    <span class="vh-name" id="vhName">Traveller</span>
    <span class="vh-sub" id="vhLoc">Fortune Valley · 解忧谷 (0/24)</span>
  </div>
</div>

<!-- Top-Right Minimal Controls -->
<div id="topControls">
  <button class="ink-pill" id="skipBtn" style="display:none;"></button>

  <button class="ink-pill" id="muteBtn" title="Sound">♪</button>

</div>

<!-- Diegetic Handwritten Name Input on the Ticket -->

</div>

<!-- Diegetic Wish Input for Wishing Garden -->
<div id="wishInputWrap">

</div>

<!-- Organic Floating Story Reply Slips -->
<div id="storyChoices"></div>

<!-- Diegetic Earned Dock -->
<div id="diegeticDock">

  <button class="dock-item" id="dockPassport"><span>📖</span><span data-i18n="dock_passport">Passport</span><span class="dock-badge" id="stampCountBadge">0/24</span></button>
  <button class="dock-item" id="dockBag"><span>👜</span><span data-i18n="dock_bag">Bag</span><span class="dock-badge" id="bagCountBadge">0</span></button>
  <button class="dock-item" id="dockMap"><span>🗺</span><span data-i18n="dock_map">Scroll</span></button>
</div>

<!-- Illustrated Storybook / Tabletop Activity Sheet -->
<div id="bookOverlay">
  <div class="storybook-sheet" id="storybookContent"></div>
</div>

    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {

      const rr = Math.min(rad, Math.abs(w) / 2, Math.abs(h) / 2);
      this.moveTo(x + rr, y);
      this.arcTo(x + w, y, x + w, y + h, rr);
      this.arcTo(x + w, y + h, x, y + h, rr);
      this.arcTo(x, y + h, x, y, rr);
      this.arcTo(x, y, x + w, y, rr);
      this.closePath();
      return this;

  /* =========================================================================
     5. AMBIENT WEBAUDIO SYNTHESIZER (Gentle Pentatonic Music & Tactile SFX)
     ========================================================================= */
  class SoundEngine {
    constructor() {
      this.ctx = null;
      this.muted = false;
      this.bgmTimer = null;
    }
    init() {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) this.ctx = new AC();
      }
      if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
      if (!this.bgmTimer) this.startAmbient();
    }
    playTone(freq, dur = 0.25, type = "sine", vol = 0.06, slide = 0) {
      if (this.muted || !this.ctx) return;
      try {
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), now + dur);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(vol, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0008, now + dur);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + dur + 0.02);
      } catch (e) {}
    }
    sfxMeow(catIdx = 0) {
      const base = [520, 610, 440, 580][catIdx % 4];
      this.playTone(base, 0.16, "triangle", 0.08, 120);
      setTimeout(() => this.playTone(base * 1.15, 0.22, "sine", 0.07, -90), 90);
    }
    sfxStamp() {
      this.playTone(110, 0.14, "triangle", 0.15, -55);
      setTimeout(() => this.playTone(760, 0.18, "sine", 0.05, 120), 60);
    }
    sfxStep() {
      this.playTone(190 + Math.random() * 40, 0.05, "sine", 0.025, -30);
    }
    sfxRattle() {
      for (let i = 0; i < 5; i++) {
        setTimeout(() => this.playTone(680 + Math.random() * 400, 0.06, "triangle", 0.05, -120), i * 55);
      }
    }
    sfxChime() {
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
        setTimeout(() => this.playTone(f, 0.55, "sine", 0.045), i * 85);
      });
    }
    startAmbient() {
      const notes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];
      this.bgmTimer = setInterval(() => {
        if (this.muted || !this.ctx || document.hidden) return;
        if (Math.random() < 0.68) {
          const f = notes[Math.floor(Math.random() * notes.length)];
          this.playTone(f, 1.4, "sine", 0.022);
          if (Math.random() < 0.3) {
            setTimeout(() => this.playTone(f * 1.5, 1.1, "sine", 0.014), 280);
          }
        }
      }, 1500);
    }
  }
  const sound = new SoundEngine();

  function loadSave() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return;
      const d = JSON.parse(raw);
      if (d && d.playerName) {
        state.hasSavedJourney = true;
        state.lang = d.lang || "en";
        state.savedSnapshot = d;
      }
    } catch (e) {}
  }

  function saveGame() {
    try {
      const payload = {
        lang: state.lang,
        playerName: state.playerName || t("default_name"),
        catIndex: state.catIndex,
        hasPassport: state.hasPassport,
        hasBag: state.hasBag,
        stamps: state.stamps,
        bagItems: state.bagItems,
        wishes: state.wishes.slice(-12),
        px: state.px,
        py: state.py,
        gateOpened: state.gateOpenProgress >= 1
      };
      localStorage.setItem(SAVE_KEY, JSON.stringify(payload));
      state.hasSavedJourney = true;
      state.savedSnapshot = payload;
    } catch (e) {}
  }

  function unlockStamp(id, labelEn, labelZh) {
    if (!state.stamps.includes(id)) {
      state.stamps.push(id);
      sound.sfxStamp();
      updateHUD();
      saveGame();
      showFloatingToast(state.lang === "zh" ? `✦ 获得手帐印章：${labelZh}` : `✦ New Passport Stamp: ${labelEn}`);
      return true;
    }
    return false;
  }

  function addBagItem(id, nameEn, nameZh, descEn, descZh, icon = "✦") {
    if (!state.bagItems.some(it => it.id === id)) {
      state.bagItems.push({ id, nameEn, nameZh, descEn, descZh, icon });
      sound.sfxChime();
      updateHUD();
      saveGame();
    }
  }

  function t(key) {
    return (TEXT[state.lang] && TEXT[state.lang][key]) || TEXT.en[key] || key;
  }

  /* =========================================================================
     8. ILLUSTRATED MANGA CAT RENDERER (Consistent Proportions & Directions!)
     ========================================================================= */
  function drawCat(c, x, y, catIdx, dir = "down", anim = "idle", frame = 0, scale = 1, hasBag = false, expr = "normal") {
    const cat = CATS[catIdx % CATS.length];
    c.save();
    c.translate(x, y);
    c.scale(scale, scale);

    const bob = anim === "walk" ? Math.abs(Math.sin(frame * 0.25)) * 3.5 : Math.sin(frame * 0.06) * 1.1;
    const legSwing = anim === "walk" ? Math.sin(frame * 0.25) * 4.5 : 0;
    const jumpY = anim === "happy" ? -Math.abs(Math.sin(frame * 0.2)) * 9 : 0;

    // Ground soft ink shadow
    c.fillStyle = "rgba(32, 24, 18, 0.22)";
    c.beginPath();
    c.ellipse(0, 2, 15, 5.5, 0, 0, Math.PI * 2);
    c.fill();

    c.translate(0, -bob + jumpY);
    c.lineWidth = 2.1;
    c.strokeStyle = "#261d19";
    c.lineCap = "round";
    c.lineJoin = "round";

    // Swaying Tail
    const tailWag = Math.sin(frame * 0.09 + catIdx) * 7;
    c.save();
    c.strokeStyle = "#261d19";
    c.lineWidth = 6.5;
    c.beginPath();
    if (dir === "left") {
      c.moveTo(9, -11);
      c.quadraticCurveTo(22, -16 + tailWag * 0.4, 21, -26 + tailWag * 0.3);
    } else if (dir === "right") {
      c.moveTo(-9, -11);
      c.quadraticCurveTo(-22, -16 + tailWag * 0.4, -21, -26 + tailWag * 0.3);
    } else {
      c.moveTo(6, -10);
      c.quadraticCurveTo(20 + tailWag * 0.5, -15, 18 + tailWag * 0.8, -28);
    }
    c.stroke();
    c.strokeStyle = cat.id === "mochi" ? cat.patch2 : cat.coat;
    c.lineWidth = 3.8;
    c.stroke();
    c.restore();

    // Little Legs
    const drawFoot = (fx, fy) => {
      c.fillStyle = cat.coat;
      c.beginPath();
      c.roundRect(fx - 4, fy - 7, 8, 9, 4);
      c.fill();
      c.stroke();
    };
    if (dir === "left" || dir === "right") {
      drawFoot(-3 + legSwing * 0.7, 0);
      drawFoot(3 - legSwing * 0.7, 0);
    } else {
      drawFoot(-6.5, legSwing * 0.5);
      drawFoot(6.5, -legSwing * 0.5);
    }

    // Plump Torso (Consistent cozy proportions!)
    c.fillStyle = cat.coat;
    c.beginPath();
    c.ellipse(0, -15, 13, 12.5, 0, 0, Math.PI * 2);
    c.fill();
    c.stroke();

    // Belly Patch (Front / Side)
    if (dir !== "up") {
      c.fillStyle = cat.belly;
      const bx = dir === "left" ? -3.5 : (dir === "right" ? 3.5 : 0);
      c.beginPath();
      c.ellipse(bx, -13.5, dir === "down" ? 7.5 : 5.5, 8, 0, 0, Math.PI * 2);
      c.fill();
    }

    // Calico Patches on Body
    if (cat.id === "mochi") {
      c.fillStyle = cat.patch1;
      c.beginPath();
      c.arc(-7, -18, 4.5, 0, Math.PI * 2);
      c.fill();
      c.fillStyle = cat.patch2;
      c.beginPath();
      c.arc(7, -13, 4, 0, Math.PI * 2);
      c.fill();
    }

    // Woven Traveller's Crossbody Bag!
    if (hasBag) {
      c.strokeStyle = "#6e472b";
      c.lineWidth = 2.6;
      c.beginPath();
      c.moveTo(-8, -24);
      c.lineTo(8, -8);
      c.stroke();
      c.fillStyle = "#d9a962";
      c.strokeStyle = "#261d19";
      c.lineWidth = 1.6;
      const bagX = dir === "left" ? 5 : 8;
      c.beginPath();
      c.roundRect(bagX - 5, -14, 9, 8, 2.5);
      c.fill();
      c.stroke();
    }

    // Arms
    c.fillStyle = cat.coat;
    c.strokeStyle = "#261d19";
    c.lineWidth = 1.9;
    if (dir !== "left") {
      c.beginPath();
      c.ellipse(11, -16, 3.5, 5.5, -0.25, 0, Math.PI * 2);
      c.fill();
      c.stroke();
    }
    if (dir !== "right") {
      c.beginPath();
      c.ellipse(-11, -16, 3.5, 5.5, 0.25, 0, Math.PI * 2);
      c.fill();
      c.stroke();
    }

    // Head
    const hx = dir === "left" ? -1.5 : (dir === "right" ? 1.5 : 0);
    const hy = -34;

    // Ears
    const drawEar = (ex, tilt) => {
      c.save();
      c.translate(hx + ex, hy - 9);
      c.rotate(tilt);
      c.fillStyle = cat.id === "mochi" && ex > 0 ? cat.patch2 : cat.coat;
      c.beginPath();
      c.moveTo(-6, 3);
      c.lineTo(0, -9);
      c.lineTo(6, 3);
      c.closePath();
      c.fill();
      c.stroke();
      if (dir !== "up") {
        c.fillStyle = "#e8b4b4";
        c.beginPath();
        c.moveTo(-3, 2);
        c.lineTo(0, -5);
        c.lineTo(3, 2);
        c.closePath();
        c.fill();
      }
      c.restore();
    };
    drawEar(-9.5, -0.22);
    drawEar(9.5, 0.22);

    // Round Manga Head
    c.fillStyle = cat.coat;
    c.beginPath();
    c.ellipse(hx, hy, 15.5, 13, 0, 0, Math.PI * 2);
    c.fill();

    // Calico or Ginger Forehead Markings
    if (cat.id === "mochi") {
      c.save();
      c.beginPath();
      c.ellipse(hx, hy, 15.5, 13, 0, 0, Math.PI * 2);
      c.clip();
      c.fillStyle = cat.patch1;
      c.beginPath();
      c.arc(hx - 10, hy - 8, 9, 0, Math.PI * 2);
      c.fill();
      c.fillStyle = cat.patch2;
      c.beginPath();
      c.arc(hx + 11, hy - 7, 8.5, 0, Math.PI * 2);
      c.fill();
      c.restore();
    }
    c.beginPath();
    c.ellipse(hx, hy, 15.5, 13, 0, 0, Math.PI * 2);
    c.stroke();

    if (cat.id === "ginger" && dir !== "up") {
      c.strokeStyle = cat.stripe;
      c.lineWidth = 1.6;
      [-3, 0, 3].forEach(dx => {
        c.beginPath();
        c.moveTo(hx + dx, hy - 11);
        c.lineTo(hx + dx * 0.8, hy - 6.5);
        c.stroke();
      });
    }

    // Face Details (When not facing away)
    if (dir !== "up") {
      const fx = hx + (dir === "left" ? -4.5 : (dir === "right" ? 4.5 : 0));
      const blink = (Math.floor(frame / 8) % 26 === 0) || expr === "happy";

      const drawEye = (ex) => {
        if (blink) {
          c.strokeStyle = "#261d19";
          c.lineWidth = 2;
          c.beginPath();
          c.arc(fx + ex, hy - 0.5, 3.2, Math.PI * 1.1, Math.PI * 1.9);
          c.stroke();
        } else if (cat.id === "snowball" && expr !== "surprised") {
          // Quietly judging half-lidded eyes!
          c.fillStyle = cat.eye;
          c.beginPath();
          c.arc(fx + ex, hy - 0.5, 3.1, 0, Math.PI * 2);
          c.fill();
          c.fillStyle = "#1c1614";
          c.beginPath();
          c.arc(fx + ex, hy - 0.5, 1.4, 0, Math.PI * 2);
          c.fill();
          c.fillStyle = cat.coat;
          c.fillRect(fx + ex - 4, hy - 4.5, 8, 3.2);
          c.strokeStyle = "#261d19";
          c.lineWidth = 1.8;
          c.beginPath();
          c.moveTo(fx + ex - 3.6, hy - 1.3);
          c.lineTo(fx + ex + 3.6, hy - 1.3);
          c.stroke();
        } else {
          c.fillStyle = cat.eye;
          c.beginPath();
          c.arc(fx + ex, hy - 1, 3.2, 0, Math.PI * 2);
          c.fill();
          c.fillStyle = "#1a1412";
          c.beginPath();
          c.arc(fx + ex, hy - 1, 1.6, 0, Math.PI * 2);
          c.fill();
          c.fillStyle = "#ffffff";
          c.beginPath();
          c.arc(fx + ex - 1, hy - 2.1, 0.95, 0, Math.PI * 2);
          c.fill();
        }
      };

      if (dir === "left") {
        drawEye(-3);
      } else if (dir === "right") {
        drawEye(3);
      } else {
        drawEye(-5.8);
        drawEye(5.8);
      }

      // Tiny Nose & Cat 'w' Mouth
      c.fillStyle = cat.nose;
      c.beginPath();
      c.arc(fx, hy + 2.5, 1.5, 0, Math.PI * 2);
      c.fill();

      c.strokeStyle = "#261d19";
      c.lineWidth = 1.4;
      c.beginPath();
      c.moveTo(fx - 3.2, hy + 4.5);
      c.quadraticCurveTo(fx - 1.5, hy + 6.2, fx, hy + 4.2);
      c.quadraticCurveTo(fx + 1.5, hy + 6.2, fx + 3.2, hy + 4.5);
      c.stroke();

      // Whiskers
      c.lineWidth = 1.1;
      c.strokeStyle = cat.id === "midnight" ? "#777285" : "#4a3b34";
      if (dir !== "right") {
        c.beginPath();
        c.moveTo(hx - 11, hy + 1); c.lineTo(hx - 18, hy);
        c.moveTo(hx - 11, hy + 3.5); c.lineTo(hx - 17.5, hy + 4.5);
        c.stroke();
      }
      if (dir !== "left") {
        c.beginPath();
        c.moveTo(hx + 11, hy + 1); c.lineTo(hx + 18, hy);
        c.moveTo(hx + 11, hy + 3.5); c.lineTo(hx + 17.5, hy + 4.5);
        c.stroke();
      }
    }

    c.restore();
  }

  // NPC Outfit Helpers (Station Master Cap & Shrine Keeper Robe/Lantern)

  /* =========================================================================
     9. ORGANIC MANGA SPEECH BUBBLE IN WORLD SPACE
     ========================================================================= */
  function drawSpeechBubble(c, sx, sy, text, maxW = 290) {
    if (!text) return;
    c.save();
    c.font = "14px 'Georgia', 'Songti SC', serif";
    // Word-wrap for EN and CJK
    const lines = wrapText(c, text, maxW - 28);
    const lineH = 20;
    const bw = Math.min(maxW, Math.max(120, Math.max(...lines.map(l => c.measureText(l).width)) + 30));
    const bh = lines.length * lineH + 20;
    const bx = Math.max(16, Math.min(W - bw - 16, sx - bw / 2));
    const by = Math.max(58, sy - bh - 18);

    // Warm hand-drawn parchment bubble
    c.fillStyle = "rgba(252, 247, 236, 0.96)";
    c.strokeStyle = "#2c221e";
    c.lineWidth = 2;
    c.beginPath();
    c.roundRect(bx, by, bw, bh, 12);
    c.fill();
    c.stroke();

    // Pointer tail
    const tailX = Math.max(bx + 18, Math.min(bx + bw - 18, sx));
    c.fillStyle = "rgba(252, 247, 236, 0.96)";
    c.beginPath();
    c.moveTo(tailX - 7, by + bh - 1);
    c.lineTo(tailX, by + bh + 10);
    c.lineTo(tailX + 7, by + bh - 1);
    c.closePath();
    c.fill();
    c.beginPath();
    c.moveTo(tailX - 7, by + bh);
    c.lineTo(tailX, by + bh + 10);
    c.lineTo(tailX + 7, by + bh);
    c.stroke();

    c.fillStyle = "#2c221e";
    c.textAlign = "center";
    c.textBaseline = "middle";
    lines.forEach((ln, idx) => {
      c.fillText(ln, bx + bw / 2, by + 18 + idx * lineH);
    });
    c.restore();
  }

  function wrapText(c, str, maxWidth) {
    const hasSpaces = str.includes(" ");
    const tokens = hasSpaces ? str.split(" ") : Array.from(str);
    const lines = [];
    let cur = "";
    for (const tk of tokens) {
      const test = cur ? (hasSpaces ? cur + " " + tk : cur + tk) : tk;
      if (c.measureText(test).width > maxWidth && cur) {
        lines.push(cur);
        cur = tk;
      } else {
        cur = test;
      }
    }
    if (cur) lines.push(cur);
    return lines;
  }

  /* =========================================================================
     10. ATMOSPHERIC PARTICLES (Drifting Petals & Passing Clouds)
     ========================================================================= */
  const petals = Array.from({ length: 28 }, () => ({
    x: Math.random() * 1400,
    y: Math.random() * 900,
    r: 2.8 + Math.random() * 3.2,
    vx: -0.35 - Math.random() * 0.5,
    vy: 0.4 + Math.random() * 0.55,
    rot: Math.random() * Math.PI * 2,
    vrot: (Math.random() - 0.5) * 0.04
  }));

  const clouds = [
    { x: 0.12, y: 0.14, s: 1.1, v: 0.00012 },
    { x: 0.55, y: 0.10, s: 0.85, v: 0.00009 },
    { x: 0.84, y: 0.19, s: 1.25, v: 0.00014 }
  ];

  function drawCloud(c, cx, cy, sc) {
    c.save();
    c.translate(cx, cy);
    c.scale(sc, sc);
    c.fillStyle = "rgba(255, 248, 236, 0.72)";
    c.beginPath();
    c.arc(0, 0, 26, 0, Math.PI * 2);
    c.arc(24, -6, 32, 0, Math.PI * 2);
    c.arc(54, 2, 24, 0, Math.PI * 2);
    c.arc(-24, 5, 18, 0, Math.PI * 2);
    c.fill();
    c.restore();
  }

  function drawPetalsOverlay(c) {
    c.save();
    for (const p of petals) {
      p.x += p.vx + Math.sin(state.time * 0.02 + p.y * 0.01) * 0.25;
      p.y += p.vy;
      p.rot += p.vrot;
      if (p.x < -20) p.x = W + 20;
      if (p.y > H + 20) { p.y = -15; p.x = Math.random() * W; }
      c.save();
      c.translate(p.x % (W + 40), p.y);
      c.rotate(p.rot);
      c.fillStyle = "rgba(244, 188, 192, 0.78)";
      c.beginPath();
      c.ellipse(0, 0, p.r * 1.35, p.r * 0.75, 0, 0, Math.PI * 2);
      c.fill();
      c.restore();
    }
    c.restore();
  }

  function drawSwayingLantern(c, x, y, time, scale = 1) {
    const ang = Math.sin(time * 0.028 + x * 0.02) * 0.09;
    c.save();
    c.translate(x, y);
    c.scale(scale, scale);
    c.rotate(ang);
    // Cord
    c.strokeStyle = "#2c221e";
    c.lineWidth = 1.8;
    c.beginPath();
    c.moveTo(0, 0);
    c.lineTo(0, 16);
    c.stroke();
    // Glow
    const glow = c.createRadialGradient(0, 28, 3, 0, 28, 34);
    glow.addColorStop(0, "rgba(255, 200, 110, 0.55)");
    glow.addColorStop(1, "rgba(255, 160, 70, 0)");
    c.fillStyle = glow;
    c.beginPath();
    c.arc(0, 28, 34, 0, Math.PI * 2);
    c.fill();
    // Body
    c.fillStyle = "#df5a3c";
    c.strokeStyle = "#2c221e";
    c.lineWidth = 1.8;
    c.beginPath();
    c.ellipse(0, 28, 10, 13, 0, 0, Math.PI * 2);
    c.fill();
    c.stroke();
    c.fillStyle = "#2c221e";
    c.fillRect(-6, 14, 12, 3);
    c.fillRect(-5, 40, 10, 2.5);
    c.restore();
  }

  /* =========================================================================
     11. SCENE RENDERERS (Scenes 1 -> 2 -> 3 -> 4 -> 5 -> 6)
     ========================================================================= */
  let hitZones = []; // Interactive clickable canvas regions per frame

  // --- SCENE 1: WELCOME TO MEOWBOX (Countryside + Distant Fortune Valley + Train) ---
  function renderTitleScene() {
    // Warm nostalgic dusk-apricot sky
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, "#d8a47f");
    sky.addColorStop(0.48, "#f3d5b0");
    sky.addColorStop(1, "#e8dec6");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    // Soft glowing sun
    ctx.fillStyle = "rgba(255, 244, 214, 0.72)";
    ctx.beginPath();
    ctx.arc(W * 0.5, H * 0.34, Math.min(W, H) * 0.13, 0, Math.PI * 2);
    ctx.fill();

    // Passing clouds
    clouds.forEach(cl => {
      cl.x = (cl.x + cl.v) % 1.25;
      drawCloud(ctx, (cl.x - 0.1) * W, cl.y * H, cl.s);
    });

    // Distant Fortune Valley Mountain & Torii Shrine Glimpse!
    const mx = W * 0.5, my = H * 0.56;
    ctx.fillStyle = "#7a8478";
    ctx.beginPath();
    ctx.moveTo(0, H * 0.68);
    ctx.quadraticCurveTo(W * 0.25, H * 0.48, mx, H * 0.36);
    ctx.quadraticCurveTo(W * 0.76, H * 0.49, W, H * 0.67);
    ctx.lineTo(W, H);
    ctx.lineTo(0, H);
    ctx.closePath();
    ctx.fill();

    // Tiny illuminated Fortune Valley lanterns & Torii silhouette on the distant peak
    ctx.strokeStyle = "#b8432e";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(mx - 12, H * 0.375); ctx.lineTo(mx - 12, H * 0.352);
    ctx.moveTo(mx + 12, H * 0.375); ctx.lineTo(mx + 12, H * 0.352);
    ctx.moveTo(mx - 17, H * 0.353); ctx.lineTo(mx + 17, H * 0.353);
    ctx.stroke();
    for (let i = 0; i < 6; i++) {
      const lx = mx - 24 + i * 9 + Math.sin(i * 2) * 5;
      const ly = H * 0.39 + i * 8;
      ctx.fillStyle = "rgba(255, 214, 120, 0.85)";
      ctx.beginPath();
      ctx.arc(lx, ly, 2.3, 0, Math.PI * 2);
      ctx.fill();
    }

    // Distant Viaduct & Chugging Little Train
    const vy = H * 0.63;
    ctx.fillStyle = "#565e53";
    ctx.fillRect(0, vy, W, 8);
    for (let ax = 20; ax < W; ax += 54) {
      ctx.fillRect(ax, vy, 10, H * 0.12);
    }
    const tx = ((state.time * 0.9) % (W + 240)) - 180;
    ctx.fillStyle = "#3c2f2b";
    ctx.fillRect(tx, vy - 14, 38, 13);
    ctx.fillRect(tx + 42, vy - 13, 36, 12);
    ctx.fillRect(tx + 82, vy - 13, 36, 12);
    // Warm lit train windows
    ctx.fillStyle = "#ffd984";
    for (let wx = tx + 6; wx < tx + 112; wx += 12) {
      ctx.fillRect(wx, vy - 10, 6, 5);
    }
    // Steam puffs
    for (let s = 0; s < 4; s++) {
      const sx = tx + 8 - s * 13 - (state.time * 0.3 % 12);
      const sy = vy - 20 - s * 5;
      ctx.fillStyle = `rgba(255,250,240,${0.55 - s * 0.12})`;
      ctx.beginPath();
      ctx.arc(sx, sy, 4 + s * 2.5, 0, Math.PI * 2);
      ctx.fill();
    }

    // Rolling countryside foreground hills & wooden eaves
    ctx.fillStyle = "#485948";
    ctx.beginPath();
    ctx.moveTo(0, H * 0.72);
    ctx.quadraticCurveTo(W * 0.35, H * 0.65, W * 0.7, H * 0.73);
    ctx.quadraticCurveTo(W * 0.88, H * 0.76, W, H * 0.71);
    ctx.lineTo(W, H);
    ctx.lineTo(0, H);
    ctx.closePath();
    ctx.fill();

    // Foreground rustic wooden beam & swaying lanterns
    ctx.fillStyle = "#362720";
    ctx.fillRect(0, 0, W, 12);
    drawSwayingLantern(ctx, W * 0.15, 10, state.time, 1.05);
    drawSwayingLantern(ctx, W * 0.84, 10, state.time + 20, 0.95);

    // Gradual Poetic Title Reveal
    const reveal = Math.min(1, state.time / 55);
    ctx.save();
    ctx.globalAlpha = reveal;
    ctx.textAlign = "center";
    ctx.fillStyle = "#2c221e";
    ctx.font = `bold ${Math.min(54, Math.max(36, W * 0.08))}px 'Georgia', serif`;
    ctx.fillText("MeowBox", W * 0.5, H * 0.25);

    ctx.font = `italic ${Math.min(19, Math.max(15, W * 0.035))}px 'Georgia', 'Songti SC', serif`;
    ctx.fillStyle = "#4a3830";
    ctx.fillText(TEXT.en.title_sub, W * 0.5, H * 0.25 + 34);
    ctx.fillText(TEXT.zh.title_sub, W * 0.5, H * 0.25 + 60);

    // Illustrated Brush-Stroke Action Slips (No generic web cards!)
    const btnY = H * 0.79;
    drawIllustratedSlipButton(ctx, W * 0.5, btnY, t("tap_begin"), true, "begin_new");

    if (state.hasSavedJourney) {
      drawIllustratedSlipButton(ctx, W * 0.5, btnY + 54, t("tap_continue") + ` (${state.savedSnapshot.playerName})`, false, "continue_save");
    }
    ctx.restore();

    drawPetalsOverlay(ctx);
  }

  function drawIllustratedSlipButton(c, cx, cy, label, primary, actionId) {
    c.save();
    c.font = "16px 'Georgia', 'Songti SC', serif";
    const tw = Math.max(200, c.measureText(label).width + 48);
    const th = 42;
    const x = cx - tw / 2, y = cy - th / 2;
    c.fillStyle = primary ? "rgba(248, 241, 227, 0.95)" : "rgba(44, 34, 30, 0.82)";
    c.strokeStyle = primary ? "#2c221e" : "#e8dec6";
    c.lineWidth = 2;
    c.beginPath();
    c.roundRect(x, y, tw, th, 21);
    c.fill();
    c.stroke();

    if (primary) {
      c.strokeStyle = "rgba(200, 75, 49, 0.55)";
      c.lineWidth = 1;
      c.beginPath();
      c.roundRect(x + 4, y + 4, tw - 8, th - 8, 17);
      c.stroke();
    }

    c.fillStyle = primary ? "#2c221e" : "#f8f1e3";
    c.textAlign = "center";
    c.textBaseline = "middle";
    c.fillText(label, cx, cy + 1);
    c.restore();

    hitZones.push({ x, y, w: tw, h: th, id: actionId });
  }

  // --- SCENE 2: STATION COUNTER (Handwritten Ticket & Earning the Passport) ---
  function renderCounterScene() {
    // Cozy warm station interior
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, "#3b2c24");
    bg.addColorStop(0.58, "#594235");
    bg.addColorStop(1, "#33241c");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // Station window showing twilight countryside behind Station Master
    const winW = Math.min(460, W * 0.82), winH = H * 0.34;
    const winX = (W - winW) / 2, winY = H * 0.11;
    ctx.fillStyle = "#d9a982";
    ctx.fillRect(winX, winY, winW, winH);
    drawCloud(ctx, winX + winW * 0.25, winY + winH * 0.35, 0.7);
    ctx.fillStyle = "#6e7a6d";
    ctx.beginPath();
    ctx.moveTo(winX, winY + winH);
    ctx.quadraticCurveTo(winX + winW * 0.5, winY + winH * 0.45, winX + winW, winY + winH);
    ctx.fill();
    // Wooden window mullions
    ctx.strokeStyle = "#2b1e17";
    ctx.lineWidth = 6;
    ctx.strokeRect(winX, winY, winW, winH);
    ctx.beginPath();
    ctx.moveTo(winX + winW / 3, winY); ctx.lineTo(winX + winW / 3, winY + winH);
    ctx.moveTo(winX + (winW * 2) / 3, winY); ctx.lineTo(winX + (winW * 2) / 3, winY + winH);
    ctx.stroke();

    drawSwayingLantern(ctx, Math.max(46, winX - 28), winY - 12, state.time, 0.9);
    drawSwayingLantern(ctx, Math.min(W - 46, winX + winW + 28), winY - 12, state.time + 15, 0.9);

    // Station Master standing behind counter
    const smY = winY + winH + 14;
    drawStationMaster(ctx, W * 0.5, smY, state.time);

    // Warm Polished Wooden Countertop
    const cy = H * 0.44;
    const wood = ctx.createLinearGradient(0, cy, 0, H);
    wood.addColorStop(0, "#8c5c3c");
    wood.addColorStop(0.12, "#73492e");
    wood.addColorStop(1, "#4a2e1d");
    ctx.fillStyle = wood;
    ctx.fillRect(0, cy, W, H - cy);
    ctx.strokeStyle = "#261810";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, cy); ctx.lineTo(W, cy);
    ctx.stroke();

    // Illustrated Paper Travel Ticket resting directly on the wooden counter!
    const tkW = Math.min(360, W * 0.88), tkH = 165;
    const tkX = (W - tkW) / 2, tkY = H * 0.53 - tkH / 2;
    ctx.save();
    ctx.fillStyle = "#f7eedb";
    ctx.strokeStyle = "#2c221e";
    ctx.lineWidth = 2.2;
    ctx.shadowColor = "rgba(0,0,0,0.32)";
    ctx.shadowBlur = 16;
    ctx.shadowOffsetY = 6;
    ctx.beginPath();
    ctx.roundRect(tkX, tkY, tkW, tkH, 8);
    ctx.fill();
    ctx.shadowColor = "transparent";
    ctx.stroke();

    // Vintage railway border & stub perforation
    ctx.strokeStyle = "#b88446";
    ctx.lineWidth = 1.2;
    ctx.strokeRect(tkX + 7, tkY + 7, tkW - 14, tkH - 14);
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(tkX + tkW - 74, tkY + 8);
    ctx.lineTo(tkX + tkW - 74, tkY + tkH - 8);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = "#5c4b43";
    ctx.font = "bold 11px 'Georgia', serif";
    ctx.textAlign = "left";
    ctx.fillText("MEOWBOX RAILWAY · ONE-WAY ESCAPE", tkX + 18, tkY + 26);
    ctx.fillStyle = "#2c221e";
    ctx.font = "14px 'Georgia', 'Songti SC', serif";
    ctx.fillText("➔  FORTUNE VALLEY · 解忧谷", tkX + 18, tkY + 48);

    ctx.font = "11px 'Georgia', serif";
    ctx.fillStyle = "#7a665c";
    ctx.fillText("PASSENGER / 旅客姓名:", tkX + 18, tkY + 74);

    // If already signed, render handwritten ink name & optional red stamp
    if (state.subStep >= 1) {
      ctx.font = "italic 24px 'Georgia', 'Kaiti SC', serif";
      ctx.fillStyle = "#2b1e19";
      ctx.textAlign = "center";
      ctx.fillText(state.playerName, tkX + (tkW - 74) / 2 + 8, tkY + 108);
    }

    // Stub number
    ctx.save();
    ctx.translate(tkX + tkW - 36, tkY + tkH / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.font = "bold 12px monospace";
    ctx.fillStyle = "#8a4b38";
    ctx.textAlign = "center";
    ctx.fillText("NO. 0409", 0, 4);
    ctx.restore();
    ctx.restore();

    // Step 1: Station Master physically slides the Leather Passport onto the counter!
    if (state.subStep === 1 && !state.hasPassport) {
      const px = W * 0.5, py = tkY + tkH + 62 + Math.sin(state.time * 0.08) * 3;

      ctx.strokeStyle = "#241612";

    // Speech Bubble from Station Master

      : (!state.hasPassport ? t("give_passport") : t("passport_taken"));
    drawSpeechBubble(ctx, W * 0.5, smY - 68, smMsg, Math.min(390, W - 28));

  // --- SCENE 3: WOODEN STATION PLATFORM (In-Scene Character Selection & Picking up the Bag!) ---
  function renderPlatformScene() {
    const sky = ctx.createLinearGradient(0, 0, 0, H * 0.65);
    sky.addColorStop(0, "#4a435c");
    sky.addColorStop(0.55, "#b37c68");
    sky.addColorStop(1, "#e6be94");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    // Distant twilight mountain
    ctx.fillStyle = "#4d5659";
    ctx.beginPath();
    ctx.moveTo(0, H * 0.62);
    ctx.quadraticCurveTo(W * 0.45, H * 0.38, W, H * 0.58);
    ctx.lineTo(W, H);
    ctx.lineTo(0, H);
    ctx.fill();

    // Waiting Vintage Country Train in background behind platform
    const railY = H * 0.57;
    ctx.fillStyle = "#2b3d34";
    ctx.strokeStyle = "#1c1614";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.roundRect(W * 0.08, railY - 96, W * 0.84, 92, 12);
    ctx.fill();
    ctx.stroke();
    // Cream stripe & warm windows
    ctx.fillStyle = "#e8dcc4";
    ctx.fillRect(W * 0.08 + 3, railY - 46, W * 0.84 - 6, 16);
    for (let wx = W * 0.14; wx < W * 0.86; wx += 68) {
      ctx.fillStyle = "#ffdf96";
      ctx.strokeStyle = "#1c1614";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(wx, railY - 82, 44, 28, 5);
      ctx.fill();
      ctx.stroke();
    }

    // Wooden Platform Floor
    const platY = H * 0.56;
    ctx.fillStyle = "#8a6648";
    ctx.fillRect(0, platY, W, H - platY);
    ctx.strokeStyle = "#5c402b";
    ctx.lineWidth = 1.5;
    for (let py = platY + 22; py < H; py += 28) {
      ctx.beginPath();
      ctx.moveTo(0, py); ctx.lineTo(W, py);
      ctx.stroke();
    }
    // Safety yellow line
    ctx.fillStyle = "#d9a74a";
    ctx.fillRect(0, platY + 8, W, 5);

    // Wooden Platform Canopy Pillars & Lanterns
    ctx.fillStyle = "#3a271d";
    ctx.fillRect(0, 0, W, 16);
    ctx.fillRect(W * 0.12, 16, 14, platY - 16);
    ctx.fillRect(W * 0.86, 16, 14, platY - 16);
    drawSwayingLantern(ctx, W * 0.25, 14, state.time, 0.95);
    drawSwayingLantern(ctx, W * 0.75, 14, state.time + 12, 0.95);

    // Wooden Station Bench in the middle
    const bx = W * 0.5 - 85, by = platY + 34;
    ctx.fillStyle = "#69452c";
    ctx.strokeStyle = "#261810";
    ctx.lineWidth = 2;
    ctx.fillRect(bx, by, 170, 12);
    ctx.strokeRect(bx, by, 170, 12);
    ctx.fillRect(bx, by + 18, 170, 10);
    ctx.strokeRect(bx, by + 18, 170, 10);
    ctx.fillRect(bx + 14, by + 12, 8, 26);
    ctx.fillRect(bx + 148, by + 12, 8, 26);

    // Prompt Banner integrated gently in sky
    ctx.fillStyle = "#fff9ed";
    ctx.font = "bold 17px 'Georgia', 'Songti SC', serif";
    ctx.textAlign = "center";
    ctx.fillText(t("choose_prompt"), W * 0.5, H * 0.12);

    // All 4 Cats Standing Naturally in the Platform Scene (Responsive spacing!)
    const span = Math.min(W * 0.82, 540);
    const startX = W * 0.5 - span / 2;
    const catYBase = platY + 86;

    CATS.forEach((cat, idx) => {
      const cx = startX + (span / 3) * idx;
      const cy = catYBase + (idx === 1 || idx === 2 ? -12 : 4);
      const isSelected = state.catIndex === idx;
      if (state.catBounce[idx] > 0) state.catBounce[idx]--;

      // Subtle warm spotlight under chosen cat (No boxy UI!)
      if (isSelected) {
        const g = ctx.createRadialGradient(cx, cy - 12, 4, cx, cy - 12, 48);
        g.addColorStop(0, "rgba(255, 232, 165, 0.55)");
        g.addColorStop(1, "rgba(255, 232, 165, 0)");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.ellipse(cx, cy - 8, 44, 24, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      const animMode = state.catBounce[idx] > 0 ? "happy" : "idle";
      drawCat(ctx, cx, cy, idx, "down", animMode, state.time + idx * 19, isSelected ? 1.24 : 1.02, isSelected && state.hasBag, state.catBounce[idx] > 0 ? "happy" : "normal");

      // Handwritten label directly beneath paws
      ctx.textAlign = "center";
      ctx.fillStyle = isSelected ? "#fff8e8" : "rgba(248, 241, 227, 0.78)";
      ctx.font = `${isSelected ? "bold " : ""}14px 'Georgia', 'Songti SC', serif`;
      ctx.fillText(`${cat.nameEn} · ${cat.nameZh}`, cx, cy + 22);
      if (isSelected) {
        ctx.font = "italic 12px 'Georgia', 'Songti SC', serif";
        ctx.fillStyle = "#ffe29a";
        ctx.fillText(state.lang === "zh" ? cat.tagZh : cat.tagEn, cx, cy + 40);
      }

      hitZones.push({ x: cx - 42, y: cy - 64, w: 84, h: 105, id: `select_cat_${idx}` });
    });

    // Woven Traveller's Bag sitting on the platform by the bench until picked up!
    if (!state.hasBag) {
      const bagX = Math.min(W - 56, W * 0.5 + span / 2 + 34);
      const bagY = platY + 46 + Math.sin(state.time * 0.1) * 2.5;
      ctx.save();
      ctx.translate(bagX, bagY);
      ctx.fillStyle = "#d9a962";
      ctx.strokeStyle = "#261d19";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(-16, -12, 32, 24, 6);
      ctx.fill();
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(0, -12, 9, Math.PI, 0);
      ctx.stroke();
      ctx.fillStyle = "#c84b31";
      ctx.beginPath();
      ctx.arc(0, -1, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      hitZones.push({ x: bagX - 32, y: bagY - 32, w: 64, h: 64, id: "pickup_bag" });
    }

    // Active cat funny reaction speech bubble
    if (state.speech) {
      const chosenX = startX + (span / 3) * state.catIndex;
      const chosenY = catYBase - 58;
      drawSpeechBubble(ctx, chosenX, chosenY, state.speech.text, 260);
    }

    // Action button at bottom: either hint to grab bag or board the train!
    const selCat = CATS[state.catIndex];
    const catTitle = state.lang === "zh" ? selCat.nameZh : selCat.nameEn;
    if (!state.hasBag) {
      drawIllustratedSlipButton(ctx, W * 0.5, H * 0.87, t("take_bag_hint"), false, "pickup_bag");
    } else {
      drawIllustratedSlipButton(ctx, W * 0.5, H * 0.87, `${t("pick_cat_btn")}${catTitle} 🚂`, true, "board_train");
    }
  }

  // --- SCENE 4: TICKET STAMP & ANIMATED TRAIN JOURNEY ---
  function renderTrainScene() {
    state.trainT++;

    // Phase A (0..105): Close-up Ticket Receiving Red Fortune Valley Stamp!
    if (state.trainT < 110) {
      ctx.fillStyle = "#3a281e";
      ctx.fillRect(0, 0, W, H);

      const tkW = Math.min(350, W * 0.86), tkH = 160;
      const tkX = (W - tkW) / 2, tkY = (H - tkH) / 2;
      ctx.fillStyle = "#f7eedb";
      ctx.strokeStyle = "#2c221e";
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.roundRect(tkX, tkY, tkW, tkH, 8);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#2c221e";
      ctx.font = "14px 'Georgia', 'Songti SC', serif";
      ctx.textAlign = "left";
      ctx.fillText("➔  FORTUNE VALLEY · 解忧谷", tkX + 20, tkY + 46);
      ctx.font = "italic 24px 'Georgia', 'Kaiti SC', serif";
      ctx.fillText(state.playerName, tkX + 24, tkY + 98);

      if (state.trainT === 28) sound.sfxStamp();
      if (state.trainT >= 28) {
        const sScale = state.trainT < 38 ? 1.5 - (state.trainT - 28) * 0.05 : 1;
        ctx.save();
        ctx.translate(tkX + tkW - 95, tkY + 86);
        ctx.scale(sScale, sScale);
        ctx.rotate(-0.18);
        ctx.strokeStyle = "rgba(200, 58, 42, 0.88)";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, 36, 0, Math.PI * 2);
        ctx.stroke();
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.arc(0, 0, 31, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = "rgba(200, 58, 42, 0.88)";
        ctx.font = "bold 12px 'Georgia', 'Songti SC', serif";
        ctx.textAlign = "center";
        ctx.fillText("解忧谷", 0, -4);
        ctx.font = "bold 9px 'Georgia', serif";
        ctx.fillText("APPROVED", 0, 11);
        ctx.restore();
      }

      ctx.fillStyle = "#f6efe2";
      ctx.font = "16px 'Georgia', 'Songti SC', serif";
      ctx.textAlign = "center";
      ctx.fillText(t("stamp_ticket_msg"), W * 0.5, tkY - 32);
      return;
    }

    // Phase B (110..290): Inside Cozy Wooden Train Carriage Looking Out at Passing Cedar Forest & Lantern Mountain
    const progress = (state.trainT - 110) / 180;
    const bounce = Math.sin(state.trainT * 0.45) * 1.6;

    // Passing Night-Twilight Scenery outside the carriage window
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, "#1f2940");
    sky.addColorStop(0.6, "#434c6b");
    sky.addColorStop(1, "#2a332d");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    // Moon & stars outside
    ctx.fillStyle = "#fff4cf";
    ctx.beginPath();
    ctx.arc(W * 0.72 - progress * 40, H * 0.24, 24, 0, Math.PI * 2);
    ctx.fill();

    // Parallax mountain & cedar silhouettes scrolling past
    for (let i = 0; i < 14; i++) {
      const treeX = ((i * 110 - (state.trainT * 4.5)) % (W + 220) + (W + 220)) % (W + 220) - 110;
      ctx.fillStyle = "#1a2421";
      ctx.beginPath();
      ctx.moveTo(treeX, H * 0.62);
      ctx.lineTo(treeX + 26, H * 0.36 + (i % 3) * 18);
      ctx.lineTo(treeX + 52, H * 0.62);
      ctx.fill();
    }

    // Wooden Train Carriage Interior Frame (Window + Seat + Chosen Cat gazing outside!)
    ctx.save();
    ctx.translate(0, bounce);
    ctx.fillStyle = "#4a3122";
    const winW = Math.min(480, W * 0.8), winH = H * 0.42;
    const winX = (W - winW) / 2, winY = H * 0.16;
    // Frame around window
    ctx.fillRect(0, 0, W, winY);
    ctx.fillRect(0, winY + winH, W, H - (winY + winH));
    ctx.fillRect(0, winY, winX, winH);
    ctx.fillRect(winX + winW, winY, W - (winX + winW), winH);
    ctx.strokeStyle = "#261710";
    ctx.lineWidth = 6;
    ctx.strokeRect(winX, winY, winW, winH);

    // Plush green velvet train bench
    ctx.fillStyle = "#3c5e4b";
    ctx.strokeStyle = "#1f1612";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.roundRect(winX + 20, winY + winH + 16, winW - 40, 56, 10);
    ctx.fill();
    ctx.stroke();

    // Chosen cat sitting on the train seat looking out toward Fortune Valley!
    drawCat(ctx, W * 0.5, winY + winH + 46, state.catIndex, "up", "idle", state.time, 1.35, state.hasBag);

    ctx.fillStyle = "#f6efe2";
    ctx.font = "italic 16px 'Georgia', 'Songti SC', serif";
    ctx.textAlign = "center";
    ctx.fillText(t("train_caption"), W * 0.5, H * 0.86);
    ctx.restore();

    if (state.trainT >= 285) {
      enterShrineArrival();
    }
  }

  // --- SCENE 5 & 6: CONTINUOUS SHRINE ENTRANCE + FORTUNE VALLEY MAIN MAP ---
  // Unified world space (800 x 2120) with smooth camera following the player uphill!
  function renderWorldScene() {
    updateWorldPhysics();

    // Map scale to fit mobile smoothly and pan naturally, or fill desktop cleanly
    const worldW = 800;
    const scale = Math.min(W / worldW, Math.max(0.72, H / 720));
    const viewW = W / scale;
    const viewH = H / scale;

    // Smooth camera lerp following player
    const desiredCamY = state.py - viewH * 0.6;
    const minCamY = 0;
    const maxCamY = Math.max(0, 2120 - viewH);
    state.camY += (Math.max(minCamY, Math.min(maxCamY, desiredCamY)) - state.camY) * 0.09;

     12. WORLD PHYSICS, KEYBOARD & CONTINUOUS GATE -> VALLEY TRANSITION

  const keys = {};
  window.addEventListener("keydown", e => {
    keys[e.key] = true;
    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key) && state.scene === "platform") {
      sound.init();
      if (e.key === "ArrowLeft") selectPlatformCat((state.catIndex + 3) % 4);
      if (e.key === "ArrowRight") selectPlatformCat((state.catIndex + 1) % 4);
    }
  });
  window.addEventListener("keyup", e => { keys[e.key] = false; });

  function updateWorldPhysics() {
    // Shrine Keeper Entrance Sequence
    if (state.scene === "gate") {
      if (state.keeperState === "approaching") {
        state.keeperY += 1.6;
        if (state.keeperY >= 1905) {
          state.keeperState = "chatting";
          const greet = (state.returning ? (state.lang === "zh" ? "回来啦，{name}！今天也来躲个清静？" : "Welcome back, {name}. Escaping another meeting?") : t("keeper_greet")).replace("{name}", state.playerName || t("default_name"));
          state.speech = { wx: 400, wy: state.keeperY - 52, text: greet };
          showShrineKeeperChoices();
        }
      } else if (state.keeperState === "opening") {
        state.gateOpenProgress = Math.min(1, state.gateOpenProgress + 0.028);
        if (state.gateOpenProgress >= 1) {
          state.keeperState = "aside";
          // Auto walk gently through the open gate into Fortune Valley!
          state.targetX = 400;
          state.targetY = 1660;
        }
      }
    }

    // Keyboard movement in Gate/Valley
    const canMove = (state.scene === "valley") || (state.scene === "gate" && state.gateOpenProgress >= 1);
    if (canMove && !bookOverlayOpen() && wishInputWrap.style.display !== "flex") {
      let vx = 0, vy = 0;
      if (keys["ArrowUp"] || keys["w"] || keys["W"]) vy -= 1;
      if (keys["ArrowDown"] || keys["s"] || keys["S"]) vy += 1;
      if (keys["ArrowLeft"] || keys["a"] || keys["A"]) vx -= 1;
      if (keys["ArrowRight"] || keys["d"] || keys["D"]) vx += 1;

      if (vx !== 0 || vy !== 0) {
        state.targetX = null;
        state.targetY = null;
        const len = Math.hypot(vx, vy);
        movePlayerBy((vx / len) * 3.4, (vy / len) * 3.4);
      } else if (state.targetX !== null && state.targetY !== null) {
        const dx = state.targetX - state.px;
        const dy = state.targetY - state.py;
        const dist = Math.hypot(dx, dy);
        if (dist < 5) {
          state.moving = false;
          state.targetX = null;
          state.targetY = null;
          if (state.pendingEnterBuilding) {
            const b = state.pendingEnterBuilding;
            state.pendingEnterBuilding = null;
            openBuildingActivity(b);
          }
        } else {
          movePlayerBy((dx / dist) * 3.5, (dy / dist) * 3.5);
        }
      } else {
        state.moving = false;
      }
    } else {
      state.moving = false;
    }

    // Seamless transition from Gate into Fortune Valley Main Map!
    if (state.scene === "gate" && state.py < 1725) {
      state.scene = "valley";
      state.speech = null;
      updateHUD();
      saveGame();
    }

    // Check proximity to building doors
    state.nearBuilding = null;
    if (state.scene === "valley") {
      for (const b of BUILDINGS) {
        if (Math.hypot(state.px - b.x, state.py - (b.y + 26)) < 68) {
          state.nearBuilding = b;
          break;
        }
      }
    }
  }

  function movePlayerBy(dx, dy) {
    let nx = Math.max(120, Math.min(680, state.px + dx));
    let ny = Math.max(195, Math.min(2060, state.py + dy));
    // Block gate if closed
    if (state.gateOpenProgress < 0.95 && ny < 1785) ny = 1785;
    state.px = nx;
    state.py = ny;
    state.moving = true;
    state.walkFrame++;
    if (state.walkFrame % 16 === 0) sound.sfxStep();

    if (Math.abs(dx) > Math.abs(dy)) {
      state.dir = dx < 0 ? "left" : "right";
    } else {
      state.dir = dy < 0 ? "up" : "down";
    }
  }

  function startNewJourney() {
    sound.init();
    sound.sfxChime();
    state.returning = false;
    state.scene = "counter";
    state.subStep = 0;
    state.hasPassport = false;
    state.hasBag = false;
    state.stamps = ["stamp_arrival"];
    state.bagItems = [];
    state.speech = null;
    ticketInputWrap.style.display = "flex";
    ticketNameInput.value = "";
    setTimeout(() => ticketNameInput.focus(), 120);
    updateHUD();
  }

  function continueSavedJourney() {
    const s = state.savedSnapshot;
    if (!s) return startNewJourney();

  // Touch Swipe & Tap Handling on Canvas
  let pointerStart = null;
  canvas.addEventListener("pointerdown", e => {
    sound.init();
    pointerStart = { x: e.clientX, y: e.clientY };
  });

  canvas.addEventListener("pointerup", e => {
    if (bookOverlayOpen()) return;
    const dx = pointerStart ? e.clientX - pointerStart.x : 0;
    if (state.scene === "platform" && Math.abs(dx) > 45) {
      selectPlatformCat((state.catIndex + (dx < 0 ? 1 : 3)) % 4);
      pointerStart = null;
      return;
    }
    handleCanvasTap(e.clientX, e.clientY);
    pointerStart = null;
  });

  function handleCanvasTap(cx, cy) {
    // Check registered interactive hit zones (top-most first)
    for (let i = hitZones.length - 1; i >= 0; i--) {
      const z = hitZones[i];
      if (cx >= z.x && cx <= z.x + z.w && cy >= z.y && cy <= z.y + z.h) {
        triggerZone(z);
        return;
      }
    }

    // Free exploration tap-to-walk in Shrine Entrance / Fortune Valley
    if ((state.scene === "valley") || (state.scene === "gate" && state.gateOpenProgress >= 1)) {
      const worldW = 800;
      const scale = Math.min(W / worldW, Math.max(0.72, H / 720));
      const viewW = W / scale;
      const camX = (worldW - viewW) / 2;
      const wx = cx / scale + camX;
      const wy = cy / scale + state.camY;
      state.pendingEnterBuilding = null;
      state.targetX = Math.max(125, Math.min(675, wx));
      state.targetY = Math.max(200, Math.min(2050, wy));
    }
  }

  function triggerZone(z) {
    if (z.id === "begin_new") {
      startNewJourney();
    } else if (z.id === "continue_save") {
      continueSavedJourney();
    } else if (z.id === "pickup_passport") {
      state.hasPassport = true;
      sound.sfxChime();
      updateHUD();
      setTimeout(() => {
        state.scene = "platform";
        selectPlatformCat(0);
        updateHUD();
      }, 950);
    } else if (z.id.startsWith("select_cat_")) {
      const idx = parseInt(z.id.split("_")[2], 10);
      selectPlatformCat(idx);
    } else if (z.id === "pickup_bag") {
      state.hasBag = true;
      addBagItem("ticket_item", "Stamped Valley Ticket", "解忧谷车票", "One-way ticket signed in ink.", "亲笔签名的单程逃离车票。", "🎫");
      updateHUD();
    } else if (z.id === "board_train") {
      sound.sfxChime();
      state.scene = "train";
      state.trainT = 0;
      state.speech = null;
      updateHUD();
    } else if (z.id.startsWith("enter_")) {
      const bid = z.id.replace("enter_", "");
      const b = BUILDINGS.find(it => it.id === bid);
      if (b) openBuildingActivity(b);
    } else if (z.id.startsWith("walk_to_")) {
      const b = z.b;
      if (Math.hypot(state.px - b.x, state.py - (b.y + 26)) < 75) {
        openBuildingActivity(b);
      } else {
        state.targetX = b.x;
        state.targetY = b.y + 32;
        state.pendingEnterBuilding = b;
      }
    }
  }

  // --- 1. TAROT HOUSE: AUTHENTIC 22 MAJOR ARCANA & ILLUSTRATED CARD CANVAS ---
  function renderTarotHouse() {
    let topic = "general";
    let spreadMode = 3; // 3-card Past/Present/Future or 1-card Daily
    let drawn = [];

    const topics = [
      { id: "love", en: "Love & Heart", zh: "感情姻缘" },
      { id: "career", en: "Career & Craft", zh: "事业前程" },
      { id: "money", en: "Wealth & Flow", zh: "财运丰盛" },
      { id: "general", en: "General Path", zh: "综合指引" }
    ];

    function drawTarotUI() {
      storybookContent.innerHTML = `
        <button class="sheet-close" id="closeSheetBtn">✕</button>
        <h2 class="storybook-title">${state.lang === "zh" ? "塔罗小屋 · Tarot House" : "Tarot House · 塔罗小屋"}</h2>
        <p class="storybook-sub">${state.lang === "zh" ? "22张大阿卡纳正逆位真实牌义 · 烛光天鹅绒占卜桌" : "Authentic 22 Major Arcana with Upright & Reversed interpretations."}</p>
        <div>
          ${topics.map(tp => `<button class="ink-btn ${topic === tp.id ? "active" : ""}" data-topic="${tp.id}">${state.lang === "zh" ? tp.zh : tp.en}</button>`).join("")}
        </div>
        <div style="margin-top:6px;">
          <button class="ink-btn ${spreadMode === 1 ? "active" : ""}" id="mode1Btn">${state.lang === "zh" ? "单张每日指引" : "Single Card Draw"}</button>
          <button class="ink-btn ${spreadMode === 3 ? "active" : ""}" id="mode3Btn">${state.lang === "zh" ? "三张牌阵（过去 · 现在 · 未来）" : "3-Card Spread (Past · Present · Future)"}</button>
          <button class="ink-btn active" id="shuffleDrawBtn">✦ ${state.lang === "zh" ? "洗牌抽牌" : "Shuffle & Draw"}</button>
        </div>
        <div class="tarot-table">
          <div style="text-align:center;font-size:13px;color:#e6cfa3;">
            ${drawn.length === 0
              ? (state.lang === "zh" ? "静下心默念你的问题，点击「洗牌抽牌」后翻开牌面" : "Hold your question quietly in mind, then Shuffle & tap each card to reveal.")
              : (state.lang === "zh" ? "轻触背面塔罗牌翻开命运牌面" : "Tap each face-down card on the velvet cloth to turn it over.")}
          </div>
          <div class="tarot-cards-row" id="tarotCardsMount"></div>
          <div id="tarotReadingText" style="margin-top:12px;font-size:13.5px;line-height:1.65;color:#f6efe2;"></div>
        </div>
      `;
      bookOverlay.style.display = "flex";
      document.getElementById("closeSheetBtn").onclick = closeBookOverlay;

      storybookContent.querySelectorAll("[data-topic]").forEach(b => {
        b.onclick = () => { topic = b.getAttribute("data-topic"); drawTarotUI(); };
      });
      document.getElementById("mode1Btn").onclick = () => { spreadMode = 1; drawn = []; drawTarotUI(); };
      document.getElementById("mode3Btn").onclick = () => { spreadMode = 3; drawn = []; drawTarotUI(); };
      document.getElementById("shuffleDrawBtn").onclick = () => {
        sound.sfxRattle();
        const pool = [...MAJOR_ARCANA].sort(() => Math.random() - 0.5);
        drawn = pool.slice(0, spreadMode).map(card => ({
          card,
          reversed: Math.random() < 0.34,
          flipped: false
        }));
        if (topic === "love") unlockStamp("stamp_tarot_love", "Heart Arcana", "恋语塔罗章");
        drawTarotUI();
      };

      const mount = document.getElementById("tarotCardsMount");
      const posLabels = spreadMode === 3
        ? (state.lang === "zh" ? ["过去 · Past", "现在 · Present", "未来 · Future"] : ["Past", "Present", "Future"])
        : [state.lang === "zh" ? "当下指引 · Guidance" : "Present Guidance"];

      drawn.forEach((slot, idx) => {
        const wrap = document.createElement("div");
        wrap.className = "tarot-slot";
        const lbl = document.createElement("div");
        lbl.style.cssText = "font-size:11px;color:#d49b38;margin-bottom:6px;";
        lbl.textContent = posLabels[idx];
        const cv = document.createElement("canvas");
        cv.width = 220;
        cv.height = 350;
        cv.className = "tarot-card-canvas";
        paintTarotCard(cv, slot);
        cv.onclick = () => {
          if (!slot.flipped) {
            slot.flipped = true;
            sound.sfxChime();
            paintTarotCard(cv, slot);
            addBagItem(
              `tarot_${slot.card.num}`,
              `Tarot: ${slot.card.num} ${slot.card.en}`,
              `塔罗纪念牌：${slot.card.num} ${slot.card.zh}`,
              slot.reversed ? slot.card.revEn : slot.card.upEn,
              slot.reversed ? slot.card.revZh : slot.card.upZh,
              "🃏"
            );
            updateReadingBox();
          }
        };
        wrap.appendChild(lbl);
        wrap.appendChild(cv);
        mount.appendChild(wrap);
      });
      updateReadingBox();
    }

    function updateReadingBox() {
      const box = document.getElementById("tarotReadingText");
      if (!box) return;
      const revealed = drawn.filter(d => d.flipped);
      if (revealed.length === 0) { box.innerHTML = ""; return; }
      const topicHint = {
        love: state.lang === "zh" ? "【感情视角】" : "[In Love] ",
        career: state.lang === "zh" ? "【事业视角】" : "[In Career] ",
        money: state.lang === "zh" ? "【财运视角】" : "[In Finances] ",
        general: state.lang === "zh" ? "【生活指引】" : "[Life Path] "
      }[topic];
      const posNames = spreadMode === 3
        ? (state.lang === "zh" ? ["过去", "现在", "未来"] : ["Past", "Present", "Future"])
        : [state.lang === "zh" ? "核心牌意" : "Key Message"];

      box.innerHTML = drawn.map((d, idx) => {
        if (!d.flipped) return "";
        const ori = d.reversed
          ? (state.lang === "zh" ? "逆位 Reversed" : "Reversed")
          : (state.lang === "zh" ? "正位 Upright" : "Upright");
        const meaning = d.reversed
          ? (state.lang === "zh" ? d.card.revZh : d.card.revEn)
          : (state.lang === "zh" ? d.card.upZh : d.card.upEn);
        const title = state.lang === "zh" ? `${d.card.num} · ${d.card.zh} (${d.card.en})` : `${d.card.num} · ${d.card.en}`;
        return `<div style="margin-bottom:10px;padding:10px 12px;background:rgba(255,248,232,0.08);border-left:3px solid #d49b38;border-radius:6px;">
          <div style="color:#f5cf7a;font-weight:bold;">${posNames[idx]} — ${title} [${ori}]</div>
          <div style="margin-top:4px;">${idx === revealed.length - 1 ? topicHint : ""}${meaning}</div>
        </div>`;
      }).join("");
    }

    drawTarotUI();
  }

  function paintTarotCard(cv, slot) {
    const c = cv.getContext("2d");
    c.clearRect(0, 0, 220, 350);
    if (!slot.flipped) {
      // Ornate Celestial Card Back
      c.fillStyle = "#221b33";
      c.strokeStyle = "#d49b38";
      c.lineWidth = 5;
      c.beginPath();
      c.roundRect(4, 4, 212, 342, 14);
      c.fill();
      c.stroke();
      c.lineWidth = 1.6;
      c.strokeRect(16, 16, 188, 318);
      // Mystic sun-moon mandala
      c.translate(110, 175);
      c.beginPath();
      c.arc(0, 0, 48, 0, Math.PI * 2);
      c.stroke();
      for (let i = 0; i < 8; i++) {
        c.rotate(Math.PI / 4);
        c.beginPath();
        c.moveTo(0, -52); c.lineTo(0, -68);
        c.stroke();
      }
      c.fillStyle = "#d49b38";
      c.beginPath();
      c.arc(0, 0, 12, 0, Math.PI * 2);
      c.fill();
      return;
    }

    // Authentic Illustrated Tarot Face (Rider-Waite parchment aesthetic + Cat Arcana symbolism)
    c.save();
    c.fillStyle = "#f7eedb";
    c.strokeStyle = "#2c221e";
    c.lineWidth = 5;
    c.beginPath();
    c.roundRect(4, 4, 212, 342, 14);
    c.fill();
    c.stroke();

    c.strokeStyle = "#b88446";
    c.lineWidth = 2;
    c.strokeRect(14, 14, 192, 322);

    // Rotate artwork region if Reversed!
    c.save();
    c.translate(110, 172);
    if (slot.reversed) c.rotate(Math.PI);

    // Sky backdrop inside card frame
    const artGrad = c.createLinearGradient(0, -110, 0, 110);
    artGrad.addColorStop(0, "#323e5e");
    artGrad.addColorStop(1, "#e6c594");
    c.fillStyle = artGrad;
    c.fillRect(-80, -112, 160, 214);
    c.strokeStyle = "#2c221e";
    c.lineWidth = 2;
    c.strokeRect(-80, -112, 160, 214);

    // Arcana Emblem Symbolism
    c.fillStyle = "#f7d57e";
    c.strokeStyle = "#f7d57e";
    c.lineWidth = 2.2;
    const m = slot.card.motif;
    if (m === "sun") {
      c.beginPath(); c.arc(0, -64, 24, 0, Math.PI * 2); c.fill();
    } else if (m === "moon") {
      c.beginPath(); c.arc(-4, -64, 20, 0.4, Math.PI * 1.7); c.fill();
    } else if (m === "star") {
      [-36, 0, 36].forEach((sx, i) => {
        c.beginPath(); c.arc(sx, -68 + (i === 1 ? -10 : 6), i === 1 ? 9 : 5, 0, Math.PI * 2); c.fill();
      });
    } else if (m === "wheel" || m === "wreath") {
      c.beginPath(); c.arc(0, -60, 24, 0, Math.PI * 2); c.stroke();
      c.beginPath(); c.moveTo(-24, -60); c.lineTo(24, -60); c.moveTo(0, -84); c.lineTo(0, -36); c.stroke();
    } else if (m === "lightning") {
      c.beginPath(); c.moveTo(10, -98); c.lineTo(-12, -64); c.lineTo(6, -64); c.lineTo(-14, -32); c.stroke();
    } else if (m === "scales") {
      c.beginPath(); c.moveTo(-28, -68); c.lineTo(28, -68); c.moveTo(0, -86); c.lineTo(0, -50); c.stroke();
    } else {
      c.beginPath(); c.arc(0, -68, 16, 0, Math.PI * 2); c.stroke();
    }

    // Illustrated Cat Figure embodying the Arcana
    const catIdx = slot.card.num.length % 4;
    drawCat(c, 0, 62, catIdx, "down", "idle", 12, 1.35, m === "cliff");
    c.restore();

    // Roman Numeral at Top & Authentic Arcana Title at Bottom
    c.fillStyle = "#2c221e";
    c.font = "bold 15px 'Georgia', serif";
    c.textAlign = "center";
    c.fillText(slot.card.num, 110, 42);

    c.fillStyle = "#f7eedb";
    c.fillRect(22, 294, 176, 36);
    c.fillStyle = "#2c221e";
    c.font = "bold 14px 'Georgia', 'Songti SC', serif";
    c.fillText(state.lang === "zh" ? `${slot.card.zh} · ${slot.card.en}` : slot.card.en, 110, 315);
    if (slot.reversed) {
      c.fillStyle = "#c84b31";
      c.font = "11px 'Georgia', serif";
      c.fillText(state.lang === "zh" ? "（逆位）" : "(Reversed)", 110, 331);
    }
    c.restore();
  }

        </div>

          <span>03 · STARLIGHT HARBOR 星光港湾</span><span>◌ TRACK MISTED 筹备中</span>
        </div>
      </div>
      <p style="font-size:13px;color:#5c4b43;margin-top:12px;">
        ${state.lang === "zh"
          ? "站长猫咪打了个哈欠：「远方的铁轨还在修缮呢，先在解忧谷安心待一阵子吧。」"
          : "The ridge porter yawns: \"Tracks beyond the clouds are still being laid. Enjoy Fortune Valley first—your Passport will carry over when the whistle blows.\""}
      </p>
    `;
    bookOverlay.style.display = "flex";
    document.getElementById("closeSheetBtn").onclick = closeBookOverlay;
  }

  /* =========================================================================
     16. MAIN ANIMATION LOOP
     ========================================================================= */
  function loop() {
    state.time++;
    hitZones = [];

    if (state.scene === "title") renderTitleScene();
    else if (state.scene === "counter") renderCounterScene();
    else if (state.scene === "platform") renderPlatformScene();
    else if (state.scene === "train") renderTrainScene();
    else renderWorldScene();

    // Gentle floating stamp/keepsake toast notification
    if (floatingToast) {
      floatingToast.timer--;
      if (floatingToast.timer < 35) floatingToast.alpha = floatingToast.timer / 35;
      ctx.save();
      ctx.globalAlpha = Math.max(0, floatingToast.alpha);
      ctx.font = "bold 14px 'Georgia', 'Songti SC', serif";
      const tw = ctx.measureText(floatingToast.msg).width + 36;
      ctx.fillStyle = "rgba(44, 34, 30, 0.9)";
      ctx.strokeStyle = "#d49b38";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect((W - tw) / 2, floatingToast.y, tw, 34, 17);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "#fff6e0";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(floatingToast.msg, W / 2, floatingToast.y + 17);
      ctx.restore();
      if (floatingToast.timer <= 0) floatingToast = null;
    }

    requestAnimationFrame(loop);
  }

  resize();
  updateHUD();
  requestAnimationFrame(loop);
})();
</script>
</body>
